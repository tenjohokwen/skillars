x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: skillars:uat
    # docker-compose.yml's own limits (2.0 CPUs, 2GB memory) target the multi-core Hetzner
    # boxes production/uat-deployment.md are built for. Neither fits a 1 vCPU / 1GB
    # Hostwinds plan: Docker refuses to even create the container if `cpus` exceeds the
    # host's actual CPU count ("range of CPUs is from 0.01 to 1.00, as there are only 1
    # CPUs available"), and a 2GB memory ceiling is double the box's entire RAM. `memory`
    # here (460m) is a deliberately tight budget, not a comfortable one — see the
    # `JAVA_TOOL_OPTIONS` override below for how the JVM itself is kept under it, and
    # uat-hostwinds-deployment.md's "Resource budget" section for the full box-wide
    # accounting this number came from and why it may need adjusting on first boot.
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 460m
    environment:
      - SPRING_PROFILES_ACTIVE=uat
      # The Dockerfile's own ENV JAVA_TOOL_OPTIONS="-Duser.timezone=UTC" is fully replaced
      # (not appended to) by this override, so -Duser.timezone=UTC is repeated here.
      # -Xmx256m: heap ceiling, leaves room for metaspace/threads/native memory below the
      # 460m container limit above — without an explicit -Xmx the JVM would default to
      # 25% of the *container's* memory limit (~115m), too small for this many modules
      # (payment, booking, security, filestorage, video, admin, marketplace, ...) to load
      # without constant GC thrash.
      # -XX:MaxMetaspaceSize=150m: class metadata for all those modules adds up; capped so
      # a leak/miscalculation here can't silently eat the memory budgeted for heap instead.
      # -XX:ReservedCodeCacheSize=48m: JIT-compiled code cache, smaller than default (240m)
      # — acceptable since this is a one-time smoke test, not a long-running/hot-path box.
      # -XX:+UseSerialGC: G1 (the JVM's default since Java 9) reserves memory for
      # concurrent GC threads/regions sized for much larger heaps than 256m — SerialGC is
      # the standard recommendation for small, resource-constrained JVM containers.
      - JAVA_TOOL_OPTIONS=-Duser.timezone=UTC -Xmx256m -XX:MaxMetaspaceSize=150m -XX:ReservedCodeCacheSize=48m -XX:+UseSerialGC
      # Nothing in the current codebase actually uses Redis (see uat-hostwinds-deployment.md
      # "Resource budget" for how this was confirmed) — Lettuce connects lazily, so the app
      # boots fine either way, but Spring Boot Actuator's Redis health indicator still tries
      # an eager PING as part of /manage/health, which would otherwise drag the whole
      # aggregate health check to DOWN for no functional reason. Same pattern as
      # MANAGEMENT_HEALTH_MAIL_ENABLED below.
      - MANAGEMENT_HEALTH_REDIS_ENABLED=false
      # docker-compose.yml hardcodes LOKI_ENABLED=true/LOKI_URL=http://loki:3100
      # unconditionally on this service — logback-spring.xml really does attach a
      # Loki4jAppender to the root logger when loki.enabled=true (see "Logging" in
      # uat-hostwinds-deployment.md), so leaving that true here, with no `loki` container
      # on the network to receive it, means every log batch fails to resolve/send. Not
      # fatal (Loki4jAppender's HTTP sender fails async, doesn't crash the app), but noisy
      # and pointless when there's nowhere for it to go — this override turns it back off.
      - LOKI_ENABLED=false
      # Stripe TEST-mode credentials only — see docker-compose.uat.yml for the full
      # rationale (PaymentConfig's live-key guard, why standard-secret-not-restricted).
      - APP_PAYMENT_STRIPE_API_KEY=${APP_PAYMENT_STRIPE_API_KEY}
      - APP_PAYMENT_STRIPE_WEBHOOK_SECRET=${APP_PAYMENT_STRIPE_WEBHOOK_SECRET}
      - APP_PAYMENT_STRIPE_OAUTH_CLIENT_ID=${APP_PAYMENT_STRIPE_OAUTH_CLIENT_ID}
      - APP_VIDEO_BUNNY_LIBRARY_ID=${BUNNY_LIBRARY_ID:-123456}
      - APP_VIDEO_BUNNY_API_KEY=${BUNNY_API_KEY:-}
      - APP_VIDEO_BUNNY_CDN_HOSTNAME=${BUNNY_CDN_HOSTNAME:-}
      # Fail-fast if blank — see docker-compose.uat.yml for why (Cryptopher /
      # BunnyVideoProviderAdapter both refuse to start the whole app context).
      - APP_VIDEO_BUNNY_WEBHOOK_SIGNING_SECRET=${APP_VIDEO_BUNNY_WEBHOOK_SIGNING_SECRET}
      - APP_VIDEO_PLAYBACK_SIGNING_SECRET=${APP_VIDEO_PLAYBACK_SIGNING_SECRET}
      - PLATFORM_PIN_ENCRYPTION_SECRET=${PLATFORM_PIN_ENCRYPTION_SECRET}
      # Same single-endpoint constraint as docker-compose.uat.yml (S3Presigner bakes
      # app.storage.endpoint-url into every presigned URL it hands back) — but there's no
      # STORAGE_DOMAIN/Traefik here, just the one real hostname this box already has, on
      # MinIO's directly-published port. See `extra_hosts` below for why the app container
      # can reach this same URL reliably.
      - APP_STORAGE_BUCKET=${APP_STORAGE_BUCKET}
      - APP_STORAGE_ENDPOINT_URL=http://${DOMAIN}:9500
      - APP_STORAGE_S3_ACCESS_KEY=${MINIO_ROOT_USER}
      - APP_STORAGE_S3_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MANAGEMENT_HEALTH_MAIL_ENABLED=${MANAGEMENT_HEALTH_MAIL_ENABLED:-false}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD:-}
      - GMAIL_PASSWORD=${GMAIL_PASSWORD:-}
      - GMX_PASSWORD=${GMX_PASSWORD:-}
    # Makes `http://${DOMAIN}:9500/...` (the value baked into every presigned URL, above)
    # resolve straight to this Docker host's gateway from inside the container, instead of
    # a real DNS lookup + round-trip out to the public internet and back in on the same
    # box's own public IP ("NAT hairpin") — which Docker's own iptables NAT rules aren't
    # guaranteed to handle cleanly even on a VPS where the OS itself would. `host-gateway`
    # is the Docker-documented way to sidestep that ambiguity entirely (Docker Engine
    # 20.10+, already satisfied by a fresh install).
    extra_hosts:
      - "${DOMAIN}:host-gateway"
    ports:
      # Bound to localhost only — reached via the box's existing nginx (port 80), not
      # directly from the internet. See uat-hostwinds-deployment.md for why this doesn't
      # need any nginx changes once gulliver is stopped.
      - "127.0.0.1:9990:9990"
      - "127.0.0.1:8367:8367"
    depends_on:
      minio:
        condition: service_healthy

  # No Traefik, no LGTM stack (Loki/Tempo/Prometheus/Grafana) in this file at all — this
  # override is meant to be used with an explicit service list
  # (`up -d app postgres redis minio minio-init`, see uat-hostwinds-deployment.md), not
  # `up -d` with no arguments, so those services from the base docker-compose.yml are never
  # started. LOKI_ENABLED is turned off above; MANAGEMENT_OTLP_TRACING_ENDPOINT (tempo) is
  # left as-is — the OTLP exporter fails silently/async on an unreachable collector, unlike
  # the Loki appender, so it doesn't need the same treatment.
  #
  # `postgres` and `redis` are NOT dropped from this deployment even though the box also
  # has its own native PostgreSQL (used by gulliver) and nothing in the app actually uses
  # Redis — `app`'s `depends_on: {postgres, redis}` is defined in the base
  # docker-compose.yml, and Compose merges `depends_on` rather than letting an override
  # replace or clear it (confirmed empirically — an override here would silently do
  # nothing), so both containers start regardless of what's listed after `up -d`. Fighting
  # that with the `!reset`/`!override` YAML merge tags was considered and rejected: they're
  # tied to a Compose Spec version this file can't guarantee the installed CLI supports.
  # Right-sizing them below, and stopping the *native* Postgres instead (Step 1), gets
  # nearly the same RAM back without that fragility.
  postgres:
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 220m

  redis:
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 48m

  # Stands in for the real S3 API. Unlike docker-compose.uat.yml, there's no
  # STORAGE_DOMAIN/Traefik here — this box only has the one real hostname (DOMAIN), so
  # MinIO's S3 API port is published directly instead of routed through a reverse proxy.
  # (A path-based nginx location block was considered and rejected: S3 SigV4 signatures
  # cover the exact host/path used, so inserting an nginx path prefix breaks presigned URL
  # validation unless carefully rewritten — directly publishing the port avoids that whole
  # class of problem.)
  minio:
    image: minio/minio:RELEASE.2024-01-13T07-53-03Z
    command: server /data --address ":9500" --console-address ":9501"
    # No limit at all otherwise — this is new to this stripped-down file (unlike
    # postgres/redis, minio isn't in the base docker-compose.yml with its own defaults to
    # cap down), so it would run under Docker's unbounded default without this.
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 140m
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - skillars-uat-hostwinds-minio:/data
    ports:
      # Publicly reachable on purpose — real browsers need to reach presigned URLs built
      # from APP_STORAGE_ENDPOINT_URL above. Needs `ufw allow 9500/tcp` (not needed for
      # 9990, which stays localhost-only behind nginx) — see uat-hostwinds-deployment.md.
      - "9500:9500"
    healthcheck:
      # mc ready assumes MinIO's default port 9000 — doesn't work with the custom
      # --address above, so point an inline alias at the real port instead.
      test: ["CMD-SHELL", "mc alias set healthcheck http://localhost:9500 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD >/dev/null 2>&1 && mc ready healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - skillars-internal
    restart: unless-stopped
    # Neither `minio` nor `minio-init` exist in the base docker-compose.yml, so unlike
    # `app`/`postgres`/`redis` (which inherit `logging: *default-logging` from there),
    # these would otherwise use Docker's unbounded default log driver — fine short-term,
    # but a real disk-fill risk left running for a while on a small VPS (see
    # local-deployment.md's own "no space left on device" troubleshooting entry for
    # exactly this class of problem with the LGTM containers).
    logging: *default-logging

  # One-shot: creates the bucket on every startup (no-op if it already exists).
  minio-init:
    image: minio/mc:RELEASE.2024-01-13T08-44-48Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - APP_STORAGE_BUCKET=${APP_STORAGE_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9500 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$APP_STORAGE_BUCKET
      "
    networks:
      - skillars-internal
    logging: *default-logging

volumes:
  skillars-uat-hostwinds-minio:
