summary: Coach search language filter lowercases the query but compares it against languages stored verbatim
expected_findings:
  - id: F1
    title: findIdsByLanguage lowercases only the input, not the stored array elements
    category: logic
    severity: medium
    description: >
      CoachProfileRepository.findIdsByLanguage runs `lower(:lang) = ANY(languages)`: the parameter is
      lowercased, the stored array elements are not. CoachProfileService.saveStep1 stores
      req.languages() exactly as submitted (ProfileBuilderStep1Request only requires non-blank
      strings) and the profile builder's picker offers capitalised values such as 'English' and
      'German'. A stored 'English' never equals 'english', so the id list CoachSearchService feeds
      into the search is empty and any coach search with a language set returns no coach at all.
    anchors:
      - file: src/main/java/com/softropic/skillars/platform/marketplace/repo/CoachProfileRepository.java
        symbol: findIdsByLanguage
      - file: src/main/java/com/softropic/skillars/platform/marketplace/service/CoachProfileService.java
        symbol: saveStep1
      - file: src/main/java/com/softropic/skillars/platform/marketplace/service/CoachSearchService.java
        symbol: findIdsByLanguage
      - file: src/frontend/src/components/profileBuilder/ProfileBuilderStep1.vue
        symbol: languageOptions
