id: 319-csam-suspension-logout-login-limiter
kind: pre-fix-snapshot
fix_pr: 319
fix_merge: 90b8cb80
confidence: high
scope:
  - src/main/java/com/softropic/skillars/platform/security/infrastructure/listener/AccountSuspensionEventListener.java
  - src/main/java/com/softropic/skillars/platform/security/config/SecurityConfiguration.java
  - src/main/java/com/softropic/skillars/platform/security/service/AuthService.java
  - src/main/java/com/softropic/skillars/platform/security/service/LoginAttemptsService.java
  - src/main/java/com/softropic/skillars/platform/security/infrastructure/FraudAwareAuthenticationManager.java
  - src/main/java/com/softropic/skillars/platform/security/infrastructure/listener/AuthenticationFailureListener.java
  - src/main/java/com/softropic/skillars/platform/security/repo/LoginAttemptRepository.java
  - src/main/java/com/softropic/skillars/platform/security/repo/UserRepository.java
  - src/main/java/com/softropic/skillars/platform/security/contract/Principal.java
