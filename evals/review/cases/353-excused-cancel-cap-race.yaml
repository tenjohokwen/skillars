id: 353-excused-cancel-cap-race
kind: pre-fix-snapshot
fix_pr: 353
fix_merge: b6a7945f
scope:
  - src/main/java/com/softropic/skillars/platform/payment/service/CancellationRefundService.java
  - src/main/java/com/softropic/skillars/platform/payment/repo/CoachCancellationHistoryRepository.java
summary: rolling-window excused-cancellation cap is counted without serialising concurrent cancels by the same coach
confidence: high
expected_findings:
  - id: F1
    title: Concurrent excused cancels by one coach both pass the cap check and skip the strike
    category: concurrency
    severity: medium
    description: >
      `CancellationRefundService.onBookingCancelledByCoach` runs REQUIRES_NEW, inserts the
      `coach_cancellation_history` row via `saveCancellationHistory`, then `exceedsExcusedCancellationCap`
      counts the coach's excused rows in the window with
      `countByCoachIdAndCancelReasonInAndCreatedAtAfter`. Nothing serialises two cancellations by the same
      coach: under READ COMMITTED each transaction sees only its own uncommitted insert, both count
      `max` rather than `max + 1`, and the `COACH_CANCELLATION_EXCUSED_LIMIT` strike that should fire when the
      cap is crossed is never issued.
    anchors:
      - file: src/main/java/com/softropic/skillars/platform/payment/service/CancellationRefundService.java
        symbol: onBookingCancelledByCoach
      - file: src/main/java/com/softropic/skillars/platform/payment/service/CancellationRefundService.java
        symbol: exceedsExcusedCancellationCap
      - file: src/main/java/com/softropic/skillars/platform/payment/repo/CoachCancellationHistoryRepository.java
        symbol: countByCoachIdAndCancelReasonInAndCreatedAtAfter
non_findings:
  - title: No FOR UPDATE on coach_profiles in this listener
    reason: ReliabilityStrikeService.issue runs REQUIRES_NEW and locks the coach row itself; taking it here would self-deadlock (55P03). A reviewer proposing a coach-row lock is wrong; an advisory lock or equivalent is the shape.
source: PR #353 description, "Gap 2"
notes: Input revision b6a7945f^1. The strike is issued after the count via issueStrikeSafely.
