summary: The refresh grace window redirects a stale token to the account's newest live token instead of its own successor
expected_findings:
  - id: F1
    title: Refresh grace window hands the caller another session's live token, then triggers mass revocation
    category: logic
    severity: high
    description: >
      In AuthService.refresh a used token presented within REFRESH_GRACE_WINDOW (30 s) of its rotatedAt
      is "redirected" via findFirstByUserIdAndUsedFalseAndExpiresAtAfterOrderByCreatedAtDesc(ownerId, now),
      which returns the newest unused token of the whole account; RefreshToken has no successor or
      family column tying a rotated token to its replacement. With two devices, A refreshes (T0 to T1)
      and B logs in within 30 s (T2); a stale request still carrying T0 is given T2 and rotates it to
      T3, so B's cookie now holds a used token. B's next refresh, past the window, takes the theft
      branch and markAllUsedByUserId plus invalidateSessionsForUser log out every session of the user.
      The same lookup lets anyone replaying a just-rotated token within 30 s obtain a fresh credential
      for whichever session is newest.
    anchors:
      - file: src/main/java/com/softropic/skillars/platform/security/service/AuthService.java
        symbol: refresh
      - file: src/main/java/com/softropic/skillars/platform/security/service/AuthService.java
        symbol: REFRESH_GRACE_WINDOW
      - file: src/main/java/com/softropic/skillars/platform/security/repo/RefreshTokenRepository.java
        symbol: findFirstByUserIdAndUsedFalseAndExpiresAtAfterOrderByCreatedAtDesc
