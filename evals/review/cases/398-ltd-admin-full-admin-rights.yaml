summary: Admin role tiers (S-28) - LTD_ADMIN has the full admin surface; user deletion open to any role
expected_findings:
  - id: F1
    title: ROLE_LTD_ADMIN is granted every admin endpoint, including finance, config, GDPR and all state changes
    category: security
    severity: high
    description: >
      SecurityConstants.HAS_ADMIN_ROLE is "hasRole('ROLE_ADMIN') or hasRole('ROLE_LTD_ADMIN')" and it is
      the only admin expression used, applied at class level on AdminFinanceResource and per method on
      ConfigResource, AdminGdprResource, AdminDisputeResource and the other admin resources. A "limited"
      admin can release held payouts, change platform config, list GDPR requests, resolve disputes and
      suspend users exactly like a full ADMIN; the tier is nominal.
    anchors:
      - file: src/main/java/com/softropic/skillars/infrastructure/security/SecurityConstants.java
        symbol: HAS_ADMIN_ROLE
      - file: src/main/java/com/softropic/skillars/platform/payment/api/AdminFinanceResource.java
        symbol: AdminFinanceResource
      - file: src/main/java/com/softropic/skillars/platform/config/api/ConfigResource.java
        symbol: ConfigResource
      - file: src/main/java/com/softropic/skillars/platform/admin/api/AdminGdprResource.java
        symbol: AdminGdprResource
  - id: F2
    title: UserAdminService.deleteUserInformation is authorised for any authenticated role
    category: security
    severity: high
    description: >
      deleteUserInformation is annotated @PreAuthorize(HAS_ANY_ROLE), which includes USER, COACH, PARENT
      and PLAYER, while the sibling lockUserAccount requires an admin role. Any authenticated caller that
      reaches this service method can delete another user's information by login; it also has no
      production callers.
    anchors:
      - file: src/main/java/com/softropic/skillars/platform/security/service/UserAdminService.java
        symbol: deleteUserInformation
  - id: F3
    title: AlertRule update deletes the old rule before saving the new one outside a transaction, so a failed save loses the rule
    category: database
    severity: medium
    description: >
      AlertRuleAdminResource.update is not @Transactional, and its AlertRuleRequest body is neither
      @Valid nor constrained. alertRuleRepository.deleteById(id) commits in its own repository
      transaction, then the rebuilt AlertRule is saved in a separate one. A PUT with a null metricName or
      threshold, or a threshold outside precision(10,4), violates the NOT NULL or numeric constraint on
      save after the delete has already committed, so the rule is gone and alerting on that metric stops
      silently. Even when the save succeeds the rule gets a new generated id, so PUT /{id} changes the
      resource's id.
    anchors:
      - file: src/main/java/com/softropic/skillars/platform/notification/api/AlertRuleAdminResource.java
        symbol: update
      - file: src/main/java/com/softropic/skillars/platform/notification/api/AlertRuleAdminResource.java
        symbol: AlertRuleRequest
