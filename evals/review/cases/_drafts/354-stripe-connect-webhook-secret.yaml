id: 354-stripe-connect-webhook-secret
kind: pre-fix-snapshot
fix_pr: 354
fix_merge: dd2ec9c7
scope:
  - src/main/java/com/softropic/skillars/platform/payment/service/StripeWebhookService.java
  - src/main/java/com/softropic/skillars/platform/payment/api/StripeWebhookResource.java
  - src/main/java/com/softropic/skillars/platform/payment/config/PaymentProperties.java
  - src/main/java/com/softropic/skillars/platform/payment/service/StripeOnboardingService.java
  - src/main/java/com/softropic/skillars/platform/payment/service/StripeClient.java
  - src/main/java/com/softropic/skillars/platform/security/config/AppEndpoints.java
summary: connected-account events are verified against the account webhook secret and onboarding status is never read back from Stripe
confidence: high
expected_findings:
  - id: F1
    title: account.updated from connected accounts is verified against the wrong webhook secret
    category: logic
    severity: high
    description: >
      `StripeWebhookService.verifySignature` constructs every event with the single
      `paymentProperties.getWebhookSecret()`, and `handleEventAtomically` dispatches `account.updated` from
      that same endpoint. Stripe delivers connected-account events only to a Connect webhook endpoint, which
      has its own signing secret, so in production every `account.updated` fails verification. Since
      `handleAccountUpdated` is the only code that sets `onboardingStatus = "COMPLETE"` and records the
      `transfers` capability, coach onboarding can never complete and payouts never leave HOLD.
    anchors:
      - file: src/main/java/com/softropic/skillars/platform/payment/service/StripeWebhookService.java
        symbol: verifySignature
      - file: src/main/java/com/softropic/skillars/platform/payment/service/StripeWebhookService.java
        symbol: handleAccountUpdated
      - file: src/main/java/com/softropic/skillars/platform/payment/config/PaymentProperties.java
        symbol: webhookSecret
  - id: F2
    title: Coach onboarding status has no fallback read from Stripe
    category: architecture
    severity: medium
    description: >
      `StripeOnboardingService.handleOAuthCallback` upserts the row as PENDING and `getStripeStatus`
      returns only what is stored; `StripeClient` has no `Account.retrieve` wrapper. The stored status
      therefore depends entirely on webhook delivery. A missed, failed or mis-verified `account.updated`
      leaves the coach PENDING indefinitely with no way for the status endpoint or the callback to recover.
    anchors:
      - file: src/main/java/com/softropic/skillars/platform/payment/service/StripeOnboardingService.java
        symbol: getStripeStatus
      - file: src/main/java/com/softropic/skillars/platform/payment/service/StripeOnboardingService.java
        symbol: handleOAuthCallback
  - id: F3
    title: account.application.deauthorized is not handled, so a disconnected coach keeps COMPLETE status
    category: edge-case
    severity: medium
    description: >
      `handleEventAtomically` routes `account.updated` and the subscription/invoice/dispute types only. When
      a coach disconnects the platform from their Stripe dashboard, Stripe emits
      `account.application.deauthorized`; nothing marks the row RESTRICTED or clears the `transfers`
      capability, so payout transfers keep being attempted against an account that has revoked access and
      fail on every retry.
    anchors:
      - file: src/main/java/com/softropic/skillars/platform/payment/service/StripeWebhookService.java
        symbol: handleEventAtomically
  - id: F4
    title: Reconnecting a coach keeps the stale last_event_created_at guard from the previous account
    category: edge-case
    severity: low
    description: >
      `upsertCoachStripeAccount` resets `onboardingStatus` to PENDING for an existing row but does not
      clear `lastEventCreatedAt` (or the old account's `transfers_capability`) when the coach reconnects.
      `handleAccountUpdated`'s stale guard then drops the new account's first `account.updated` if its
      `created` is older than the previous account's last event.
    anchors:
      - file: src/main/java/com/softropic/skillars/platform/payment/service/StripeOnboardingService.java
        symbol: upsertCoachStripeAccount
      - file: src/main/java/com/softropic/skillars/platform/payment/service/StripeWebhookService.java
        symbol: handleAccountUpdated
source: PR #354 description, "Problem" and "Follow-up commit"
notes: Input revision dd2ec9c7^1. F1 is the production blocker; F3 comes from the follow-up commit in the same PR.
