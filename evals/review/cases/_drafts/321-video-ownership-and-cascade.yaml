id: 321-video-ownership-and-cascade
kind: pre-fix-snapshot
fix_pr: 321
fix_merge: b5851405
confidence: high
scope:
  - src/main/java/com/softropic/skillars/platform/video/service/PlaybackService.java
  - src/main/java/com/softropic/skillars/platform/video/api/VideoPlayResource.java
  - src/main/java/com/softropic/skillars/platform/video/api/VideoEventResource.java
  - src/main/java/com/softropic/skillars/platform/video/service/VideoAccessGuard.java
