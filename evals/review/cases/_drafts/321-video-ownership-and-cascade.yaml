  The introducing-diff check for F5 against #319 (90b8cb80) was NOT confirmed: the pre-#319 code
  already logged "Cannot suspend account — user not found" and returned (visible as a removed line
  in that diff), so #319 preserved rather than introduced the swallow. Hence F5 is kept here as a
  snapshot finding. Item 5 (stale "Tier gate first" comment in RadarAssessmentService) is comment-only
  and omitted. The flagged-video owner email and the approval emails are in 321-video-approval-emails.
