id: 384-password-change-keeps-sessions
kind: pre-fix-snapshot
fix_pr: 384
fix_merge: a4b3ed40
confidence: high
scope:
  - src/main/java/com/softropic/skillars/platform/security/service/PasswordResetService.java
  - src/main/java/com/softropic/skillars/platform/security/service/UserProfileService.java
summary: Password change and reset (S-05) leave existing sessions and refresh tokens valid
expected_findings:
  - id: F1
    title: Password change and password reset do not revoke existing sessions or refresh tokens
    category: security
    severity: medium
    description: >
      UserProfileService.changePassword and PasswordResetService.completePasswordReset re-encode the
      password and publish/return, but neither marks the user's refresh tokens used nor sets the user's
      session-invalidation marker. A user resetting their password after a suspected compromise leaves
      the attacker's refresh token and JWTs fully usable until they expire.
    anchors:
      - file: src/main/java/com/softropic/skillars/platform/security/service/UserProfileService.java
        symbol: changePassword
      - file: src/main/java/com/softropic/skillars/platform/security/service/PasswordResetService.java
        symbol: completePasswordReset
source: PR #384 description, S-05
notes: >
  The fix revokes the caller's own session too (decision). A reviewer suggesting "keep the current
  session" is not wrong; score on the revocation gap only.
