summary: Pack purchase saves the client-supplied card as the payer's default before charging it
expected_findings:
  - id: F1
    title: The parent's saved default card is overwritten before the charge, so a declined card sticks and the subscription sync is skipped later
    category: logic
    severity: high
    description: >
      SessionPackPaymentService.purchasePack calls getOrCreateStripeCustomer(parentId, paymentMethodId),
      which writes the new paymentMethodId into stripe_customers.stripe_payment_method_id and saves,
      before paymentGateway.chargeAndCapture runs (the gateway reads the card from that row). If the
      charge is declined or throws, nothing restores previousCard: the declined card is now the saved
      default that subscribeCoach/subscribePlayer and later pack charges use, while the Stripe
      subscriptions still point at the old card. Only scheduleSubscriptionCardSync is gated on
      success, although its javadoc says the card change happens only after the charge succeeds. If
      the parent then retries with the same card and it succeeds, previousCard already equals
      paymentMethodId, so scheduleSubscriptionCardSync returns early and the subscriptions are never
      moved onto the new card.
    anchors:
      - file: src/main/java/com/softropic/skillars/platform/payment/service/SessionPackPaymentService.java
        symbol: purchasePack
      - file: src/main/java/com/softropic/skillars/platform/payment/service/SessionPackPaymentService.java
        symbol: getOrCreateStripeCustomer
      - file: src/main/java/com/softropic/skillars/platform/payment/service/SessionPackPaymentService.java
        symbol: scheduleSubscriptionCardSync
      - file: src/main/java/com/softropic/skillars/platform/payment/service/StripePaymentGateway.java
        symbol: chargeAndCapture
