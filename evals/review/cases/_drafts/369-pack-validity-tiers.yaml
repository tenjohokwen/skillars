summary: pack expiry is hard-coded to 60 days while the seeded pack.expiry.days.tier1..4 config keys are never read
confidence: medium
expected_findings:
  - id: F1
    title: Pack expiry hard-coded to 60 days; seeded tier config keys are dead
    category: logic
    severity: medium
    description: >
      `SessionPackPaymentService.createPurchase` sets `expiresAt = Instant.now().plus(60, DAYS)` for every
      pack regardless of size. `V139__baseline_seed_data.sql` seeds `pack.expiry.days.tier1..tier4`
      (90/180/365/548 days by session count) but no code reads them and `ConfigBounds` does not register
      them, so an admin editing those values in `/admin/config` changes nothing. An 11-session pack expires
      in 60 days instead of the documented 548.
    anchors:
      - file: src/main/java/com/softropic/skillars/platform/payment/service/SessionPackPaymentService.java
        symbol: createPurchase
