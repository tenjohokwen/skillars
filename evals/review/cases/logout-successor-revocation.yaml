summary: Logout revokes only the presented refresh token, and only while it is unused; a concurrently rotated successor stays live
expected_findings:
  - id: F1
    title: Logout does not revoke the live refresh token when the presented token was already rotated
    category: concurrency
    severity: high
    description: >
      AuthService.logout looks up the token from the rtkn cookie and marks it used only when
      `.filter(t -> !t.isUsed())` passes; an already-used token is left alone and nothing else
      belonging to the user is touched. When a /api/auth/refresh from another tab or an interceptor
      retry rotates the token while the logout POST is in flight with the old cookie, logout finds a
      used token and does nothing, so the successor token minted by that refresh stays valid for its
      full TTL. RefreshToken has no successor link, so logout cannot follow the rotation, and if the
      refresh response lands after the logout response its Set-Cookie headers put the session back in
      the browser: the user is logged in again right after clicking Logout.
    anchors:
      - file: src/main/java/com/softropic/skillars/platform/security/service/AuthService.java
        symbol: logout
      - file: src/main/java/com/softropic/skillars/platform/security/repo/RefreshToken.java
        symbol: rotatedAt
