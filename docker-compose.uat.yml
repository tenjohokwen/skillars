services:
  app:
    environment:
      - SPRING_PROFILES_ACTIVE=uat
      # Stripe TEST-mode credentials only. PaymentConfig (see
      # src/main/java/.../payment/config/PaymentConfig.java) refuses to start under the
      # "uat" profile if this resolves to a live key (sk_live_...) — see
      # docs/deployment/uat-deployment.md for how to get a test-mode key and register a
      # webhook endpoint against this box's public domain.
      - APP_PAYMENT_STRIPE_API_KEY=${APP_PAYMENT_STRIPE_API_KEY}
      - APP_PAYMENT_STRIPE_WEBHOOK_SECRET=${APP_PAYMENT_STRIPE_WEBHOOK_SECRET}
      - APP_PAYMENT_STRIPE_OAUTH_CLIENT_ID=${APP_PAYMENT_STRIPE_OAUTH_CLIENT_ID}
      # Same VideoProviderConfig gotcha documented in docker-compose.local.yml /
      # local/deployment.md: app.video.bunny.library-id is eagerly validated as numeric
      # by a non-lazy bean, so a blank value fails the *entire* app context on boot,
      # not just video features. BUNNY_LIBRARY_ID isn't a secret (just a numeric account
      # ID), so it's the one variable here allowed a literal placeholder fallback.
      - APP_VIDEO_BUNNY_LIBRARY_ID=${BUNNY_LIBRARY_ID:-123456}
      - APP_VIDEO_BUNNY_API_KEY=${BUNNY_API_KEY:-}
      - APP_VIDEO_BUNNY_CDN_HOSTNAME=${BUNNY_CDN_HOSTNAME:-}
      # BunnyVideoProviderAdapter's constructor throws IllegalArgumentException if this is
      # blank — same non-lazy bean as above, so a missing value crashes the whole app
      # context on boot, not just video features, even though UAT may never touch real
      # video. No fallback default: set a real value in .env.uat (any non-blank string
      # unblocks startup; only real Bunny webhook verification needs the real key).
      - APP_VIDEO_BUNNY_WEBHOOK_SIGNING_SECRET=${APP_VIDEO_BUNNY_WEBHOOK_SIGNING_SECRET}
      # Not fail-fast at boot — only fails the first time a playback JWT is issued. Still
      # no fallback default: generate a real one (see uat-deployment.md) rather than
      # discovering the gap when someone actually tries to watch a video.
      - APP_VIDEO_PLAYBACK_SIGNING_SECRET=${APP_VIDEO_PLAYBACK_SIGNING_SECRET}
      # Cryptopher (platform.security) throws EncryptionException and refuses to start the
      # whole app context if this is blank — it's already fail-fast in the Java code, this
      # line just makes sure the value in .env.uat actually reaches the container (base
      # docker-compose.yml doesn't pass it through for prod either — separate, pre-existing
      # gap not fixed here).
      - PLATFORM_PIN_ENCRYPTION_SECRET=${PLATFORM_PIN_ENCRYPTION_SECRET}
      - PLATFORM_REGISTRATION_VERIFICATION_SECRET=${PLATFORM_REGISTRATION_VERIFICATION_SECRET}
      # MinIO stands in for the real S3 API — see the `minio` service below. Both the app
      # container and real browsers (for presigned upload/download URLs) need to resolve
      # the *same* host, since S3Presigner bakes app.storage.endpoint-url straight into
      # every presigned URL — so this points at the public STORAGE_DOMAIN (routed to the
      # minio service via Traefik below), not the internal `minio:9500` compose DNS name.
      - APP_STORAGE_BUCKET=${APP_STORAGE_BUCKET}
      - APP_STORAGE_ENDPOINT_URL=https://${STORAGE_DOMAIN}
      - APP_STORAGE_S3_ACCESS_KEY=${MINIO_ROOT_USER}
      - APP_STORAGE_S3_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      # First-admin bootstrap (AdminBootstrapRunner). No migration seeds an admin USER and there
      # is no admin registration endpoint, so without this the admin account type simply cannot
      # exist — see uat-deployment.md Step 8.
      # BLANK = DISABLED. The runner no-ops unless EMAIL and PASSWORD are both non-blank, so
      # leaving these unset (the .env.example default) changes nothing. PHONE is required whenever
      # the other two are set: main."user".phone is UNIQUE, so there is no shareable placeholder.
      # REMOVE APP_BOOTSTRAP_ADMIN_PASSWORD FROM .env.uat AND REDEPLOY once the first boot has
      # logged "Admin bootstrap created the first administrator" — a long-running container should
      # not carry the credential in its environment. Re-deploying with it still set is harmless
      # (the runner detects the existing account and skips), it is just needless exposure.
      - APP_BOOTSTRAP_ADMIN_EMAIL=${APP_BOOTSTRAP_ADMIN_EMAIL:-}
      - APP_BOOTSTRAP_ADMIN_PASSWORD=${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
      - APP_BOOTSTRAP_ADMIN_PHONE=${APP_BOOTSTRAP_ADMIN_PHONE:-}
      # ses-1.2 D9 + code review 2026-09-11 (AC7's "confirm rather than assume"): this knob is now
      # DEAD. It configures Spring Boot's OWN mail actuator contributor
      # (MailHealthContributorAutoConfiguration), which is @ConditionalOnBean(JavaMailSenderImpl) —
      # confirmed by inspecting that class. Deleting spring.mail.host (D9) means Boot's
      # MailSenderAutoConfiguration never registers that bean, and this codebase's own
      # MailSenderProvider builds its JavaMailSenderImpl instances with `new`, never as a Spring
      # bean — so the condition can never be satisfied and Boot's `mail` health contributor never
      # exists, regardless of this flag's value. It is NOT a substitute for this codebase's own
      # SmtpHealthIndicator (registered under the separate `notification` health group), which
      # never authenticates at all (TCP connect + 220 banner + EHLO/TLS only) — a blank
      # GMX_PASSWORD/GMAIL_PASSWORD cannot drag /manage/health DOWN through either mechanism. Kept,
      # not removed, per AC7's explicit instruction not to speculatively clean up a line item
      # nobody asked to change.
      # ses-1.2 D9: SPRING_MAIL_PASSWORD removed — it backed Boot's own autoconfigured
      # JavaMailSenderImpl, which nothing in this codebase ever injected.
      - MANAGEMENT_HEALTH_MAIL_ENABLED=${MANAGEMENT_HEALTH_MAIL_ENABLED:-false}
      - GMAIL_PASSWORD=${GMAIL_PASSWORD:-}
      - GMX_PASSWORD=${GMX_PASSWORD:-}
    depends_on:
      minio:
        condition: service_healthy

  # LGTM (Loki/Grafana/Tempo/Prometheus) is NOT trimmed for UAT, unlike
  # docker-compose.local.yml — this file adds to the base docker-compose.yml rather than
  # replacing any of it, so `docker compose -f docker-compose.yml -f docker-compose.uat.yml
  # --env-file .env.uat up -d` (no explicit service list) brings up the full observability
  # stack the same way a plain production deploy does. Nothing to configure here.

  # Stands in for the real S3 API so UAT doesn't need AWS credentials. Publicly reachable
  # (unlike local dev's MinIO, which only needs to work for your own machine) because
  # S3Presigner bakes app.storage.endpoint-url directly into every presigned URL it
  # generates — a browser anywhere on the internet needs to be able to resolve and reach
  # whatever host that is, the same way it would need to reach real S3. Routed through
  # Traefik on its own domain (STORAGE_DOMAIN) with its own Let's Encrypt certificate, the
  # same pattern already used for MONITORING_DOMAIN/grafana below.
  #
  # As of 2026-09-24 this runs SeaweedFS, not MinIO — quay.io/minio/minio (both this pinned
  # tag and :latest) now 401s on anonymous pulls, confirmed via direct `docker pull`; a
  # widely-reported break, not something specific to this project. Service/volume/label names
  # kept as "minio" to minimize the diff; see SharedContainers.MINIO_IMAGE's javadoc
  # (src/test/java/com/softropic/skillars/config/SharedContainers.java) for the full story.
  # SeaweedFS has no env-var-driven credential path worth trusting (seaweedfs/seaweedfs#7311,
  # a live upstream reliability issue), so the entrypoint below writes MINIO_ROOT_USER/
  # MINIO_ROOT_PASSWORD into an S3 identity config file at container start instead — keeps
  # this file's existing "credentials come from .env.uat" contract intact.
  minio:
    image: chrislusf/seaweedfs:3.97
    entrypoint: >
      /bin/sh -c "
      mkdir -p /etc/seaweedfs &&
      printf '{\"identities\":[{\"name\":\"uat\",\"credentials\":[{\"accessKey\":\"%s\",\"secretKey\":\"%s\"}],\"actions\":[\"Admin\",\"Read\",\"Write\",\"List\",\"Tagging\"]}]}' \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" > /etc/seaweedfs/s3.json &&
      exec weed server -s3 -dir=/data -ip.bind=0.0.0.0 -s3.port=9500 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=1024
      "
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - skillars-uat-minio:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio.rule=Host(`${STORAGE_DOMAIN}`)"
      - "traefik.http.routers.minio.entrypoints=websecure"
      - "traefik.http.routers.minio.tls.certresolver=letsencrypt"
      - "traefik.http.routers.minio.service=minio-svc"
      - "traefik.http.services.minio-svc.loadbalancer.server.port=9500"
    healthcheck:
      # No `mc`-equivalent ships in this image; a plain TCP probe on the S3 port is enough
      # to gate `depends_on: condition: service_healthy` below.
      test: ["CMD-SHELL", "nc -z localhost 9500"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - skillars-internal
    restart: unless-stopped

  # One-shot: creates the UAT bucket on every startup (no-op if it already exists).
  # amazon/aws-cli replaces quay.io/minio/mc here — same reasoning as the `minio` service
  # above (mc's own image is under the same now-blocked quay.io/minio/* namespace), and aws-cli
  # is a generic S3 client so it works against SeaweedFS's S3 gateway unmodified.
  minio-init:
    image: amazon/aws-cli:2.31.13
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_DEFAULT_REGION=us-east-1
      - APP_STORAGE_BUCKET=${APP_STORAGE_BUCKET}
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url http://minio:9500 s3 mb s3://$$APP_STORAGE_BUCKET || true
      "
    networks:
      - skillars-internal

volumes:
  skillars-uat-minio:
