# ---------------------------------------------------------------------------------
# skillars-deferred-92 AC12: the 46 keys below existed in messages_en.properties but
# NOT in this file -- and this file is the bundle Spring falls back to when a key is
# missing from the resolved locale's bundle.
#
# That was a live 500. CookieLocaleResolver falls through to Accept-Language when no
# locale cookie is set. A client resolving to any locale other than de, fr or en --
# Spanish, Italian, anything -- got a NoSuchMessageException for security.accountLocked
# (a 500 on the account-lockout response) and for EVERY email.* template key
# (a template failure on every transactional email). This file is the fallback.
# MessageBundleParityTest covered only messages_de and messages_fr against
# messages_en, so nothing caught it.
#
# Values are English on purpose: this is the FALLBACK bundle, not a locale.
# MessageBundleParityTest#defaultBundle_matchesEnglishKeysAndPlaceholders now fails
# the build if this drifts again, in either direction.
# ---------------------------------------------------------------------------------
