app:
  ses:
    # No default: a genuinely missing value must reach the app as blank and trip
    # SesPropertiesValidator, not silently fall back to a literal (see docker-compose.yml's
    # APP_SES_FROM_ADDRESS, which also carries no `:-` default for the same reason).
    from-address: "${APP_SES_FROM_ADDRESS:}"
  email:
    transport: ses
  frontend-url: "${APP_FRONTEND_URL:https://skillars.com}"

email:
  retry:
    enabled: true
loki:
  url: ${LOKI_URL:http://localhost:3100}
  enabled: true

# Story ses-1.3 AC2: prod runs app.email.transport=ses, so SesHealthIndicator is the only registered transport indicator.
management:
  endpoint:
    health:
      group:
        notification:
          include: ses
