<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{email.booking.reschedule_declined_by_parent.title}">Reschedule Declined</title>
</head>
<body>
    <h2>Reschedule Declined</h2>
    <p><strong th:text="${map.parentName}">Parent</strong> was unable to accommodate the proposed reschedule. The original session time on <strong th:text="${map.originalStartTime}">date</strong> (<span th:text="${map.canonicalTimezone}">timezone</span>) stands.</p>
    <p>Log in to Skillars to view your schedule.</p>
</body>
</html>
