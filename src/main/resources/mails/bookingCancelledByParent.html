<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{email.booking.cancelled_by_parent.title}">Session Cancelled by Parent</title>
</head>
<body>
    <h2 th:text="#{email.booking.cancelled_by_parent.title}">Session Cancelled by Parent</h2>
    <p>The family has cancelled their session with you on <strong th:text="${map.requestedStartTime}">date</strong> (<span th:text="${map.canonicalTimezone}">timezone</span>).</p>
    <p>This slot is now free for new bookings. You can review your bookings on Skillars: <a th:href="${map.bookingsUrl}" th:text="${map.bookingsUrl}">bookings</a></p>
</body>
</html>
