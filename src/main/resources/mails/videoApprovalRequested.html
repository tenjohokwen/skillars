<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{email.video.approval.requested.title}">A Video Is Waiting for Your Approval</title>
</head>
<body>
    <h2 th:text="#{email.video.approval.requested.title}">A Video Is Waiting for Your Approval</h2>
    <p><strong th:text="${map.playerName}">Your child</strong> uploaded a video. It passed our automated safety checks, but because they are under 18 it stays hidden until you approve it.</p>
    <p>Please review the video and approve or reject it.</p>
    <p><a th:href="${map.approvalsUrl}" href="#">Review pending videos</a></p>
</body>
</html>
