app:
  environment: "${ENVIRONMENT:dev}"
  # A fresh local database has no JWT signing secret and no way to get one short of hand-written
  # SQL replicating Secret's own Jasypt encryption — see JwtSecretBootstrapRunner's own javadoc.
  # Safe here only: the dev profile is never used against a real environment's database.
  bootstrap:
    jwt-secret:
      enabled: true
  ses:
    from-address: "${APP_SES_FROM_ADDRESS:dev@localhost}"
  # ses-1.2: dev now runs the SMTP transport — including registration/OTP mail, for the first time
  # (fixes D4). The old DevSesEmailService/@Profile("!dev") trap this comment used to document is
  # gone since ses-1.1; app.email.log.outbox-dir stays set below, harmless while unused — Phase 5
  # flips dev to `log` and it becomes load-bearing again, so don't delete it.
  email:
    transport: smtp
    log:
      outbox-dir: target/mails
    # Lists replace entirely in Spring — must repeat full entries to override passwords.
    smtp:
      provider-configs:
        -
          name: gmx
          host: mail.gmx.net
          port: 587
          username: blue-bone@gmx.de
          password: "${GMX_PASSWORD:dev_gmx_password}"
        -
          name: gmail
          host: smtp.gmail.com
          port: 587
          username: enkap24@gmail.com
          password: "${GMAIL_PASSWORD:dev_gmail_password}"
  frontend-url: "http://localhost:9000"
  # Local MinIO (see docker-compose.local.yml) instead of real AWS S3 — avoids paid
  # API calls in dev. Point APP_STORAGE_* env vars at real AWS when this profile is
  # ever used against a non-local environment.
  storage:
    bucket: "${APP_STORAGE_BUCKET:skillars-dev}"
    s3:
      access-key: "${APP_STORAGE_S3_ACCESS_KEY:minioadmin}"
      secret-key: "${APP_STORAGE_S3_SECRET_KEY:minioadmin123}"
      path-style-access: true
  video:
    playback:
      signing-secret: "${APP_VIDEO_PLAYBACK_SIGNING_SECRET:dGVzdC1wbGF5YmFjay1zaWduaW5nLXNlY3JldC0zMi1ieXRlcyEh}"
    bunny:
      webhook-signing-secret: "${APP_VIDEO_BUNNY_WEBHOOK_SIGNING_SECRET:dev-webhook-signing-secret}"
    moderation:
      sla-monitor-delay-ms: 60000

features:
  toggles:
    arachnid-enabled: false
    videointel-enabled: false

infrastructure:
  gemini:
    api-key: ${GEMINI_API_KEY:dev-key}

skillars:
  platform:
    pin-encryption-secret: "${PLATFORM_PIN_ENCRYPTION_SECRET:S3CR3TW0RD}"
    registration-verification-secret: "${PLATFORM_REGISTRATION_VERIFICATION_SECRET:dev-registration-verification-secret-32b!}"

# Story ses-1.3 AC2: dev runs app.email.transport=smtp, so SmtpHealthIndicator is the only registered transport indicator.
management:
  endpoint:
    health:
      group:
        notification:
          include: smtp
