app:
  environment: "${ENVIRONMENT:dev}"
  security:
    jwt:
      # DEV ONLY, public in the repository: DeployedSecretsValidator rejects this value under prod/uat.
      signing-key: "${JWT_SIGNING_KEY:ZGV2LW9ubHktand0LXNpZ25pbmcta2V5LS1OT1QtZm9yLXByb2Qtb3ItdWF0LS1sb2NhbC1kZXZlbG9wbWVudC1vbmx5ISE=}"
  ses:
    from-address: "${APP_SES_FROM_ADDRESS:dev@localhost}"
  # ses-1.5: dev runs the `log` transport (source doc D-4, §6.11): every email is logged and, because
  # app.email.log.dump-dir is set below, its rendered body is written to <dump-dir>/<correlationId>.html. No
  # Gmail/GMX credentials or sending domain are needed locally. The file is the only place the OTP / verification
  # link appears (the log line carries just the masked recipient, subject and correlationId), and the file name is
  # a random per-attempt UUID - open the newest file or grep the directory for the recipient.
  # (History: ses-1.2 moved dev to SMTP, fixing D4 - registration/OTP mail had been silently dropped in dev; the
  # old DevSesEmailService/@Profile("!dev") trap is gone since ses-1.1. dump-dir was renamed from outbox-dir by
  # skillars-deferred-110 AC10, which collided in name with platform.outbox's real transactional outbox.)
  # The smtp provider-configs below are kept only because uat still uses the smtp transport and Phase 6
  # (ses-1-6) deletes them; they are inert while transport=log.
  email:
    transport: log
    log:
      dump-dir: target/mails
    # Lists replace entirely in Spring — must repeat full entries to override passwords.
    smtp:
      provider-configs:
        -
          name: gmx
          host: mail.gmx.net
          port: 587
          username: blue-bone@gmx.de
          password: "${GMX_PASSWORD:dev_gmx_password}"
        -
          name: gmail
          host: smtp.gmail.com
          port: 587
          username: enkap24@gmail.com
          password: "${GMAIL_PASSWORD:dev_gmail_password}"
  frontend-url: "http://localhost:9000"
  # Local S3-compatible storage (SeaweedFS; see docker-compose.local.yml's `storage`
  # service) instead of real AWS S3 — avoids paid API calls in dev. Point APP_STORAGE_*
  # env vars at real AWS when this profile is ever used against a non-local environment.
  storage:
    bucket: "${APP_STORAGE_BUCKET:skillars-dev}"
    s3:
      access-key: "${APP_STORAGE_S3_ACCESS_KEY:minioadmin}"
      secret-key: "${APP_STORAGE_S3_SECRET_KEY:minioadmin123}"
      path-style-access: true
  video:
    playback:
      signing-secret: "${APP_VIDEO_PLAYBACK_SIGNING_SECRET:dGVzdC1wbGF5YmFjay1zaWduaW5nLXNlY3JldC0zMi1ieXRlcyEh}"
    bunny:
      webhook-signing-secret: "${APP_VIDEO_BUNNY_WEBHOOK_SIGNING_SECRET:dev-webhook-signing-secret}"
    moderation:
      sla-monitor-delay-ms: 60000

features:
  toggles:
    arachnid-enabled: false
    videointel-enabled: false

infrastructure:
  gemini:
    api-key: ${GEMINI_API_KEY:dev-key}

skillars:
  platform:
    pin-encryption-secret: "${PLATFORM_PIN_ENCRYPTION_SECRET:S3CR3TW0RD}"
    registration-verification-secret: "${PLATFORM_REGISTRATION_VERIFICATION_SECRET:dev-registration-verification-secret-32b!}"

# ses-1.5: deliberately NO management.endpoint.health.group.notification block here. dev runs transport=log, which
# has no health indicator, and Spring Boot's HealthEndpointGroupMembershipValidator aborts startup if an include
# names a contributor that is not registered (the old `include: smtp` would do exactly that). The base
# application.yaml declares no group for the log transport, which is the correct shape. Do not replace this with
# `include: ""` - a blank include means "every contributor" in Boot, not "no group".
# TransportHealthGroupConsistencyTest pins transport <-> include for dev/uat/prod.

# Placeholder machine-client ids for local curl/Postman use only (application.yaml defaults to none).
allowed:
  clients: ${ALLOWED_CLIENTS:myClientId,hisClientId,herClientId,ourClientId}
