name: 'Docker Build'
description: 'Build (and optionally push) the Skillars Docker image with a single pinned docker/build-push-action and GHA layer caching'

inputs:
  push:
    description: 'Push the built image to the registry'
    required: false
    default: 'false'
  load:
    description: 'Load the built image into the local Docker daemon (needed to scan/run it in the same job)'
    required: false
    default: 'false'
  platforms:
    description: 'Target platforms'
    required: false
    default: 'linux/amd64'
  tags:
    description: 'Image tags (newline-separated for multiple)'
    required: true
  labels:
    description: 'Image labels (newline-separated)'
    required: false
    default: ''

outputs:
  imageid:
    description: 'Built image ID'
    value: ${{ steps.build.outputs.imageid }}
  digest:
    description: 'Built image digest'
    value: ${{ steps.build.outputs.digest }}

runs:
  using: 'composite'
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

    - name: Build
      id: build
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
      with:
        context: .
        platforms: ${{ inputs.platforms }}
        push: ${{ inputs.push }}
        load: ${{ inputs.load }}
        tags: ${{ inputs.tags }}
        labels: ${{ inputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
