version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Added 2026-08-08 alongside the CVE remediation in PR #8.
  #
  # Nothing was watching the Java dependencies: GitHub's own Dependabot security
  # updates and vulnerability alerts are both disabled on this repo (private, no
  # Advanced Security), and the only automated check was the Trivy step in
  # pr-build.yml -- which scans the built image, runs on PRs only, and therefore
  # reports the backlog rather than preventing it. Boot sat at 3.5.11 while
  # 3.5.12 through 3.5.16 shipped, and the debt surfaced as 34 CVEs at once.
  #
  # Grouped deliberately. Ungrouped, a Boot patch release opens a dozen PRs for
  # artifacts that only move because the parent moved. The groups below collapse
  # those into one reviewable PR each; anything not matching a pattern still gets
  # its own PR, which is what you want for a genuinely independent bump.
  #
  # GROUPS ARE MINOR/PATCH ONLY -- added after the first run of this config.
  # The original version grouped without constraining update types, and the very
  # first batch produced PR #12: "Bump the spring group with 2 updates", which was
  # actually spring-boot-starter-parent 3.5.16 -> 4.1.0 (Spring Framework 7) sitting
  # next to a spring-cloud bump. It could not even parse the POM, because Boot 4
  # stopped managing four artifacts this project declares without a version.
  #
  # That is the failure mode worth designing against: not the breakage, which CI
  # caught, but a major migration wearing the costume of a routine batch. With
  # update-types constrained, a major arrives as its own PR with the version jump
  # in the title, and nothing else rides along with it.
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      spring:
        update-types: ["minor", "patch"]
        patterns:
          - "org.springframework*:*"
          - "io.micrometer:*"
      aws-sdk:
        update-types: ["minor", "patch"]
        patterns:
          - "software.amazon.awssdk:*"
      testing:
        update-types: ["minor", "patch"]
        patterns:
          - "org.testcontainers:*"
          - "org.junit*:*"
          - "org.mockito:*"
          - "com.github.tomakehurst:*"
          - "org.wiremock*:*"

    # Majors that are migrations, not upgrades. Ignored so they stop being
    # reproposed every week; revisit each as its own piece of scheduled work.
    #
    # Boot 4.x        Spring Framework 7 + a new spring-cloud train. PR #12 failed
    #                 at POM parse: spring-boot-starter-aop and three testcontainers
    #                 artifacts lost their managed versions. Note this does NOT
    #                 block 3.5.x patches, which is where the security fixes land --
    #                 exactly what PR #8 needed.
    # stripe-java 33  PR #17 (28.3.0 -> 33.2.0) failed with 18 `cannot find symbol`
    #                 errors: SubscriptionService (8), StripeWebhookService (6),
    #                 StripeClient (4). Five majors of removed and renamed API.
    #
    # spring-cloud    MINOR is ignored too, and that is not a typo. Constraining the
    #                 groups to minor/patch above was NOT enough to catch this one.
    #                 spring-cloud uses release-train versioning, so 2025.0.1 -> 2025.1.2
    #                 parses as an ordinary semver MINOR while actually being a different
    #                 train pinned to a different Boot MAJOR. PR #21 passed the
    #                 update-types constraint and then failed ~1500 tests with:
    #
    #                   Failed to introspect Class [org.springframework.cloud.context
    #                     .refresh.ConfigDataContextRefresher]
    #                   Caused by: ClassNotFoundException:
    #                     org.springframework.boot.bootstrap.ConfigurableBootstrapContext
    #
    #                 That package is the Boot 4 location. Boot 3.5.16 ships the class as
    #                 org.springframework.boot.ConfigurableBootstrapContext -- verified by
    #                 listing the jar, not inferred. So 2025.1.x needs Boot 4 and can only
    #                 move when the parent does. Patches still flow: 2025.0.2 and 2025.0.3
    #                 both exist on the Boot 3 train.
    #
    #                 The general lesson, worth remembering before trusting update-types
    #                 anywhere else: a semver update-type describes the version STRING, not
    #                 compatibility. For anything versioned by release train or by date,
    #                 "minor" is not a safety signal.
    ignore:
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.stripe:stripe-java"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springframework.cloud:spring-cloud-dependencies"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
