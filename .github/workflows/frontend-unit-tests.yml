# skillars-deferred-104: opt-in frontend unit-test job (Vitest + @vue/test-utils).
#
# This workflow is DELIBERATELY decoupled from the build gate:
#   - it is NOT referenced by ci.yml or pr-build.yml;
#   - it is NOT a required status check / branch-protection rule;
#   - `mvn verify` never invokes Vitest (the Maven `npm test` execution calls the no-op
#     `test` npm script — see pom.xml and docs/testing/frontend-unit-tests.md).
#
# It runs only:
#   1. on manual dispatch (Actions tab → "Frontend Unit Tests" → Run workflow); or
#   2. on a pull request that carries the `frontend-tests` label (add it when a change
#      actually touches frontend logic).
#
# `pull_request: types: [labeled, …]` fires the workflow on every label add; the job-level
# `if` is what keeps it a no-op unless the label is `frontend-tests`. `synchronize` /
# `reopened` keep an already-labelled PR's result fresh on new pushes. `opened`
# (skillars-deferred-109 AC13) lets `gh pr create --label frontend-tests` fire the job in ONE
# step — the job-level `if` still gates on the label, so this stays opt-in and non-gating; it does
# NOT make the job a required check (owner decisions D2/D6 unchanged).
#
# skillars-deferred-109 code review: an earlier revision of this comment claimed GitHub reads this
# file from the BASE ref for `pull_request` events, so the `opened` trigger would only take effect
# from the next PR. That is the rule for `pull_request_target`, not `pull_request` — a
# `pull_request` workflow is resolved from the PR's MERGE ref, which already contains this change.
# It also contradicted docs/testing/frontend-unit-tests.md in the same commit, which documents
# `gh pr create --label frontend-tests` as working at creation time. Treat the trigger as live from
# this PR onward and confirm on the first labelled PR; either way the job-level `if` is what gates
# execution, so a wrong guess here costs a skipped run, never an unwanted one.
#
# skillars-deferred-110 AC7: the suite previously only ever ran under CI's ambient UTC. A
# DST-boundary class of regression can pass silently under UTC-only coverage — skillars-deferred-109's
# own AC7.2 spec is the precedent: it reproducibly failed under TZ=America/New_York at the time (fixed
# in that same story, by deriving the payload from a fixed instant instead of an ambiguous local
# wall-clock string). Re-verified 2026-09-14 (skillars-deferred-110 Dev Agent Record): the full suite
# is green under both TZ=UTC and TZ=America/New_York today — no spec is currently failing — so the `tz`
# matrix below is a regression guard for this class of bug, not a fix for one presently failing. Still
# deliberately opt-in/non-gating — this workflow is not a required check either way (owner decisions
# D2/D6 unchanged) — so the matrix widens coverage without changing what blocks a merge.
name: Frontend Unit Tests

on:
  workflow_dispatch: {}
  pull_request:
    types: [opened, labeled, synchronize, reopened]

permissions:
  contents: read

jobs:
  frontend-unit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'frontend-tests')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # `label` exists only because `tz` (America/New_York) contains a `/`, which is unsafe inside
        # an artifact name below — GitHub Actions expressions have no built-in string-replace to
        # sanitize it inline, so a second, artifact-name-safe field is simpler than working around
        # that.
        include:
          - tz: UTC
            label: UTC
          - tz: America/New_York
            label: America-New_York
    env:
      TZ: ${{ matrix.tz }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Pinned to <node.version> in pom.xml — same value the frontend-quality composite uses.
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Run Vitest unit suite (with coverage)
        working-directory: src/frontend
        run: npm run test:unit:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # skillars-deferred-110 AC7: the matrix leg must be part of the artifact name —
          # actions/upload-artifact@v4+ fails the step (this step is `if: always()`, so it is never
          # skipped) on a duplicate artifact name within one workflow run, and both matrix legs
          # would otherwise collide on the same github.run_id-only name. Uses `matrix.label`, not
          # `matrix.tz` directly — `America/New_York` contains a `/`, unsafe in an artifact name.
          name: frontend-unit-reports-${{ github.run_id }}-${{ matrix.label }}
          path: src/frontend/coverage/
          retention-days: 14
          if-no-files-found: warn
