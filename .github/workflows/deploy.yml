name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'GHCR image tag to deploy (e.g. sha-abc1234)'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Load SSH key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555  # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_DEPLOY_KEY }}

      - name: Add Node to known hosts
        run: echo "${{ secrets.SSH_KNOWN_HOST }}" >> ~/.ssh/known_hosts

      - name: Validate image_tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if ! printf '%s' "$IMAGE_TAG" | grep -qE '^[a-zA-Z0-9][a-zA-Z0-9._-]{0,127}$'; then
            echo "ERROR: image_tag contains illegal characters." >&2
            exit 1
          fi

      - name: Verify image exists in GHCR
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          echo "$GHCR_PAT" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMAGE="ghcr.io/${{ github.repository }}:${IMAGE_TAG}"
          if ! docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "ERROR: $IMAGE does not exist in GHCR." >&2
            exit 1
          fi

      - name: Capture pre-deploy image
        id: pre_deploy
        timeout-minutes: 3
        run: |
          PREV=$(ssh -o ConnectTimeout=10 -o BatchMode=yes "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd /opt/skillars/app && \
             CID=\$(docker compose --env-file /opt/skillars/.env ps -q --status running app 2>/dev/null | head -1) && \
             [ -n \"\$CID\" ] && docker inspect --format='{{.Config.Image}}' \"\$CID\" || echo 'none'")
          PREV="${PREV:-none}"
          echo "image=$PREV" >> $GITHUB_OUTPUT

      - name: Authenticate to GHCR on Node
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        timeout-minutes: 3
        run: |
          printf '%s' "$GHCR_PAT" | ssh -o ConnectTimeout=10 -o BatchMode=yes "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Pre-check image availability locally before pull
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        timeout-minutes: 3
        run: |
          ssh -o ConnectTimeout=10 -o BatchMode=yes "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "docker image inspect 'ghcr.io/${{ github.repository }}:${IMAGE_TAG}' >/dev/null 2>&1 && \
             echo 'Image already cached locally, pull not needed' || \
             echo 'Image not in local cache, will pull during deploy'"

      - name: Deploy
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        timeout-minutes: 10
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:${IMAGE_TAG}"
          ssh -o ConnectTimeout=10 -o BatchMode=yes "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd /opt/skillars/app && \
             sed -i \"s|^APP_IMAGE=.*|APP_IMAGE=${IMAGE}|\" /opt/skillars/.env && \
             docker compose --env-file /opt/skillars/.env pull app && \
             docker compose --env-file /opt/skillars/.env up -d --no-deps app"

      - name: Smoke test
        id: smoke
        timeout-minutes: 15
        run: |
          set +e
          (
            echo "Waiting 60s for JVM startup (matches docker-compose start_period)..."
            sleep 60
            # MAX_ITERS is used twice (loop bound AND the all-transport-failed threshold) — keep it
            # in one place or the 'error' verdict silently becomes unreachable.
            MAX_ITERS=24
            # 60s pre-wait + MAX_ITERS*5s poll = ~180s; app start_period is 60s, cold-start ~120s observed.
            # Three possible per-iteration outcomes:
            # - SSH returns 255 (connect timeout/refused, auth failure, DNS, etc): transport failure
            # - SSH returns 0 with status==1: app is UP
            # - SSH returns 0 with status==0: app not UP yet (real health miss)
            # Verdict: pass → result=pass; ALL MAX_ITERS attempts were SSH 255 → result=error
            # (host unreachable, infrastructure issue, do NOT auto-revert); else → result=fail.
            result="fail"
            transport_fail=0
            last_ssh_err=""
            for i in $(seq 1 "$MAX_ITERS"); do
              SSH_ERRFILE=$(mktemp)
              OUT=$(ssh -o ConnectTimeout=10 -o BatchMode=yes "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "
                CID=\$(cd /opt/skillars/app && docker compose --env-file /opt/skillars/.env ps -q --status running app 2>/dev/null | head -1)
                [ -n \"\$CID\" ] && docker exec \"\$CID\" wget -qO- http://localhost:8367/manage/health/smoke 2>/dev/null \
                  | grep -q '\"status\":\"UP\"' && echo 1 || echo 0
              " 2>"$SSH_ERRFILE")
              SSH_RC=$?
              if [ "$SSH_RC" -eq 255 ]; then
                transport_fail=$((transport_fail + 1))
                last_ssh_err=$(tr -d '\r' < "$SSH_ERRFILE" | tail -1)
                rm -f "$SSH_ERRFILE"
                continue
              fi
              rm -f "$SSH_ERRFILE"
              if [ "$SSH_RC" -eq 0 ] && [ "$OUT" = "1" ]; then
                result="pass"
                break
              fi
              [ "$i" -lt "$MAX_ITERS" ] && sleep 5
            done
            # Apply verdict rule after loop
            if [ "$result" != "pass" ] && [ "$transport_fail" -eq "$MAX_ITERS" ]; then
              result="error"
              echo "SMOKE: every one of $MAX_ITERS SSH attempts failed at the transport layer" \
                   "(exit 255). This is an infrastructure/connectivity problem, not an unhealthy" \
                   "deploy — NOT auto-reverting. Last ssh stderr: ${last_ssh_err:-<none captured>}"
            fi
            echo "result=$result" >> $GITHUB_OUTPUT
            exit $([ "$result" = "pass" ] && echo 0 || echo 1)
          )
          EXIT_CODE=$?
          # Ensure output is written even if step errors or is interrupted
          if ! grep -q "^result=" $GITHUB_OUTPUT 2>/dev/null; then
            echo "result=error" >> $GITHUB_OUTPUT
          fi
          # skillars-deferred-99 AC6: if result still cannot be persisted (unwritable $GITHUB_OUTPUT,
          # disk full), a *passing* smoke (EXIT_CODE=0) would otherwise leave outcome=success with an
          # empty result — no success notification, no failure notification, no fail marker: a silent
          # green deploy. Force a failure so the outcome-guarded revert/notify/marker steps engage.
          if ! grep -q "^result=" $GITHUB_OUTPUT 2>/dev/null; then
            echo "::error::Smoke step could not persist its result to \$GITHUB_OUTPUT — treating as failure" >&2
            exit 1
          fi
          exit $EXIT_CODE

      - name: Auto-Revert on smoke test failure
        id: revert
        # result=='error' means every SSH attempt failed at the transport layer (host unreachable) —
        # that is an infrastructure problem, NOT an unhealthy deploy, so do not revert a build that
        # may well be fine. The 'outcome == failure' clause still covers a smoke step that broke
        # before it could persist a verdict (result then unset, != 'error').
        if: failure() && (steps.smoke.outputs.result == 'fail' || (steps.smoke.outcome == 'failure' && steps.smoke.outputs.result != 'error'))
        timeout-minutes: 10
        run: |
          PREV="${{ steps.pre_deploy.outputs.image }}"
          if [ "$PREV" = "none" ] || [ -z "$PREV" ]; then
            echo "No previous image to revert to — skipping revert."
            echo "outcome=skipped" >> $GITHUB_OUTPUT
          elif ! printf '%s' "$PREV" | grep -qE '^[a-zA-Z0-9][a-zA-Z0-9._/:@-]*$'; then
            echo "ERROR: previous image reference contains unsafe characters; aborting revert." >&2
            echo "outcome=failed" >> $GITHUB_OUTPUT
          elif ssh -o ConnectTimeout=10 -o BatchMode=yes "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
                 "cd /opt/skillars/app && \
                  sed -i \"s|^APP_IMAGE=.*|APP_IMAGE=${PREV}|\" /opt/skillars/.env && \
                  (docker image inspect '${PREV}' >/dev/null 2>&1 || docker compose --env-file /opt/skillars/.env pull app) && \
                  docker compose --env-file /opt/skillars/.env up -d --no-deps app"; then
            echo "outcome=succeeded" >> $GITHUB_OUTPUT
          else
            echo "outcome=failed" >> $GITHUB_OUTPUT
          fi

      - name: Notify Slack — success
        if: success() && steps.smoke.outputs.result == 'pass'
        continue-on-error: true
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d  # v4.0.0
        env:
          SLACK_MESSAGE_TEXT: "✅ *Production deploy succeeded*\nImage: `ghcr.io/${{ github.repository }}:${{ inputs.image_tag }}`\nTriggered by: ${{ github.actor }}"
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {"text": "${{ env.SLACK_MESSAGE_TEXT }}"}

      - name: Notify Slack — failure & revert
        # Owns every mode where the smoke step actually started: explicit fail, `result=error`
        # fallback, step error/timeout (outcome=failure), and job cancellation. `always()` so it
        # still fires when the job is being cancelled; the condition keeps it off the success and
        # pre-smoke paths.
        if: always() && (steps.smoke.outputs.result == 'fail' || steps.smoke.outputs.result == 'error' || steps.smoke.outcome == 'failure' || steps.smoke.outcome == 'cancelled')
        continue-on-error: true
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d  # v4.0.0
        env:
          SLACK_MESSAGE_TEXT: "❌ *Production deploy FAILED*\nFailed image: `ghcr.io/${{ github.repository }}:${{ inputs.image_tag }}`\nAuto-Revert: ${{ steps.revert.outputs.outcome || 'not attempted' }}\nPrevious image: `${{ steps.pre_deploy.outputs.image }}`\nTriggered by: ${{ github.actor }}"
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {"text": "${{ env.SLACK_MESSAGE_TEXT }}"}

      - name: Email — success
        if: success() && steps.smoke.outputs.result == 'pass'
        continue-on-error: true
        uses: dawidd6/action-send-mail@d35571df1982970871070b5e02f01d3b6095cb74  # v19
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: ${{ secrets.SMTP_USERNAME }}
          subject: "✅ Deploy succeeded: ${{ inputs.image_tag }}"
          body: |
            Production deploy of ghcr.io/${{ github.repository }}:${{ inputs.image_tag }} succeeded.
            Triggered by: ${{ github.actor }}
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Email — failure & revert
        if: always() && (steps.smoke.outputs.result == 'fail' || steps.smoke.outputs.result == 'error' || steps.smoke.outcome == 'failure' || steps.smoke.outcome == 'cancelled')
        continue-on-error: true
        uses: dawidd6/action-send-mail@d35571df1982970871070b5e02f01d3b6095cb74  # v19
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: ${{ secrets.SMTP_USERNAME }}
          subject: "❌ Deploy FAILED (revert: ${{ steps.revert.outputs.outcome || 'not attempted' }}): ${{ inputs.image_tag }}"
          body: |
            Production deploy of ghcr.io/${{ github.repository }}:${{ inputs.image_tag }} FAILED.
            Auto-Revert outcome: ${{ steps.revert.outputs.outcome || 'not attempted' }}
            Previous image: ${{ steps.pre_deploy.outputs.image }}
            Triggered by: ${{ github.actor }}
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Fail workflow on smoke test failure
        # skillars-deferred-99 AC6: the last clause catches a smoke step that exited 0 but never
        # produced result=pass (e.g. an unwritable $GITHUB_OUTPUT) — an inconclusive run must not
        # pass as green.
        if: always() && (steps.smoke.outputs.result == 'fail' || steps.smoke.outcome == 'failure' || steps.smoke.outcome == 'cancelled' || (steps.smoke.outcome == 'success' && steps.smoke.outputs.result != 'pass'))
        # The real invariant: no step between `smoke` and this marker may fail the job without `continue-on-error: true`.
        # All four result-notify steps (Notify Slack/Email — success and failure & revert, at
        # .github/workflows/deploy.yml :144/:156/:172/:189) carry it so this marker always runs.
        run: |
          echo "Smoke test failed — deploy reverted. Marking workflow as failed."
          exit 1

      - name: Notify Slack — early failure (pre-smoke)
        # Only when the smoke step never ran (a prior step failed, or the job was cancelled
        # before smoke). A smoke step that ran and failed/errored is owned by the steps above,
        # so `outcome == 'failure'` must NOT be matched here or every failure double-notifies.
        if: (failure() || cancelled()) && steps.smoke.outcome == 'skipped'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d  # v4.0.0
        env:
          SLACK_MESSAGE_TEXT: "❌ *Production deploy FAILED* (failed before smoke test — no auto-revert attempted)\nImage tag: `${{ inputs.image_tag }}`\nTriggered by: ${{ github.actor }}\nSee: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {"text": "${{ env.SLACK_MESSAGE_TEXT }}"}

      - name: Email — early failure (pre-smoke)
        if: (failure() || cancelled()) && steps.smoke.outcome == 'skipped'
        uses: dawidd6/action-send-mail@d35571df1982970871070b5e02f01d3b6095cb74  # v19
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: ${{ secrets.SMTP_USERNAME }}
          subject: "❌ Deploy FAILED: ${{ inputs.image_tag }}"
          body: |
            Production deploy of ghcr.io/${{ github.repository }}:${{ inputs.image_tag }} FAILED
            (failed before the smoke test ever ran — no auto-revert was attempted).
            Triggered by: ${{ github.actor }}
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
