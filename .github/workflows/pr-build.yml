name: PR Build & Test

on:
  pull_request:
    branches: [master]

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # AC10.5. Measured post-refactor duration is 15m19s-15m34s across four consecutive runs
    # (31190871807, 31192540977, 31194113235). 25 leaves ~60% headroom for runner variance
    # and image pulls while still catching a real regression -- the old value of 15 against a
    # ~10-minute run could not have detected a 50% slowdown, which is what AC10.5 objects to.
    # Revisit if the suite's honest duration changes.
    # 2026-09-24 (skillars-deferred-134 PR #228): 4 consecutive runs hit this 25m ceiling
    # (25m18s-25m22s) while a local mvn verify of the identical commit finished in 15:18 --
    # degraded shared-runner throughput, not a suite regression. Bumped to 35 for headroom;
    # revisit downward if runner performance normalizes.
    # 2026-10-07 (skillars-deferred-146 AC2b): DELIBERATELY LEFT AT 35, not retuned, even though
    # this job's measured duration dropped from 18m39s to 11m36s on run 37574001244 once the
    # Docker build moved to its own job and the async-quiesce poll delay was removed. The 2026-09-24
    # note above records a bump made precisely because four consecutive runs hit a 25m ceiling on
    # degraded runners; lowering this on the strength of one fast run would re-create exactly that
    # failure. Revisit only after several post-change runs have established a steady state.
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # AC1: assert at most one postgres, one redis and one storage (SeaweedFS) container is
      # alive at any instant. The containers are JVM-static (SharedContainers), so any breach
      # means something has re-bound their lifetime to the Spring context.
      - name: Start container sampler
        run: .github/scripts/container-sampler.sh start /tmp/container-samples.txt

      # No -q: it suppresses phase markers, the surefire/failsafe summaries and all
      # per-class timings, which are the numbers this project's test-performance work
      # is measured against. Do not add it back.
      # Build, then assert the context count IN THE SAME SHELL that produced the log.
      #
      # Two earlier attempts asserted from a separate step -- first reading a tee'd /tmp/build.log,
      # then a redirected $GITHUB_WORKSPACE/build.log. Both reported "no missCount found" even
      # though the build step's own output contained thousands of the lines, so the gate failed
      # every build for a reason that was never pinned down. Asserting here removes the cross-step
      # file handoff that both failures had in common, which is the only thing they shared.
      #
      # `set +e` around maven so a test failure does not abort the step before the gate runs;
      # the maven status is re-applied at the end so a red suite still fails the build.
      - name: Build and test
        run: |
          set +e
          mvn -B verify 2>&1 | tee build.log
          mvn_status=${PIPESTATUS[0]}

          echo "::group::Spring context count (AC3)"
          # CEILING = 45, deliberate +1 (story skillars-deferred-128, /bmad-code-review response).
          # GdprErasureIT gained a second override, @MockitoSpyBean RefreshTokenRepository (alongside
          # its existing @MockitoBean FileStorageService), replacing a 1ms-budget race in the atomicity
          # test with a spy that throws from markAllUsedByUserId -- the first post-loop step -- so the
          # test can prove AC1's committed-child-survives-a-later-failure tradeoff deterministically.
          # Same one-new-config-forks-one-context shape as VideoDeletionOutboxProcessorIT/
          # AccountDeletionCascadeIT/SmtpTransportBootIT/AdminCoachEnforcementIsolationRuntimeIT before
          # it, not ordering-dependent thrashing. See assert-context-count.sh's own header for the full
          # history.
          .github/scripts/assert-context-count.sh build.log 45
          gate_status=$?
          echo "::endgroup::"
          # NB: stay under `set +e` here -- restoring `set -e` before the gate would abort the
          # step on a gate failure before gate_status could be captured.

          if [ "$mvn_status" -ne 0 ]; then exit "$mvn_status"; fi
          exit "$gate_status"

      - name: Assert container ceiling (AC1)
        if: always()
        run: .github/scripts/container-sampler.sh assert /tmp/container-samples.txt 1

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-reports-pr-${{ github.event.pull_request.number }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 14
          if-no-files-found: warn

  # skillars-deferred-146 AC2/AC2b: split out of `build` into its own job so it starts at the
  # same instant as `build` and `frontend-quality` instead of running serially after `build`'s
  # `mvn -B verify` finishes. No `needs:` deliberately: the Dockerfile's builder stage only
  # consumes pom.xml/src/.git, all of which come straight from actions/checkout, and nothing
  # `mvn verify` produces -- the build job's own 12-minute head start buys this job nothing.
  # ci.yml:88's `build-and-push` is precedent for the JOB SPLIT only, not for running ungated --
  # that job carries `needs: [test, frontend-quality]` on purpose (ci.yml:89-93), because it
  # publishes an image other systems pull. This job's image is built to be scanned and thrown
  # away, never published, so gating it on `build`/`test` buys nothing and would cost ~4 minutes
  # on every green PR; the trade is a few wasted runner-minutes on a red one.
  docker-image:
    runs-on: ubuntu-latest
    # AC2b: step pair measured at 4m03s on run 37530194292 (build 3m28s + scan 0m35s). 20
    # leaves ~5x headroom for the degraded shared-runner throughput `build`'s own
    # timeout-minutes comment above already documents.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build Docker image (no push)
        uses: ./.github/actions/docker-build
        with:
          push: 'false'
          load: 'true'
          tags: skillars-app:pr-${{ github.event.pull_request.number }}
          commit-sha: ${{ github.sha }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: skillars-app:pr-${{ github.event.pull_request.number }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          trivyignores: .trivyignore

  # skillars-deferred-92 AC1. The AC names ci.yml, but ci.yml's own comment records that "the
  # enforcement gates live in pr-build, which is where regressions should be caught" — a gate that
  # only runs on push-to-master reports the drift after it has already landed.
  # Steps live in .github/actions/frontend-quality, shared with ci.yml's copy of this job --
  # skillars-deferred-92 code review, chunk 5 (2026-09-04) found the two hand-duplicated inline
  # copies already drifting from each other despite a comment (previously here) asking humans to
  # keep them in sync manually; the composite action is what actually keeps them in sync now.
  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ./.github/actions/frontend-quality
