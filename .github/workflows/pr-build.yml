name: PR Build & Test

on:
  pull_request:
    branches: [master]

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # AC10.5. Measured post-refactor duration is 15m19s-15m34s across four consecutive runs
    # (31190871807, 31192540977, 31194113235). 25 leaves ~60% headroom for runner variance
    # and image pulls while still catching a real regression -- the old value of 15 against a
    # ~10-minute run could not have detected a 50% slowdown, which is what AC10.5 objects to.
    # Revisit if the suite's honest duration changes.
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4.8.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # AC1: assert at most one postgres, one redis and one minio container is alive at any
      # instant. The containers are JVM-static (SharedContainers), so any breach means
      # something has re-bound their lifetime to the Spring context.
      - name: Start container sampler
        run: .github/scripts/container-sampler.sh start /tmp/container-samples.txt

      # No -q: it suppresses phase markers, the surefire/failsafe summaries and all
      # per-class timings, which are the numbers this project's test-performance work
      # is measured against. Do not add it back.
      # The context-count gate below reads missCount from build.log.
      #
      # `mvn ... 2>&1 | tee build.log` produced a log with NO missCount lines in it, even
      # though the step's own output contained 16725 of them (run 31198763463) -- so the gate
      # could not find its input and failed every build. A plain redirect captures them
      # correctly (verified locally: 18062 occurrences). Rather than keep guessing at why the
      # pipe dropped them, write the file with a redirect and stream it for live output.
      #
      # The check at the end fails the step loudly if the capture is ever empty again, so a
      # broken capture can never look like a passing gate.
      - name: Build and test
        run: |
          set -o pipefail
          mvn -B verify > "$GITHUB_WORKSPACE/build.log" 2>&1 &
          mvn_pid=$!
          tail -f "$GITHUB_WORKSPACE/build.log" --pid=$mvn_pid || true
          wait $mvn_pid
          mvn_status=$?
          if ! grep -q 'missCount = [0-9]' "$GITHUB_WORKSPACE/build.log"; then
            echo "::error::build.log captured no 'missCount' lines -- the context-count gate has no input." >&2
            exit 1
          fi
          exit $mvn_status

      - name: Assert container ceiling (AC1)
        if: always()
        run: .github/scripts/container-sampler.sh assert /tmp/container-samples.txt 1

      - name: Assert Spring context count (AC3)
        if: always()
        run: .github/scripts/assert-context-count.sh "$GITHUB_WORKSPACE/build.log" 42

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: test-reports-pr-${{ github.event.pull_request.number }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 14
          if-no-files-found: warn

      - name: Build Docker image (no push)
        uses: ./.github/actions/docker-build
        with:
          push: 'false'
          load: 'true'
          tags: skillars-app:pr-${{ github.event.pull_request.number }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: skillars-app:pr-${{ github.event.pull_request.number }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
