name: PR Build & Test

on:
  pull_request:
    branches: [master]

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Temporarily raised from 15 while story deferred-19 establishes a baseline: the
    # unrefactored suite builds 37 Spring contexts and the only prior CI datapoint
    # (9m54s) came from a run that failed early and skipped the Docker + Trivy steps.
    # A timeout here yields no test counts at all, which is what we are trying to measure.
    # deferred-19 Task 9b (AC10.5) sets the final value from the measured duration.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4.8.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # No -q: it suppresses phase markers, the surefire/failsafe summaries and all
      # per-class timings, which are the numbers this project's test-performance work
      # is measured against. Do not add it back.
      - name: Build and test
        run: mvn -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: test-reports-pr-${{ github.event.pull_request.number }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 14
          if-no-files-found: warn

      - name: Build Docker image (no push)
        uses: ./.github/actions/docker-build
        with:
          push: 'false'
          load: 'true'
          tags: skillars-app:pr-${{ github.event.pull_request.number }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: skillars-app:pr-${{ github.event.pull_request.number }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
