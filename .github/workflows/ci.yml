name: CI

on:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    # AC10.5 — see pr-build.yml for the derivation. The enforcement gates live in pr-build,
    # which is where regressions should be caught; this job only needs to not hang.
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # No -q — see pr-build.yml for the rationale.
      - name: Build and test
        run: mvn -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-reports-${{ github.sha }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 14
          if-no-files-found: warn

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: build-and-push-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history so the ":latest ordering guard" step can run
          # `git merge-base --is-ancestor` against an arbitrary older published commit.
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short SHA
        id: sha
        run: echo "short=$(echo "$GITHUB_SHA" | head -c 7)" >> "$GITHUB_OUTPUT"

      # ─────────────────────────────────────────────────────────────────────────────
      # :latest ordering guard.
      # `build-and-push` has `needs: test`, so its place in the concurrency queue tracks
      # test-job completion, NOT push order. Two close `master` pushes whose test jobs finish
      # out of order would otherwise let the older one publish `:latest` second and overwrite it
      # with the older image. This step publishes `:latest` only when this commit is a descendant
      # of (or equal to) the commit currently behind `:latest`. It is FAIL-SAFE: any ambiguity —
      # `:latest` unreadable, no revision label, the published commit not in local history
      # (`--is-ancestor` exit 128), a not-ancestor result, or a tool error — falls back to
      # publishing only the `sha-<short>` tag and never aborts the job.
      # NOTE: the `sha-<short>` tag is published by every run that *executes*; a run cancelled
      # while still pending in the concurrency group (possible in a >=3-push burst) publishes
      # nothing. This step does not change that.
      # ─────────────────────────────────────────────────────────────────────────────
      - name: Decide image tags (:latest ordering guard)
        id: tags
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          SHA_SHORT: ${{ steps.sha.outputs.short }}
        run: |
          # GitHub runs `run:` steps with `bash -eo pipefail`; `set +e` here is deliberate — the
          # ancestry check must be able to "fail" (exit 1 / 128 / tool error) without aborting the
          # job. Every fallible call below is still individually guarded so a failure only ever
          # downgrades the tag list to the sha- tag.
          set -uo pipefail
          set +e

          err_file="${RUNNER_TEMP}/imagetools_err.txt"
          sha_tag="${IMAGE}:sha-${SHA_SHORT}"
          latest_tag="${IMAGE}:latest"

          inspect_rc=0
          raw="$(docker buildx imagetools inspect "${latest_tag}" --raw 2>"${err_file}")" || inspect_rc=$?

          publish_latest=0
          published_rev=""
          if [ "${inspect_rc}" -ne 0 ]; then
            if grep -qiE 'not ?found|MANIFEST_UNKNOWN|manifest unknown' "${err_file}"; then
              echo "::notice::${latest_tag} does not exist yet — publishing :latest with no ordering constraint."
              publish_latest=1
            else
              echo "::notice::Could not read ${latest_tag} ($(tr '\n' ' ' < "${err_file}")) — publishing the sha- tag only, leaving :latest untouched."
            fi
          else
            # `:latest` is an OCI image index (docker/build-push-action attaches provenance by
            # default), so walk index -> linux/amd64 manifest -> that manifest's config Labels.
            amd64_digest="$(printf '%s' "${raw}" | jq -r '
              [ .manifests[]?
                | select(.platform.os == "linux" and .platform.architecture == "amd64")
                | select((.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest")
                | .digest ] | first // empty' 2>/dev/null || true)"
            if [ -n "${amd64_digest}" ]; then
              published_rev="$(docker buildx imagetools inspect "${IMAGE}@${amd64_digest}" \
                --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}' 2>/dev/null || true)"
            fi
            # Single-manifest fallback (no provenance / an older publish): read the label directly.
            if [ -z "${published_rev}" ] || [ "${published_rev}" = "<no value>" ]; then
              published_rev="$(docker buildx imagetools inspect "${latest_tag}" \
                --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}' 2>/dev/null || true)"
            fi
            [ "${published_rev}" = "<no value>" ] && published_rev=""

            if [ -z "${published_rev}" ]; then
              echo "::notice::${latest_tag} exists but carries no org.opencontainers.image.revision label — cannot confirm ordering, publishing the sha- tag only."
            else
              merge_base_rc=0
              git merge-base --is-ancestor "${published_rev}" "$GITHUB_SHA" || merge_base_rc=$?
              if [ "${merge_base_rc}" -eq 0 ]; then
                echo "Published :latest is at ${published_rev}, an ancestor of ${GITHUB_SHA} — publishing :latest."
                publish_latest=1
              else
                echo "::notice::Published :latest is at ${published_rev}, NOT an ancestor of ${GITHUB_SHA} (git rc=${merge_base_rc}) — publishing the sha- tag only; :latest already points at a newer or divergent commit."
              fi
            fi
          fi

          if [ "${publish_latest}" -eq 1 ]; then
            tags="${sha_tag}"$'\n'"${latest_tag}"
          else
            tags="${sha_tag}"
          fi
          {
            echo "tags<<__TAGS_EOF__"
            printf '%s\n' "${tags}"
            echo "__TAGS_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: ./.github/actions/docker-build
        with:
          push: 'true'
          # Tag list is computed by the ":latest ordering guard" step above. The sha-<short> tag is
          # always included in the computed list and stays FIRST — docs/deployment/rollback.md pins
          # to it. :latest is appended only when this commit is newer than the one currently behind
          # :latest. (A run cancelled while pending in the concurrency group publishes nothing at
          # all — see the guard-step comment.)
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
