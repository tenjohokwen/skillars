  skillars-deferred-145-review-eligibility-maturity-cooldown-and-dispute-gate-rework: done # PRE-IMPLEMENTATION REVIEW 2026-10-06 (story-review.md, four-layer audit against real HEAD 74d405d2, citation accuracy 27/29, nine first-pass claims killed on adversarial re-check) found 2 Critical + 2 High + 2 Medium + 5 Low findings; both Criticals independently re-verified by direct grep/read before applying (not taken on trust), story rewritten in place, status stays ready-for-dev (not yet implemented). CRITICAL F1: the active-dispute gate as originally drafted checked bookings.status='DISPUTED', a status that is legal in the schema's CHECK constraint but has zero invocation sites in running code (BookingEvent.DISPUTE never fires; DisputeService's three lifecycle methods only ever write Dispute.status, never Booking.status) -- the gate could never fire and its own prescribed test would have certified that non-functioning gate as passing, since it set the fixture's booking status directly via raw SQL (manufacturing a state production never produces). Rewrote AC2.c/Task 3/Task 6 against the real admin.disputes table (new DisputeRepository.existsActiveDisputeByAuthor, cross-joined to Booking by bookingId). CRITICAL F2: AC2.b's parent/self discriminator compared authorId (a User id) to Booking.playerId (a PlayerProfile primary key) -- different ID spaces, never equal by construction -- so eligibleAsSelf was dead code and every self-registered adult player (a real, live flow: chk_pp_owner allows user_id with parent_id null, BookingService.createBookingRequest's else-branch validates it, POST /api/bookings is PreAuthorize(HAS_PARENT_OR_PLAYER_ROLE)) would be permanently locked out with a nonsensical "parent of an 18+ player" 403 on their OWN review. Rewrote the discriminator to resolve each qualifying booking's PlayerProfile and compare authorId against that profile's own userId/parentId fields instead; added new AC6 + a dedicated regression test for the self-registered-adult-player case. HIGH F3: test blast radius was understated by >=5 classes, because every existing reviews fixture uses an ADULT-tier player and a booking 1h-3d old, both of which the new rules reject -- ReviewModerationIT (all 5 tests), ReviewSubmissionServiceConcurrencyIT, ReviewFlagServiceConcurrencyIT, ReviewSubmissionIT.submitReview_validEligibility_... and .updateReview_epochBumpAppliesToFreshLockedState_... were never mentioned in Task 7 at all, and ReviewSubmissionServiceTest.java:74/:67 pins the exact symbols Tasks 2/3 delete -- a hard compile break, not a stale assertion. Also: 3 tests the story called "keep unchanged" (submitReview_ratingOnly_returns201, submitReview_duplicate_returns409, updateReview_afterCooldownWithNewSession_returns204) will actually fail on their unaged fixtures. Task 7 rewritten to name all affected classes explicitly and correct the three wrong "unchanged" claims (4 OTHER "will break" claims from the review's own first pass were independently re-verified as FALSE and killed -- submitReview_bodyTooLong_returns400, submitReview_coachNotFound_returns404, updateReview_blockedStatus_returns403, updateReview_wrongAuthor_returns403 all genuinely pass unchanged, confirmed by tracing the real guard order in ReviewSubmissionService). HIGH F4: Task 4's prescribed frontend grep for the literal "reviews.noRecentSession" finds nothing, because all three locale bundles (en-US/fr-FR/de-DE) store it as a nested key (reviews: { noRecentSession: ... }) -- a dev following the instruction literally would conclude there are no frontend references, leaving 3 dead i18n keys and shipping 2 new error codes (activeDispute, parentalReviewNotApplicable) with no translation entry at all, falling through to raw English per useErrorHandler.js's te(key)/t(key) resolution (direct precedent for treating this as a real regression: skillars-deferred-92 AC14). Task 4 rewritten with the real key-nesting shape and explicit subtasks to add both new entries in all 3 locales plus reword updateTooSoon's stale "once per year" copy. MEDIUM F5: the fail-closed path for an orphaned PlayerProfile row would have reported reviews.parentalReviewNotApplicable ("linked player is 18+") when the real cause is a missing row -- fixed as a side effect of the F2 rewrite (an unresolvable profile now falls through to NO_QUALIFYING_SESSION instead). MEDIUM F6: both new ConfigBounds entries were specified with min=0L, under which a stored 0 is silently IN RANGE and honored as "no floor"/"no cooldown" with zero ConfigStartupAssertion warning (getBoundedInt's 4-arg form does not clamp -- only an out-of-range value falls back to the coded default); changed to min=1L for both, matching every sibling day-window key in the registry, so a stored 0 is correctly flagged and replaced by the safe default instead. 5 Low findings folded in: citation drift (ConfigBounds.java:48-81 -> :82 for the BoundedKey record), Task 5's stale 9.1-era description of ReviewApiAdvice's branches (actually 5 codes in the 409 branch now, plus an explicit COACH_PROFILE_MISSING->500 branch), Task 1 deferring a DELETE-vs-UPDATE decision to a migration precedent that does not exist across all 155 migrations (picked DELETE), an unbounded qualifying-session query (sized honestly as cheap given the config cache + Hibernate identity map, not a blocker), and the original COMPLETED->DISPUTED->COMPLETED maturity-reset Dev Note describing a path no code takes (superseded by the F1 rewrite; replaced with an accurate note about Booking.@PreUpdate stamping updatedAt on ANY row write, which can incidentally extend the new maturity floor -- accepted as a known limitation, no completedAt column exists to fix it with and adding one is out of scope). 2 scope decisions (not defects) left explicitly open for the owner in a new "Not Yet Resolved" section: whether the dispute gate should also retroactively hide an already-approved review (recommended: no, ship as submit/update-only), and whether it should block on A