  # New carved-out initiative from requirements/ses-email-consolidation.md (2026-09-11): consolidate
  # the two independent outbound-email stacks (SMTP notification module + AWS SES module + a
  # DevSesEmailService bridge between them) onto one OutboundEmailSender port, SES as the eventual
  # sole transport. The source doc's own 7 phases map 1:1 to these 7 stories — each phase compiles,
  # passes CI, and is independently mergeable per the doc. Numbering convention confirmed with user:
  # mirrors video-epic-N / deploy-epic-N / skillars-epic-N.
  ses-epic-1: in-progress
  ses-1-1-introduce-outbound-email-port: done # Phase 1 — port + SES adapter rebuild + registration listeners point at the port. SMTP/MailManager/MailService untouched. CODE REVIEW 2026-09-11 (/bmad-code-review, 3 layers): 5 decision-needed (all resolved by owner) + 24 patches — ALL applied; 5 deferred to deferred-work.md; 5 dismissed as false positives with recorded evidence. Reproduced, not just reasoned: (a) RFC 822 group syntax bypassed EmailAddressParser's multi-recipient guard (parse returns length 1, isGroup()=true, so the length check was dead and the class's documented promise false); (b) the two blank/unset outbox tests asserted against a @TempDir the sender never received, staying green under the exact mutation they existed to catch — now RED on it. Also fixed: 429/403 classified permanent (now uses the SDK's isThrottlingException/isClockSkewException), transport=ses booting green with unresolvable credentials, unvalidated app.ses.region, correlationId sent raw into an SES MessageTag, absent-property wiring zero senders, and InvalidPathException escaping the 'never throws' log transport. Owner decisions: keep SDK default retry until Phase 4; fail fast on credentials; carve EmailAddressParser out of §3.4 (Phase 6 must keep jakarta.mail direct); mask recipients at INFO; add APP_SES_FROM_ADDRESS to secrets-reference.md. 136 test executions green. No mvn verify (CI is the gate).
  ses-1-2-smtp-behind-port-and-containment: done # Phase 2 — SMTP moved behind the port (sealed infrastructure/email/smtp package: SmtpEmailSender/SmtpProperties/ProviderConfig/MailSenderProvider/SmtpHealthIndicator/SmtpHealthProperties/SmtpErrorClassifier/SmtpConfig), MailService/MailManager reimplemented on OutboundEmailSender (EmailContentRenderer extracted, characterization-tested), containment tests landed (EmailTransportArchitectureTest, NoStraySmtpConfigTest — hand-rolled source scan, no ArchUnit dep), dev/uat flipped to transport=smtp (fixes D4), dead spring.mail.*/SPRING_MAIL_* removed (D9). Deviation from AC5's literal text: EmailTransportArchitectureTest's AWS-SDK containment rules scoped to software.amazon.awssdk.services.sesv2 specifically, not the full awssdk prefix — a blanket check false-positives on infrastructure.blobstore/platform.filestorage's pre-existing, unrelated S3 SDK usage (reproduced). CODE REVIEW 2026-09-11 (/bmad-code-review, 3 layers): 4 decision-needed (all resolved by owner) + 14 patches — all 18 applied; 5 deferred to deferred-work.md; 6 dismissed as false positives. Notable fixes: mail.debug=true credential leak to stdout removed; JavaMail connect/read/write timeouts added (previously infinite, on a synchronous AFTER_COMMIT listener path); malformed email payload now classifies as permanent (was silently retryable); docker-compose.local.yml no longer requires real SMTP credentials for a bare local run; new SmtpTransportBootIT boots the actual shipped transport=smtp path against a hand-rolled fake SMTP server; EmailRenderingCharacterizationTest rewritten to real captured golden literals (was self-referential); NoStraySmtpConfigTest rewritten to parse YAML structurally; EmailTransportArchitectureTest now catches inline-FQN evasion, not just import lines. All targeted tests green (22+ suites incl. MailManagerIT, EmailRetrySchedulerIT, NotificationEmailOutboxAtomicityIT, BookingReminderEmailWiringIT, VideoModerationAdminAlertEnvelopeIT, ModerationOutboxIT, new SmtpTransportBootIT, new MailServiceTest); no mvn verify (CI is the gate). Story file: ses-1-2-smtp-behind-port-and-containment.md.
  ses-1-3-health-monitoring-rate-limiting: done # Phase 3 — SesHealthIndicator, SesSendRateLimiter (non-blocking), transport-neutral EmailTransportRateLimitedException, retry+circuit-breaker classification, transport-tagged mail.send metric. Implemented per AC1/AC3/AC4/AC5/AC6; AC2's bean-gating mechanism ships as written (AllNestedConditions) after code review reverted an interim in-doHealthCheck workaround — the health group's include is declared per profile instead, which is what makes transport-gated indicator beans compatible with HealthEndpointGroupMembershipValidator. CODE REVIEW 2026-09-12 (/bmad-code-review, 3 layers): 3 decision-needed (all resolved by owner: D1 liveness decoupled to the smoke group + ses:GetAccount IAM documented; D2 revert to bean-gating + per-profile include; D3 rate-limit rejections don't consume scheduler attempts) + 14 patch units — all applied; 4 deferred to deferred-work.md; 4 dismissed as FPs with recorded evidence. Notable: (a) the deviation's premise was false — management.endpoint.health.validate-group-membership does exist; the boot failure was real and is now pinned by a two-directional test rather than prose; (b) SesHealthIndicator threw IllegalArgumentException on a partial GetAccount response (Health.Builder.withDetail asserts non-null), which also permanently defeated its TTL cache so every scrape re-issued a live AWS call; (c) the new indicator joined the DEFAULT health group, coupling prod container liveness and the public /actuator/health route to SES account state; (d) rate-limit rejections tripped the emailService circuit breaker, turning a self-inflicted throttle into an outage for unrelated mail. 109 targeted tests green. Story file: ses-1-3-health-monitoring-rate-limiting.md.
  ses-1-4-registration-email-durability: done # Phase 4 — route registration/OTP mail through NotificationOutboxSupport/MailManager like booking mail (closes D3), OTP delivery-deadline-below-TTL, separate circuit breaker (D-8). Story creation found two things the source doc doesn't mention: (a) the three registration-listener test classes already exist (added by ses-1.1 AC11) and assert the pre-this-story direct-port-call behavior — this story rewrites them, doesn't write from scratch; (b) NotificationOutboxSupport's payload never carries recipient.firstname, and all six registration templates render ${recipient.firstname} — routing them through the outbox as originally scoped would silently blank every greeting, so the story adds a payload field to close it. PRE-DEV REVIEW 2026-09-12 (story-review.md, verified against code, zero false positives): 3 blocking + 5 significant findings, all folded into the ACs before any implementation started — AC3's deadline was never consulted on the actual send path (only on already-FAILED re-drives), AC4's proposed catch around EnvelopeEntity's save() was unreachable (manually-assigned @Id + primitive @Version defeat Spring Data's isNew() check, so save() merges instead of persisting and nothing flushes until commit) and its NON_REPAIRABLE_ERRORS addition was dead code, sendId uniqueness dedupes the bookkeeping row not the actual send, AC6's IT was modeled on the wrong existing test (BookingReminderEmailWiringIT runs under the fake TestMailManager and never produces a FAILED row), two independent retry drivers can race in a naive IT, the OTP-parity test would have pinned a misleading value for the login-2FA SEND_OTP template, and OTP codes/verification tokens newly flow into MailManager's INFO/ERROR logs and an unpurged jsonb column with no AC covering it (now AC7, decision explicitly deferred to dev-story). Story file: ses-1-4-registration-email-durability.md. DEV-STORY 2026-09-12: all 7 ACs implemented. AC1: the three registration listeners rewritten to BEFORE_COMMIT + NotificationOutboxSupport, mirroring BookingEmailListener exactly (blank-address guard, single dependency, catch(Exception)); ApiAdvice's existing Throwable catch-all confirmed to map the new UnexpectedRollbackException failure mode to a sensible 500, no code change needed. AC2: NotificationEmailPayload gained a nullable firstname field, proven end-to-end by a real published-event test asserting the persisted EnvelopeEntity's recipient firstname. AC3: EmailTemplate.deliveryDeadline() (24h default, 5min for the three OTP templates) plus the code-review-mandated first-attempt deadline guard added to NotificationEmailOutboxHandler.handle (an expired payload is released with zero EnvelopeEntity rows ever created — proven, not just asserted on the enum). AC4: MailManager save()->saveAndFlush(), no recovery catch, no NON_REPAIRABLE_ERRORS change; a new two-thread IT races two real transactions against Postgres and reproduces the exact 23505 unique-constraint failure on first run. AC5: EmailTemplate.circuitBreakerName() ("registrationEmailService" for the six registration templates), derived inside MailManager.sendEmailSync's try with a null-guard; confirmed ComponentConfig needs no change. AC6: all three listener tests rewritten; new RegistrationEmailDurabilityIT (enable.test.mail=false context-fork, 6 cases) and OtpDeadlineParityTest (excludes SEND_OTP per S4) added; the unchanged targeted set (MailManagerIT, EmailRetrySchedulerIT/Test, NotificationEmailOutboxAtomicityIT, BookingReminderEmailWiringIT, EmailTransportArchitectureTest, NoStraySmtpConfigTest, VideoModerationEmailListenerTest, VideoModerationAdminAlertEnvelopeIT) all green after two incidental save->saveAndFlush mock-stub fixes. AC7: decided option (a) — OTP codes and verification-URL tokens masked out of both MailManager log statements for the six registration templates only (pre-existing activation/password-reset exposure explicitly left as-is, out of scope). All targeted tests green via scoped failsafe runs; no mvn verify (CI is the gate). CODE REVIEW 2026-09-12 (/bmad-code-review, 3 layers): 5 decision-needed (all resolved) + 10 patch findings — all 15 verified against the code and applied, no false positives; 5 deferred to ledger; 8 dismissed as FPs. Notable: OTP deadline 5min->8min (equaled the outbox sweep interval — a sweep-recovered send could arrive at or after its own deadline and never be attempted); *_EMAIL_VERIFY deadline 24h->12h (equaled the verification token's own TTL); EnvelopeEntity.data now nulled on SENT for sensitive templates (AC7 originally addressed only the log channel, not indefinite at-rest cleartext persistence); SEND_OTP added to the masked set (AC7's "first OTP on this path" premise was wrong — login-2FA already used it); a first-attempt deadline expiry now persists a durable DEADLINE_EXPIRED record instead of log-only, symmetric with EmailRetryScheduler; redaction fixed to preserve key names instead of collapsing them; new MailManagerRedactionTest closes a masking-had-no-test gap; OtpDeadlineParityTest rewritten with an explicit outbox-routed allow-list (its prior "outbox-routed only" claim was false); listener sendId hoisted and logged on enqueue failure; several stale javadoc comments corrected. Full regression re-run, all green. Status set to `done`.
