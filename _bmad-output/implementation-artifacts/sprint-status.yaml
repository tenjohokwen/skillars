  skillars-deferred-15-payment-pending-sweeper-accept-path-integrity: done  # 2026-08-05: all 7 ACs done, full mvn -o verify green (805 unit + 866 IT, 0 failures, 20:39). Both pre-fix behaviours reproduced before any code was written: a booking stranded in PAYMENT_PENDING survives every scheduler AND blocks the coach's slot (booking.slotUnavailable; Postgres' excl_bkg_coach_slot_overlap rejected a second seed independently), and the pack expiry warning is delivered ZERO times, not fourteen — confirming story creation's correction to 7-2 Group 2 D2 by execution. THREE SPEC CORRECTIONS: (1) AC4's locked re-check alone leaves acceptAll returning a silent no-op for a suspended coach, because the per-booking loop swallows the throw — shipped an additional UNLOCKED pre-check in acceptAll, deliberately not a locked one (taking the coach lock there would make every per-booking REQUIRES_NEW transaction block on its own caller's lock until the 5s timeout). (2) AC3's re-check is inert without entityManager.refresh — findByIdForUpdate is JPQL and returns the already-managed stale instance. (3) Task 6's expectation that the AC5 IT would discriminate is WRONG: with the naive formula restored the IT still passes, because the naive value is only wrong precisely when updateBatchStatusFromBooking stops early-returning, so the AFTER_COMMIT listener recomputes after settlement and repairs it before the response is observable; AC5's proof is its unit test instead (expected PARTIALLY_ACCEPTED but was FULLY_ACCEPTED under mutation). Code review 2026-08-05: ZERO AC violations; 6 patches applied, 1 rejected, 4 deferred. Headline review finding — BOTH writer-side locks this story added (AdminCoachEnforcementService.suspendCoach, RescheduleService.declineReschedule) were COMPLETELY UNTESTED: every existing test drove them sequentially and the accept-side race tests staged their contending write with raw SELECT FOR UPDATE SQL, a lock-shaped stand-in that passes against a plain findById. Verifi