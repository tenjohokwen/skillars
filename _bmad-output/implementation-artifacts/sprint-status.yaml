# prior last_updated: 2026-10-04 -- skillars-deferred-142-otp-skp-cookie-gap-video-redirect-and-stale-env-ops-note: PRE-IMPLEMENTATION REVIEW 2026-10-04 (story-review.md against HEAD 9abe7058, four-layer verification + adversarial re-check) found the story not yet actionable and required a substantial rewrite before it stays ready-for-dev. Independently re-verified every finding against HEAD before applying (did not trust the review blindly, per explicit instruction to watch for false positives) -- all of H1/H2/H4/M1/M2/M5/M6/M7 and the L1/L2 citation-drift table confirmed accurate on direct re-read; none were false positives. Key corrections: (1) the method the story called "AuthService.authenticate()" throughout does not exist -- it's AuthService.login() (L1); (2) AC2's "createLoginToken/renewLoginToken's only caller is AuthService" claim was false -- JWTAuthenticationFilter and JWTAuthorizationFilter are real additional callers with no skp set either (H2), rewritten with the true caller inventory; (3) AC2's original design (add a new skillarsRole JWT claim) would have planted a live, system-wide latent bug -- JWTAuthorizationFilter's sliding-window keep-alive (extendTtlOfToken, the dominant path for every authenticated request app-wide) reconstructs its Principal via ClaimsExtractorImpl.extractPrincipal, which never copies a skillarsRole field forward, so the new claim would silently re-stamp to "ADMIN" for every non-admin user starting on their second request of any session (H1) -- redesigned to derive the role locally inside refreshLoginToken from the ALREADY-EXISTING ROLES claim instead (via the existing getAuthoritiesSilently helper), touching zero shared claims-building code; this also sidesteps H3 (no new claim means no "old token missing it" deploy-window case) and resolves M5 (the ROLES claim does carry role-equivalent authority names, confirmed against V139 seed data + registration services -- an earlier premise that it held only fine-grained permissions was wrong). Also found during MY OWN re-verification, beyond what the review itself stated: authApi.login() (the POST /authenticate call that would trigger the whole legacy OTP flow) has ZERO callers anywhere in src/frontend/src -- not just the /otp page being unreached, the backend trigger endpoint itself is equally dead from the live UI, so AC2 is honestly reframed as closing a gap in dormant infrastructure, not fixing a live bug. (4) AC5 (delete a ledger bullet) is DROPPED entirely, not just reworded -- the review found no standalone open-work ledger section exists to delete; the matching text lives inside a historical "## Last audit" narrative block (confirmed via git log -S: the real section was added by 1c40d6bf and removed by 6fdc6b90 three weeks before this story was drafted), and this project's own ledger convention retains audit narrative as permanent history rather than deleting it -- executing the original Task 5 would have destroyed audit history, not cleaned it up. (5) AC1's "nothing on the server reads them" claim was false -- provision.sh:591 does check HETZNER_VOLUME_ID and hard-fails on a bad value; rewritten with the real mechanism (it's a plain exported-env-var check, not a file read, so a stale .env value is invisible to a plain re-run; the only real trigger is an operator manually exporting the stale value first) -- and refined one step further than the review itself: confirmed env-guard.sh's bare (non-set -a) .env sourcing is NOT actually a leak vector into a separately-invoked provision.sh process, narrowing the real trigger precisely rather than leaving it vague. (6) M1: SecurityIT's fixture never sets a role, so its 2FA IT can only prove the cookie's presence/ADMIN-fallback shape, not the real mapping -- IT assertion restated as presence-only, with a new JwtManagerImplTest case (using the existing createPrincipal helper with a real role authority) added to prove the actual mapping cheaply. (7) M6: AC3's original wording was vacuously satisfiable (routeForRole(null) legitimately returns the same '/dashboard' AC3 is trying to stop -- not a bug, since DEFAULT_ROUTE IS /dashboard by design) -- reworded to state that outcome as correct-when-role-truly-unknown, with an explicit new spec case for it rather than leaving it untested. (8) M7: disclosed in the story that AC3 deliberately departs from the sourcing ledger bullet's own stated sequencing ("change the fallback at the same time the OTP flow is wired into navigation") -- wiring the whole legacy flow into live navigation is out-of-theme scope for this bundle. All citation line-number drift in the L2 table fixed throughout (secrets-reference.md end-of-file, createLoginCookies's real end line, successResponse's real range, SecurityIT's real line range, routes.js object boundaries, LoginPage.vue's snippet range, CookieUtil's real param count, B_COOKIE's real constant value). Net effect: AC1 and AC2 substantially rewritten (AC2's fix is now smaller and touches less shared code than the original design), AC3 gained a precision note + test case, AC5 dropped, all citations corrected. Status unchanged at ready-for-dev pending this rewrite being read.
# prior last_updated: 2026-10-03 -- skillars-deferred-141-role-aware-dashboard-navigation-and-login-card-ui-fixes: created via /bmad-create-story 2026-10-03, status -> ready-for-dev. Sourced directly from a user UI report (not deferred-work.md): (1) the generic "Dashboard" link under "Main" in the nav drawer should be admin-only, with each other role getting its own dashboard link instead; (2) the Login card's session-expired banner has no visible gap before the form, and the submit button looks slightly left-misaligned. Research confirmed /coach/command-center and /parent/dashboard already exist and are already each role's post-login landing route (roleRoutes.js ROLE_ROUTES) but have no menu entry today -- story just adds the missing nav links, no new routes/pages needed for those two. /player/home is a one-shot profile-completeness redirect gate, not a dashboard -- no player dashboard existed, so this story adds a new PlayerDashboardPage.vue + /player/dashboard route (mirroring ParentDashboardPlaceholderPage.vue's 3-tile pattern: upcoming sessions, credit wallet, pending approvals) without touching ROLE_ROUTES.PLAYER (would skip the onboarding gate). Resolved one open design question during drafting: "pending approvals" for a self-registered adult player is read as the player's own bookings awaiting coach approval (status PENDING), not videoApi.getMyApprovals() (a parent-consent-over-a-minor concept that doesn't apply to this persona) -- flagged as non-blocking for user confirmation, not left ambiguous for the dev agent. Login fixes: banner spacing recommended via an explicit margin-bottom inside the existing scoped .auth-banner rule (scoped attribute-selector specificity reliably beats the suppressed q-mb-md utility class); button alignment recommended via swapping the form's q-gutter-md for q-gutter-y-md (removes q-gutter's horizontal negative-margin side effect, the leading hypothesis for the few-px misalignment) -- both explicitly require browser visual confirmation before being called done, not just code-reading. No backend/schema changes; frontend-only story. created via /bmad-create-story 2026-10-02, status -> ready-for-dev. Sourced from the explicit top-priority deferred-work.md item (manual testing of coach profile-builder, 2026-10-01) -- ProfilePage.vue is role-agnostic account settings only, exposing none of the coach/player/parent profile-builder fields. Resolved all 4 of the ledger's open follow-ups during drafting: confirmed saveStep1-4 are idempotent-updatable even post-publish (no requireDraftStatus check outside publishProfile), confirmed photo-delete is a genuine backend gap (saveStep5 can only ever set photoUrl, never clear it), decided the UI approach (role-gated sections added to the existing ProfilePage.vue, not a new page/tab), and confirmed neither player-profile endpoint (self or parent-created) has any update counterpart -- both are one-time POST-only creates. Story adds: AC1 new GET self-profile endpoint for edit prefill, AC2 coach identity/specialties/pricing/availability edit dialogs reusing existing step endpoints, AC3 new coach photo-delete endpoint, AC4 new player self-position-update endpoint, AC5 new parent child-position-update endpoint (reusing the existing playerOwnershipGuard), AC6 explicit Admin no-op scope confirmation. IMPLEMENTED 2026-10-02 via /bmad-dev-story, status -> review: all 6 ACs done. AC2's mandatory empirical re-ACTIVE-coach IT surfaced and fixed a genuine pre-existing bug -- Hibernate's default insert-before-delete flush order let saveStep2/saveStep3's deleteByCoachId-then-saveAll resubmission violate uq_coach_age_group/uq_coach_specialty/uq_session_pack whenever a resubmitted value overlapped an existing one; fixed with an explicit entityManager.flush() between the delete and the reinsert in both methods (saveStep4 has no equivalent unique constraint, unaffected). i18n keys added to all three locales (en-US/fr-FR/de-DE), resolving the parity question as full-parity. 72 targeted backend tests + 165 frontend Vitest tests green, eslint clean, no local mvn verify per standing convention. CODE REVIEW COMPLETE 2026-10-02 (/bmad-code-review, three parallel layers -- Blind Hunter, Edge Case Hunter, Acceptance Auditor): 19 patch findings (4 of which began as decisions, resolved live with Mbah: D1 availability-dialog timezone made read-only pending deferred-17 D8, D2 deletePhoto now tolerates missing/foreign-owned storage rows, D3 player-profile-absent renders a create-profile CTA instead of a dead Edit button, D4 SUSPENDED coaches get a read-only profile section) + 3 deferred (deferred-17 D8 adoption, city/timezone cross-validation, missing i18n keys for two pre-existing error codes) + 2 dismissed as verified false positives. All 19 patches applied and independently re-verified. Status -> done.
