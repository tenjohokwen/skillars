d...} }) check only ever ran at initial, usually-unauthenticated mount; replaced with watch(() => authStore.isPlayer, ..., {immediate:true}), red/green-verified with a new regression test that flips role post-mount without remounting. (2) Opening the dashboard page itself 403'd on GET /api/development/players/{id}/timeline despite a real player_profiles row existing -- PlayerOwnershipGuard.check only ever checked parent ownership (existsByIdAndParentId), never self-ownership, so a self-registered adult player (parent_id NULL, chk_pp_owner) was unconditionally denied every resource gated by this guard across 7 resources (timeline, performance reports, radar, neglected skill, skill exposure, subscription, homework) -- fixed by adding PlayerProfileRepository.existsByIdAndUserId and OR-ing it into the guard; new PlayerOwnershipGuardTest (6/6, red confirmed as a compile failure) plus a new PlayerTimelineResourceIT self-registered-player case (11/11 on the full class, real Testcontainers Postgres). (3) Same symptom persisted after (2): PlayerDevelopmentDashboardPage.vue read the :playerId route param via Number(route.params.playerId) -- Tsid ids are 18-19 digits, past Number.MAX_SAFE_INTEGER, and the backend deliberately quotes Long as a JSON string so JS never represents one as a number; converting it back corrupted it (893573203704173564 -> 893573203704173600, reproduced via node -e and matching the user's exact reported URL) so every API call on the page targeted a nonexistent player regardless of the round-2 fix. Fixed by keeping playerId as the raw string throughout (computed + player-switch watcher) and widening SkillsRadarAssessmentPanel.vue's prop type to match its siblings; new PlayerDevelopmentDashboardPageSpec.js (2/2, red confirmed with the actual corrupted id as the received value). Three sibling pages (ParentDevelopmentPortalPage.vue, ParentPlayerPortalPage.vue, PlayerSubscriptionPage.vue) carry the identical pattern, found by grep but not manually reproduced -- flagged to the user and recorded in deferred-work.md rather than silently fixed, since they're outside this story's tested surface. Story file: skillars-deferred-147-player-development-dashboard-nav-link.md.
