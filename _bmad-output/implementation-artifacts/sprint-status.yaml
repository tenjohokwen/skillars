bles as the From address); D-3 add V136's email_template/status CHECK constraints and correct its header's false "Hibernate will keep managing them" claim. Plus 24 patch findings, ALL fixed: MailSendException cause-chain now preserved (real per-recipient failure, not the outer wrapper, becomes the returned exception's cause); new shared ProviderConfigsValidator closes a MailSenderProvider/SmtpPropertiesValidator duplication + adds port-range validation; V136's UNIQUE/FK constraints explicitly named to match Hibernate's own generated names (verified zero duplicates via a real fresh-Testcontainers boot); new permanent EnvelopeEntitySchemaIT restores the ad hoc schema-verification IT; new ComponentConfigDefaultCustomizerTest closes an untested ignoreException predicate; booking.store.js's AC6 guard redesigned around a local flag (fixes a null-vs-seed ambiguity at the root) with the store's public contract reverted to AC6's original spec; NoHardcodedSenderTest rewritten to match line-by-line instead of an unanchored whole-file regex; dev-doc/javadoc/CI-comment accuracy fixes (migration count, hbm2ddl precedence mechanism — independently re-derived via spring-boot-autoconfigure/spring-orm bytecode, not just restated — missing colon, ignoreUnknownFields clarification, DST-claim tense). 3 pre-existing issues deferred to the ledger (unrelated to this story). 3 dismissed as false positives after verification. All 19 backend unit/slice classes + full IT sweep (incl. new EnvelopeEntitySchemaIT) + MigrationConventionLintTest + frontend Vitest (108/108, both TZs) + eslint/prettier/actionlint green. File List recounted: 33 files (25 modified, 8 new), up from the dev pass's 26. Story file: skillars-deferred-110-email-adapter-hardening-outbox-durability-and-doc-accuracy-fixes.md. Branch: story/deferred-110-email-adapter-hardening.
