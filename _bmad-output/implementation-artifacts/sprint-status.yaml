  skillars-deferred-18-availability-slot-timezone-integrity: done  # 2026-08-07: all 5 ACs implemented and confirmed by adversarial code review (3 layers + orchestrator verification); 1 decision resolved, 13 patches applied, 3 deferred (D1-D3), 3 new items from the decision residue (D4-D6), 9 dismissed as false positives. ZERO functional defects in src/main — but the two most load-bearing test claims in the story were FALSE and both were rewritten and mutation-verified. (1) AC2's own reasoning identified a "~26h" zone divergence and then prescribed a 24h pad; region zones alone reach 25h (Pacific/Niue -11 to Pacific/Kiritimati +14) and ZoneId.of accepts fixed offsets to ±18:00 (36h, a case AC4 deliberately keeps valid), so the gap AC2 exists to close stayed open at its widest end and silently reproduced AC1's failure mode. Widened to minusDays(2)/plusDays(9). (2) The Task 3 test designated to guard that pad COULD NOT FAIL — it stubbed the block fetch with any(),any() so the mock returned the block whatever bounds were passed, while its comment claimed the opposite; the only test that failed the dev's mutation check was a separate argument-captor test asserting the formula, not the behaviour. Both rewritten with stubs that apply the real queries' half-open predicates; reverting the pad now fails 3 tests. (3) saveStep4_dayOfWeekOutOfRange asserted status only, but without @Valid the payload reaches V26's CHECK(day_of_week BETWEEN 1 AND 7) and ApiAdvice.integrityViolationHandler returns 400 for that too — so it passed either way; rewritten to assert the field-error entry, and removing the cascade now fails 5 Step-4 tests. (4) Both "resolved message" ITs passed with all four i18n entries deleted (ErrorMsg serializes errorKey and messageSource falls back to the pipe template's English half); strengthened, but the de/fr entries remain unreachable by ANY test because SecurityAdviceFilter:59 stores locale.getDisplayLanguage() ("German") and processFieldErrors:462 feeds it t