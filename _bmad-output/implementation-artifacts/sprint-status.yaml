  skillars-deferred-145-review-eligibility-maturity-cooldown-and-dispute-gate-rework: done # PRE-IMPLEMENTATION REVIEW 2026-10-06 (story-review.md, four-layer audit against real HEAD 74d405d2, citation accuracy 27/29, nine first-pass claims killed on adversarial re-check) found 2 Critical + 2 High + 2 Medium + 5 Low findings; both Criticals independently re-verified by direct grep/read before applying (not taken on trust), story rewritten in place, status stays ready-for-dev (not yet implemented). CRITICAL F1: the active-dispute gate as originally drafted checked bookings.status='DISPUTED', a status that is legal in the schema's CHECK constraint but has zero invocation sites in running code (BookingEvent.DISPUTE never fires; DisputeService's three lifecycle methods only ever write Dispute.status, never Booking.status) -- the gate could never fire and its own prescribed test would have certified that non-functioning gate as passing, since it set the fixture's booking status directly via raw SQL (manufacturing a state production never produces). Rewrote AC2.c/Task 3/Task 6 against the real admin.disputes table (new DisputeRepository.existsActiveDisputeByAuthor, cross-joined to Booking by bookingId). CRITICAL F2: AC2.b's parent/self discriminator compared authorId (a User id) to Booking.playerId (a PlayerProfile primary key) -- different ID spaces, never equal by construction -- so eligibleAsSelf was dead code and every self-registered adult player (a real, live flow: chk_pp_owner allows user_id with parent_id null, BookingService.createBookingRequest's else-branch validates it, POST /api/bookings is PreAuthorize(HAS_PARENT_OR_PLAYER_ROLE)) would be permanently locked out with a nonsensical "parent of an 18+ player" 403 on their OWN review. Rewrote the discriminator to resolve each qualifying booking's PlayerProfile and compare authorId against that profile's own userId/parentId fields instead; added new AC6 + a dedicated regression test for the self-registered-adult-p