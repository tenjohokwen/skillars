eason persisted on admin_alerts and surfaced in the queue summary. Also: surrogate-safe content previews (the codePointCount change doubled max UTF-16 length into a substring that split pairs and would fail the whole queue page in Jackson), id tiebreaker extended to the four ordered message queries the story left behind, sweeper counter moved outside its transaction. TEST-COUNT CORRECTION: the recorded "840 unit + 883 IT" was wrong in exactly the way Task 11 warned about — the report directory was summed, not the classes surefire ran (three stale IT reports in surefire, MessagingIdentityIT double-counted, one failsafe report for a deleted class). True pre-review ≈816+≈881; post-review full verify 824 unit + 889 IT. One failure, PROVEN pre-existing by re-running it in a clean worktree at HEAD: PlaybackServiceIT's p99 perf assertion, which reads latencies[99] — the maximum, not the p99 — of 100 un-warmed calls (deferred D8). DEFERRED (8 items): spec-prescribed IllegalArgumentException yielding 500 not 403, lock-before-authz ordering in softDeleteMessage, list-only orphan filtering, rolling-deploy enum gap, the code-point limit sitting exactly at gemini max-input-chars, the unforced soft-delete race IT, no end-to-end sweep→queue→approve test, and the flaky perf assertion.

