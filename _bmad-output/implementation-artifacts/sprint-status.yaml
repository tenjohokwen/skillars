  skillars-uat-3-payment-capture-integrity-and-backup-retention: done  # 2026-08-11: all 7 ACs implemented, full mvn -o verify BUILD SUCCESS (24:01) — 860 unit + 874 IT, 0F/0E. Contribution derived by diffing @Test counts against HEAD, never by subtracting totals: 762->774 unit (+12), 885->892 IT (+7), each confirmed against this build's per-class reports. DO NOT reconcile 860/874 against uat-2's recorded 823+863 — the two are counted on different bases (774 @Test annotations run as 860 tests; 5 files use @ParameterizedTest); the delta is the measured quantity. No IT class silently stopped running: 139 *IT.java - 4 abstract bases = 135 concrete vs 136 failsafe reports, the extra being the stale ProbeIT report timestamped Aug 10 15:15 (a day before this run's 13:03, no source file); per-class sum 875 = console 874 + that one file. CORRECTION to the story's Dev Notes: it listed FIVE abstract IT bases including AbstractIntegrationTest, but that file ends in Test.java not IT.java and was never in the count — the real figure is four. HEADLINE, and bigger than the AC that found it: AC6 required verifying the Hetzner list/delete endpoints against live API docs, and doing so established that the Hetzner Cloud API HAS NO VOLUME SNAPSHOT AT ALL (verified against four independent sources — the generated Python SDK exposes only attach/detach/resize/change_protection/create/delete/update on VolumesClient; the API changelog never mentions volume snapshots; Pulumi's hcloud.Snapshot requires a ServerId; Hetzner's own guidance says server snapshots exclude attached volumes). volume-snapshot.sh POSTs to /v1/volumes/{id}/actions/create_snapshot, which 404s, so it has failed on every cron run since deploy-3-1 and NO SNAPSHOT HAS EVER EXISTED — meaning the Hetzner Volume at /opt/skillars/data (postgres data, redis AOF, prometheus, loki, grafana, tempo, acme.json) HAS NO BACKUP, and restore-from-snapshot.sh plus Section B of backup-restore.md have nothing to restore from. The Object Storage pg_dump stream is unaffected and is the only working backup, of the database only. Nothing in the repo contradicted this because drill-log.md holds only its placeholder row — no restore drill has ever been run, which is exactly what would have caught it. DELIBERATELY NOT FIXED: choosing the replacement (file-level volume backup to Object Storage, a Storage Box, or an explicit dumps-only decision that deletes Section B) is an operational decision and a deployment story, not a payment one — recorded as uat-3 D1, ranked P1 #9 (above P2 deliberately: a live data-loss exposure, not a deployment inconvenience), warned loudly in volume-snapshot.sh, backup-restore.md and runbook.md. MBAH MUST DECIDE THIS. BOTH mutation checks performed and discriminating: (1) deleting AC2's CAPTURE_PENDING branch fails cancelBookingAsParent_captureInFlight_refuses409AndLeavesBookingPending — but the FIRST version of that test did NOT meet the bar and was rewritten, it initially failed with "expected ResponseStatusException but was ResourceNotFoundException: Coach pricing not found", i.e. only proving "something threw", the exact weakness uat-2 recorded; the downstream path is now stubbed lenient() so the mutation lets the cancel COMPLETE and the failure is "Expecting code to raise a throwable"; (2) restoring the pre-fix !existsById condition at :198-202 fails batchChargeFails_everyReservedBookingIsDeclined with "expected DECLINED but was PAYMENT_PENDING" — the whole batch strands, exactly as the story predicted. A TWELFTH-FILE MISS THE STORY UNDER-PREDICTED: PaymentWebhookIdempotencyIT seeds NO booking.bookings rows at all (it declares @MockitoBean BookingService precisely so transitions never need one), so reserveCapture's locked read found nothing, returned BOOKING_NOT_PENDING and left zero payment rows — the story only asked whether it asserts "exactly N rows". Fixed the fixture, not the check. Generalises as D7: any test driving a settlement path now needs a real booking row, which 