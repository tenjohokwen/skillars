  skillars-deferred-146-ci-build-time-async-quiesce-poll-delay-and-parallel-docker-image-job: done # skillars-deferred-146: CODE REVIEW COMPLETE 2026-10-07 (/bmad-code-review, four layers: Blind Hunter, Edge Case Hunter, Acceptance Auditor, orchestrator re-verification), status review -> done. 2 decision-needed (both resolved by the owner same-day, option (c) each), 9 patches applied, 4 deferred to deferred-work.md, 11 dismissed as false positives. The Acceptance Auditor independently re-fetched every AC3 number from run 37574001244 and reproduced the AC1c red/green locally; missCount stayed at 44 (ceiling 45) and the container gate passed (seaweedfs peak 2 is its DOCUMENTED per-image ceiling for StorageMigrationServiceIT's destinationStorage, not a breach). Decision 1: the idle short-circuit is blind to a task handed directly to a starting worker -- ThreadPoolExecutor.execute() takes addWorker(command, true) when workerCount < corePoolSize (the normal case, core threads are never prestarted), so the task becomes the Worker's firstTask, NEVER enters workQueue, and getActiveCount() does not count it until runWorker takes the AQS lock after Thread.start() returns. This DISPROVED the story's own 'the 25ms delay was never load-bearing' claim and its stated reason ('tasks are enqueued synchronously at submit() time, so already visible'). Owner chose the re-sweep: loop until one full pass finds every pool quiesced, bounded by MAX_QUIESCE_PASSES. Closes the cross-pool ordering gap; the javadoc now says plainly that the thread-start window is NARROWED, NOT CLOSED, rather than arguing it away as the first version did. Decision 2: kept the 15ms idle budget (mutation testing found that reverting only the short-circuit lands at ~48ms because that path pays Awaitility's one-off class-load, so the 50ms both review layers proposed would have stopped catching it) and added the non-timing busy-path test the Edge Case Hunter asked for -- mutation-verified, isQuiesced -> always-true kills it, and it is the first coverage the pollDelay(Duration.ZERO) branch has ever had. Other patches: AC2b's missing 'do not retune build's timeout yet' note; four AC6 doc corrections ('order of magnitude' was really 7.1x, the 'roughly 10x macOS' multiplier had been silently re-anchored to a base 7x smaller, the known 0.07ms current quiesce cost was being deferred to the build log, and a 1199-vs-905 era mismatch); two deployment-baseline docs that still described the PR gate as one serial job (AC5's documentation scope grew from one file to three); the test javadoc's claim that initialize() spawns threads (it does not, prestartAllCoreThreads defaults false); AC3's 230s-predicted vs 157.1s-realised gap reconciled (~131ms/method actual, and since 6 x 25ms = 150ms is the theoretical floor a CI figure BELOW it points at macOS timer oversleep in the original off-CI measurement, not pool count -- recorded as a macOS-biased overestimate); and microsecond resolution on the new counter. POST-PATCH ROUND (owner) FOUND A REAL DEFECT THE PATCHES THEMSELVES INTRODUCED: Decision 1's first cut added `return;` to the ConditionTimeoutException handler to stop a wedged pool spinning across passes, which silently broke AC1's 'the accepted residual is unchanged' -- the pre-story code logged and CONTINUED TO THE NEXT EXECUTOR so all six were always visited, whereas the patch abandoned every pool not yet reached and let the reset open against them unchecked, reopening the deferred-131 window for exactly the unexamined pools. Fixed: the catch logs and continues; a timedOut flag suppresses only the NEXT pass, capping the worst case at one pass (6 x 30s, the ceiling this method always had) instead of letting MAX_QUIESCE_PASSES triple it. The same round also caught citation drift the patches reintroduced (the javadoc expansion moved isQuiesced ~70 lines, so the deferred-work entries' :266/:286 became javadoc prose; re-anchored to :305 and :351-352). OPEN BEFORE MERGE: AC3's measured numbers