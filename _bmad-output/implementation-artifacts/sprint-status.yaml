  skillars-deferred-146-ci-build-time-async-quiesce-poll-delay-and-parallel-docker-image-job: done # skillars-deferred-146: CODE REVIEW COMPLETE 2026-10-07 (/bmad-code-review, four layers: Blind Hunter, Edge Case Hunter, Acceptance Auditor, orchestrator re-verification), status review -> done. 2 decision-needed (both resolved by the owner same-day, option (c) each), 9 patches applied, 4 deferred to deferred-work.md, 11 dismissed as false positives. The Acceptance Auditor independently re-fetched every AC3 number from run 37574001244 and reproduced the AC1c red/green locally; missCount stayed at 44 (ceiling 45) and the container gate passed (seaweedfs peak 2 is its DOCUMENTED per-image ceiling for StorageMigrationServiceIT's destinationStorage, not a breach). Decision 1: the idle short-circuit is blind to a task handed directly to a starting worker -- ThreadPoolExecutor.execute() takes addWorker(command, true) when workerCount < corePoolSize (the normal case, core threads are never prestarted), so the task becomes the Worker's firstTask, NEVER enters workQueue, and getActiveCount() does not count it until runWorker takes the AQS lock after Thread.start() returns. This DISPROVED the story's own 'the 25ms delay was never load-bearing' claim and its stated reason ('tasks are enqueued synchronously at submit() time, so already visible'). Owner chose the re-sweep: loop until one full pass finds every pool quiesced, bounded by MAX_QUIESCE_PASSES. Closes the cross-pool ordering gap; the javadoc now says plainly that the thread-start window is NARROWED, NOT CLOSED, rather than arguing it away as the first version did. Decision 2: kept the 15ms idle budget (mutation testing found that reverting only the short-circuit lands at ~48ms because that path pays Awaitility's one-off class-load, so the 50ms both review layers proposed would have stopped catching it) and added the non-timing busy-path test the Edge Case Hunter asked for -- mutation-verified, isQuiesced -> always-true kills it, and it is the first coverage the pollDelay(Duration.ZERO) branch has ever had. Other patches: AC2b's missing 'do not retune build's timeout yet' note; four AC6 doc corrections ('order of magnitude' was really 7.1x, the 'roughly 10x macOS' multiplier had been silently re-anchored to a base 7x smaller, the known 0.07ms current quiesce cost was being deferred to the build log, and a 1199-vs-905 era mismatch); two deployment-baseline docs that still described the PR gate as one serial job (AC5's documentation scope grew from one file to three); the test javadoc's claim that initialize() spawns threads (it does not, prestartAllCoreThreads defaults false); AC3's 230s-predicted vs 157.1s-realised gap reconciled (~131ms/method actual, and since 6 x 25ms = 150ms is the theoretical floor a CI figure BELOW it points at macOS timer oversleep in the original off-CI measurement, not pool count -- recorded as a macOS-biased overestimate); and microsecond resolution on the new counter. POST-PATCH ROUND (owner) FOUND A REAL DEFECT THE PATCHES THEMSELVES INTRODUCED: Decision 1's first cut added `return;` to the ConditionTimeoutException handler to stop a wedged pool spinning across passes, which silently broke AC1's 'the accepted residual is unchanged' -- the pre-story code logged and CONTINUED TO THE NEXT EXECUTOR so all six were always visited, whereas the patch abandoned every pool not yet reached and let the reset open against them unchecked, reopening the deferred-131 window for exactly the unexamined pools. Fixed: the catch logs and continues; a timedOut flag suppresses only the NEXT pass, capping the worst case at one pass (6 x 30s, the ceiling this method always had) instead of letting MAX_QUIESCE_PASSES triple it. The same round also caught citation drift the patches reintroduced (the javadoc expansion moved isQuiesced ~70 lines, so the deferred-work entries' :266/:286 became javadoc prose; re-anchored to :305 and :351-352). OPEN BEFORE MERGE: AC3's measured numbers predate these patches (taken on 5f75dec8) and the re-sweep plus the ms->us counter switch are unverified on CI -- re-confirm the failsafe figure on the next PR #253 run rather than accepting the prediction that the idle path is unchanged. Verification by execution not inference: DatabaseResetTestExecutionListenerQuiesceTest 2/2 green after every change, and three separate mutations run red (both halves of the fix reverted; the short-circuit alone reverted; isQuiesced forced always-true). Those were single-test-class runs, which this story's Dev Notes explicitly sanction -- the standing no-local-mvn-verify convention bars the full suite, not an isolated unit test. Prior note: DEV-STORY COMPLETE 2026-10-07 (/bmad-dev-story): all 6 tasks done, PR #253 open against master. Measured on the PR's own CI run (37574001244): failsafe phase 11m38s -> 9m01s (-2m37s, clears AC3's 2m30s floor), build job 18m39s -> 11m36s, new docker-image job 3m17s running genuinely in parallel (all three jobs started at the same second). [deferred-146] async quiesce counter: 1199 invocations, 84ms total, 0.1ms mean (down from the ~190ms/method pre-change). Context-count (missCount=44/45) and container-ceiling gates both unaffected, as AC4 required. Prior note: # skillars-deferred-146: PRE-IMPLEMENTATION REVIEW 2026-10-07 (story-review.md, four-layer audit against real HEAD 70f41a1e). Status stays ready-for-dev -- five findings accepted, ALL text corrections, no AC changed what gets built, and the two load-bearing technical claims both survived: Awaitility resolving an unset pollDelay to the fixed pollInterval (the review re-confirmed this from decompiled awaitility-4.3.0 bytecode -- Awaitility.DEFAULT_POLL_DELAY is null, ConditionFactory.definePollDelay(null, FixedPollInterval(25ms)) returns the fixed duration) and the Docker build depending on nothing mvn verify produces (full Dockerfile re-read: builder stage copies only pom.xml/src/.git, never target/). Every finding was independently re-verified against real source before being applied, not taken on the review's say-so -- and one half of one finding did NOT survive that re-check. Accepted: (D) AC5 cited a nonexistent 'AC1.6' and claimed 'two documentation files' when only docs/testing/readme.md is ever named -- a real defect, both references corrected to AC6; (C) AC1d's reason for leaving ConcurrencyLockWaitSupport.java:95 untouched was BACKWARDS -- it said the condition is 'expected to be false at first call', but the class's own javadoc (:22-28) records that PessimisticLockRetryer.recordRetries only fires once the whole retry loop CONCLUDES and :92 says to call the assertion after both threads are joined, so the condition starts out TRUE exactly like AC1's; decision unchanged but rationale rewritten to volume (6 call sites ~150ms vs the ~230s this story chases) with the wrong reason recorded as wrong so it cannot be re-derived; (A) the sixth pool's bean name was wrong -- @Bean(name = "sendMailPool") at notification/config/AsyncConfig.java:54 overrides the threadPoolTaskExecutor() method name -- fixed, plus the budget table's seventh entry storageUploadExecutor called out as a raw ThreadPoolExecutor that getBeansOfType deliberately does not return; (B) 'ci.yml already models this correctly' over-claimed, since ci.yml:88's job carries needs: [test, frontend-quality] and is precedent for the job SPLIT only, not for running ungated -- corrected in both the narrative and Task 4's comment instruction; (E) Task 1 extracted isQuiesced(...) 'so the two cannot drift apart' but never told the dev to point .until(...) at it. FALSE POSITIVE rejected: the review graded the ExecutorShutdown.java:261 citation 'DRIFTED' on the grounds that :261 is not a name enumeration -- but :261 does literally read 'the six ThreadPoolTaskExecutor pools', which is the count the story cited it for; only the name list needed a second citation (:77-83), which was added rather than the original citation being treated as wrong. Two genuine citation drifts fixed (the 'no -q' comment is pr-build.yml:49-51 not :58-60; SharedContainers.Postgres is :108-129 with the image at :60, not :31-40) -- both substantive claims were already true, only the ranges were wrong. Found by this pass and NOT by the review: AC1c's '< 15ms' budget had no stated measurement boundary, and ThreadPoolTaskExecutor.initialize() spawns threads (easily tens of ms on a loaded runner), so a dev timing it would get a flake unrelated to the assertion -- AC1c now pins the timed region to the quiesceAsyncExecutors call alone and records why 15ms is safe (the idle short-circuit never reaches Awaitility, so the one-off ~45ms Awaitility class-load observed during the original measurement is out of scope). The review's one self-declared gap is also closed: it could not re-pull run 37530194292 and took every timing on trust; re-fetched from the jobs API -- job 1119s (18m39s), 'Build and test' 827s (13m47s), Docker build 208s (3m28s), Trivy 35s, so build+scan = 243s = 4m03s. All baselines confirmed. Prior note: skillars-deferred-146: created 2026-10-07, status -> ready-for-dev. Sourced from a build-time investigation at the user's request -- NOT deferred-work.md, not a code-review deferral. Profiled the last green PR build (run 37530194292, PR #252, 18m39s wall clock) against HEAD f789ce5b and reconciled the whole budget: failsafe 11m38s (62%), docker image build 3m28s (19%), surefire 1m00s, trivy 0m35s, compile+testCompile 0m33s, frontend 0m34s, setup/upload/post 0m51s. Inside failsafe: Awaitility poll delay ~230s (33%), Spring context loads 188s (27%), real test work ~197s (28%), JVM/container/shutdown ~60s (9%) -- the four sum to the measured phase. This story implements the two largest findings only. (1) DatabaseResetTestExecutionListener.quiesceAsyncExecutors (:249-264) calls Awaitility.await().pollInterval(25ms) once per ThreadPoolTaskExecutor bean in beforeTestMethod, and Awaitility resolves an UNSET pollDelay to the fixed pollInterval -- so it sleeps 25ms before evaluating a condition that is already true, six times (ExecutorShutdown:261 documents six pools), on every one of the 1213 IT methods that run in a full-Boot context (the 121 @WebMvcTest slice methods have no such beans and cost 11s total, which corroborates it). Measured directly against the project's own awaitility-4.3.0 jar: six already-true awaits = 191-200ms as written, ~3ms with .pollDelay(Duration.ZERO). 1213 x 190ms = ~230s. The 25ms was never load-bearing -- the quiesce drains @Async tasks enqueued synchronously by a PRECEDING test method, so they are already visible at first check, and a fixed head start guards nothing against a task dispatched at t=26ms either. Fix is an idle short-circuit plus pollDelay(ZERO); atMost(30s), pollInterval(25ms) and the accepted ConditionTimeoutException residual all unchanged. (2) pr-build.yml runs 'Build Docker image (no push)' (:102) and 'Scan image for vulnerabilities' (:109) as the next SERIAL steps of the build job, and the Dockerfile's builder stage re-runs the whole Maven build from scratch (a second quasar build and repackage are visible at 21:10:51 in the run log). It depends on nothing mvn verify produces -- only pom.xml/src/.git, all from checkout -- and ci.yml:88 already models it correctly as a standalone job. Moving both steps to a needs-less parallel job takes 4m03s off the critical path. Deliberately NOT bundled, each recorded in the story's own 'Deferred From This Investigation' section with its measured size and its blocker: spring.test.context.cache.maxSize 32->48 (~35s, 40 distinct signatures against a 32-slot cache, missCount 44 = ~8 evict-and-rebuild; blocked on uploading target/failsafe-gc.log, which the build writes but never uploads, to judge the memory trade against -Xmx4g); six prolonged-contention tests that wait out a Thread.sleep(8000) after their <4500ms assertion already passed (~22s, 6 tuned concurrency tests deserve their own review); ~6 property-only single-class context forks (~30s, but docs/testing/readme.md's 'why not <= 10' section stays binding -- hoisting QuotaService/VideoLifecycleService mocks would gut five tests' subjects); Postgres fsync/synchronous_commit tuning (unquantified); and IT-suite sharding (the structural lever, held in reserve -- the container gate survives per-shard but the missCount gate does not and would need replacing with a static signature count). Also corrected on the way through: docs/testing/readme.md's '99.7 ms mean over 814 invocations (~81s total)' per-test reset figure is stale by an order of magnitude -- the same counter in the same run reports 14.0ms mean over 1199 invocations, 16.8s total (AC6). No production code changes. Projected: 18m39s -> ~10m20s workflow wall clock; AC3 requires the dev to replace that projection with measured numbers from this story's own CI run and to investigate rather than accept a failsafe drop smaller than 2m30s. Story file: skillars-deferred-146-ci-build-time-async-quiesce-poll-delay-and-parallel-docker-image-job.md.
