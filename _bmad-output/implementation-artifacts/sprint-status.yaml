  skillars-uat-2-session-duration-and-booking-slot-integrity: done  # 2026-08-10: all 7 ACs implemented, full mvn -o verify BUILD SUCCESS (08:57) — 846 unit + 866 IT, 0F/0E; ESLint clean, quasar build green. Session length is now a real concept: nullable marketplace.coach_pricing.session_duration_minutes over booking.session.defaultDurationMinutes (V93, platform_config id 603 as required — max was confirmed 602), resolved by SessionDurationResolver in platform.booking.service. AvailabilityService slices free segments into fixed-length slots (grid anchored PER SEGMENT, deliberately, and pinned by a test so nobody "tidies" it into a window-anchored grid). Enforcement on all three write paths; the reschedule rule is same-as-ORIGINAL duration, not same-as-coach's-current-length, so a legacy booking can still be moved at its own length. MUTATION CHECK performed as Task 3 required: disabling the createBookingRequest check fails 3 NAMED tests, all asserting hasMessageContaining("session length") so they discriminate against the different exception the unfixed code throws later on the same request, not merely against "something threw". BASELINE CONFIRMED, not assumed: contribution derived by diffing @Test counts against HEAD (+23 unit across 4 files plus the new SessionDurationResolverTest, +3 IT in CoachProfileBuilderIT), which reconciles exactly with the story's 823+863 figure at 8a76652. No class silently stopped running — 134 concrete *IT sources vs 135 failsafe reports, the extra being a stale ProbeIT report timestamped before this session with no source file; its 1 test is excluded. THREE THINGS THE SPEC DID NOT ANTICIPATE: (1) docker-compose.local.yml never overrode redis's volume, so AC6b's bind mount to the absolute production path /opt/skillars/data/redis would have created that directory on every developer's laptop — added a skillars-local-redis override matching the five that already exist, recorded as deferred D7; (2) RescheduleServiceTest built two fixtures' start and end from TWO separate Instant.now() calls, making the booking 1 hour plus a few microseconds, so AC3's exact rule rejected every 1h proposal — fixed the fixture rather than loosening the check, which is exactly the trap the Dev Notes warn about; (3) a TWELFTH regression file the story's list of eleven missed, payment/ExpiredPackBookingValidationTest, which hand-constructs BookingService. AC6's doc list was also incomplete — backup-restore.md turned out NOT to name the acme.json path (no change), while first-time-setup.md did; runbook.md and local-deployment.md needed changes for the REDIS path (AC6b), not for acme.json, which neither file mentions at all (corrected 2026-08-11 during the review audit — the earlier wording lumped all three under acme.json); runbook.md's docker-volume-prune safeguard was actively misleading afterwards since the production stack now declares no named volumes at all. One deliberate addition beyond spec: computeAvailableSlots throws on a non-positive slotLength, because the failure mode without it is an INFINITE LOOP in the availability endpoint, not an error — it immediately caught 4 tests with an unstubbed resolver mock that would otherwise have hung the suite. DEFERRED (7 items): RescheduleService still has no availability-window check (deliberate — changing reschedule semantics needs its own regression pass, same question governs BookingDuplicationService); booking error codes resolve in no bundle so every rejection is one generic toast (interacts with deferred-18 D6 — the backend bundles are the ones ApiAdvice cannot select, so the backend half would be inert); per-segment grid anchoring shifts slot times when a coach edits a block; no create-time cross-booking overlap check on the batch path (deliberate, V87 excludes REQUESTED); ConfigService's 5-min TTL makes a platform-default change look like a no-op; no frontend tests; the local-compose hazard. STILL OPEN: no live app run — every .vue change (Step 3 duration select, the