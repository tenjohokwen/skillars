  skillars-uat-1-admin-bootstrap-and-onboarding-unblock: review  # 2026-08-10: all 9 ACs implemented, full mvn -o verify BUILD SUCCESS (09:05) — 818 unit + 863 IT, 0F/0E, 1+4 skipped. BASELINE CORRECTION: the story quoted 828 unit + 905 IT from CI run 31266833983 at bf513a1, which is TWO COMMITS BEHIND this tree — a170e69 (tenant module removal) deleted 12 test files in between and its own commit message records the IT suite dropping to 852. My contribution verified by diffing test-method counts against HEAD rather than subtracting totals: +7 unit (AdminBootstrapRunnerTest 6, AvailabilityServiceTest 13->14) and +7 IT (AdminAuthoritySeedIT 2, AdminBootstrapIT 2, CoachProfileBuilderIT 24->26, MessagingAccessControlIT 4->5). No class silently stopped running: 138 *IT.java sources minus 4 abstract bases = 134 concrete = 134 failsafe reports. THREE DEFECTS THE SPEC DID NOT ANTICIPATE, all found by tests and all fixed: (1) the AC2 runner needed a transaction — User.authorities is @ManyToMany(cascade=PERSIST) so the Authority was detached by save time and Hibernate threw "detached entity passed to persist"; CoachRegistrationService, the shape the AC said to copy, escapes this only because it is class-level @Transactional. Fixed with a TransactionTemplate positioned so the DataIntegrityViolationException catch sits OUTSIDE the transaction, avoiding the UnexpectedRollbackException trap deferred-12/-14 both had to fix. (2) AC6 assumed all four default arms were reachable; only two are — resolveLastReadAt and updateLastRead sit behind a verifyIsParty that throws first — so the test asserts the two real ones (MessagingService + MessagingReportService copies) rather than faking reachability. That investigation surfaced a NEW finding, deferred D1: getConversations uses an if/else chain not a switch, so an unknown role still silently falls into the PLAYER path and returns an empty list — the same silent-fallback class deferred-16 meant to remove, in a shape its default-arm sweep could not see. (3) V92 broke 8 IT classes on the first full run: authorityData.sql inserts ROLE_ADMIN with NO conflict clause. The story warned about this class of breakage but pointed at AdminQueueIT, which was already safe. Adding ON CONFLICT alone traded a duplicate-key error for an FK error, because the fixtures wire user_authority by LITERAL authority id and the migration row wins the conflict; fixed durably by resolving every authority FK by name across authorityData.sql, initTestData.sql, userData.sql, ConfigResourceIT and StorageResourceIT — those fixtures are now immune to any future seeding migration. AC8 implemented as re-scoped (local-deployment.md already documented the workaround; only the build: key was missing). AC9 recount CONTRADICTED uat-readiness-priorities.md: all four i18n bundles now carry an identical 160-leaf-key booking block, so the fr-FR translation gap is closed, not merely narrower — D2 re-scoped to purely structural residue (de not selectable, de not renamed de-DE, en redundant). 5 new deferred items recorded. STILL OPEN: no frontend test suite exists, so every .vue change (AC4 picker/banner/Step1->Step4 default, AC5 timezone label) is verified by code reading and a successful production build ONLY — four named behaviours need a human or browser-tooled spot-check. Prettier fails on the pre-existing frontend files this story touched (verified failing at bf9c828 before any edit) and was deliberately not run, to avoid burying the diff; only the new TimezoneSelect.vue is Prettier-clean. Recorded as deferred D5 — project-context.md calls Prettier mandatory, so the repo violates its own rule and wants a dedicated sweep.
