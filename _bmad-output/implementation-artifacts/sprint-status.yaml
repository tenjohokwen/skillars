  skillars-deferred-153-wrapup-abandonment-roster-fanout-relationship-consistency-and-recency-policy-fixes: done  # DEV-STORY COMPLETE 2026-10-17 (/bmad-dev-story). Status in-progress -> review. All 14 tasks / 11 ACs implemented: wrap-up abandonment sweeper + admin force-complete (AC1), GDPR session_completion_data recap anonymization (AC2), roster candidate-set cap (AC3), timeline offset pagination backend+frontend (AC4), status-width widening + 5-copy predicate consolidation (AC5/AC6), report-generation recency bound (AC7), attention-score recency decoupling (AC8), upload-failure console logging (AC9), contribution empty-state selection-rule dedup (AC10). Full targeted backend regression (2951 tests across platform.development.**/platform.booking.**/platform.admin.**/platform.config.service.**, including every new/modified IT under Testcontainers) and full frontend Vitest suite (50 files/371 tests) both green, zero regressions. Eleven resolved deferred-work.md bullets deleted in the same change. See the story's own Dev Agent Record/Change Log for full detail. CREATED 2026-10-17 (/bmad-create-story), mined from deferred-work.md. Bundles the four user-prioritized highest-priority open items plus two supplementary items from the same recent code-review sections (skillars-12-1, skillars-12-2, skillars-12-4, skillars-deferred-152): (1) wrap-up abandonment remediation -- a booking stuck permanently in COMPLETED_PENDING_CONFIRMATION when a coach abandons the wrap-up wizard before its mandatory step 5, fixed via BOTH a widened sweeper (auto-confirms with a blank recap after timeout, no existing completion-data row required) AND a new admin force-complete endpoint, with a new ActorRole.ADMIN and an admin_action_log CHECK-constraint-widening migration to support it; (2) roster per-player fan-out bounded by capping the candidate set (by recency, via a new config-bound development.roster.maxPlayers key) before fan-out begins, not just paginating the response, which would not have reduced the actual DB load; (3) real offset page/size pagination added to the player-timeline endpoint, with a minimal frontend "load more" affordance so the new ceiling isn't a silent truncation; (4) the roster-membership-vs-authorization status-width mismatch closed by adding a new, wider READ_RELATIONSHIP_STATUSES constant for read/detail-view authorization specifically (not widening the narrower write-path ACTIVE_RELATIONSHIP_STATUSES in place, which would have silently widened who can submit assessments/generate reports/set targets too); (5) five duplicate copies of an incomplete coach-self-ownership predicate (missing PlayerOwnershipGuard's self-owner arm) consolidated onto CoachPlayerAuthorizationService, fixing the gap as defense-in-depth while touching all five; (6) report generation now shares TimelineQueryService's own coachAccessExpiryDays recency bound instead of accepting an arbitrarily stale signal the timeline would already refuse; (7) the roster's attention-score recency normalizer decoupled from the operator-configurable dormantAfterDays threshold via a fixed 90-day horizon, so retuning dormancy no longer silently reshapes the whole ranking; (8) GDPR erasure extended to anonymize session_completion_data's three coach-authored free-text columns (the pre-existing voice_note_text gap plus the newer what_we_did/whats_next columns); (9) a failed coach-logo-upload PUT's discarded status code now logged; (10) the coach-contribution empty-state selection rule (not just its threshold, already deduped by skillars-deferred-152) deduped across its two page consumers. All six headline items required an explicit product/architecture decision from the project owner -- all six resolved before drafting (see the story's own Dev Notes "Owner decisions" for each). As part of drafting, a same-session ledger-hygiene pass independently pruned 13 unrelated stale, already-closed bullets from deferred-work.md (not part of this story's scope) -- every citation in this story was re-verified against the ledger's post-prune line numbers. CORRECTED 2026-10-17 after an independent /mto-story-review-style audit (story-review.md): the GDPR item (8 above) had been dropped as a numbered AC in the first draft despite having a Source-table row and a Task -- restored as AC2; item 4's status-width fix was scoped too narrowly (three coach-facing read endpoints -- RadarAssessmentService.getMyEntries, SluTargetService.getTargets, DevelopmentCorrelationService.getInsights -- would have stayed 403'd) -- now explicitly in scope; both new config keys were specified against the wrong ConfigBounds precedent (would have failed ConfigBoundsEnumCoverageTest) -- fixed; AC1 now discloses that both new completion paths release the coach's payout via the existing CoachPayoutEnqueueListener, requiring a Javadoc update in the same commit; AC4's Pageable/return-type spec and frontend append instruction were unimplementable as written -- fixed (Slice<>, restructured store). See the story file's own Dev Notes "Corrections applied after story-review.md" for the full list. See the story file's own Source/Dev Notes for full item-by-item detail and citations.
