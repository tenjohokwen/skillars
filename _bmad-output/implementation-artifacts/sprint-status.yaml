efore merge. Prior note: /bmad-dev-story started 2026-10-03. Created via /bmad-create-story 2026-10-03, sourced directly from a user UI report (not deferred-work.md). AC1-3: gate the generic Main "Dashboard" link to admin-only, add missing nav links for Parent (-> existing /parent/dashboard, already each role's post-login landing route) and Coach (-> existing /coach/command-center, same). AC4: new Player dashboard (new PlayerDashboardPage.vue + /player/dashboard route + nav link, mirroring ParentDashboardPlaceholderPage.vue's 3-tile pattern) since no player dashboard existed and /player/home is a one-shot onboarding-redirect gate, not a dashboard; ROLE_ROUTES.PLAYER deliberately left unchanged. "Pending approvals" tile resolved to the player's own REQUESTED bookings (not videoApi.getMyApprovals(), a parent-consent concept inapplicable to a self-registered adult player) -- confirmed with Mbah 2026-10-03 (the parent-dashboard tile was carried over into the request without a specific player-side intent behind it). AC5-6: Login card session-expired-banner spacing (recommended fix: explicit margin-bottom inside the scoped .auth-banner rule) and submit-button alignment (recommended fix: q-gutter-md -> q-gutter-y-md on the form) -- both require browser visual confirmation before being called done. PRE-IMPLEMENTATION REVIEW 2026-10-03 (mto-story-review against HEAD cb768413, see story-review.md): 2 real findings applied -- (1) AC4's booking-status filter was wrongly written as 'PENDING'; corrected to 'REQUESTED' per skillars-3-3 AC1/AC7 and the chk_bkg_status CHECK constraint (no PENDING value exists for an individual booking). (2) the credit-wallet tile's reuse of fetchCreditBalance() was flagged only as "verify empirically" but is actually a confirmed, always-firing 403 -- CreditWalletResource.getBalance() is @PreAuthorize(HAS_PARENT_ROLE) only; new AC4.1a widens it to the already-existing HAS_PARENT_OR_PLAYER_ROLE constant (same one BookingResource already uses), confirm