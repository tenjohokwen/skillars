he real ErrorDto response never populates, so it showed the generic fallback for every error in every locale) and apply the te()/t() pattern. Found and fixed during implementation: a SQL-ambiguous-column bug in two new ITs (coach_profiles and coach_availability_windows both have canonical_timezone); PessimisticLockRetryerCallSiteAuditTest's hardcoded call-site count bumped 42->43 for the new saveStep1 lock site; two AvailabilityServiceTest cases that tested the exact per-window-zone-divergence behavior AC1.3 deliberately removes were replaced with one proving the new stale-column-is-ignored invariant. 1954+ backend unit tests green (full mvn test), CoachProfileBuilderIT 43/43 (+8 new) + AvailabilityResourceIT 13/13 + CoachProfileSelfEditIT 14/14 green via failsafe, 187/187 frontend Vitest tests green (+11 new, up from 165), eslint/prettier clean. No local mvn verify per standing convention. Manual walkthrough (AC4.3) NOT performed in this session (no browser available) -- flagged for human reviewer before merge. Prior note: /bmad-dev-story started 2026-10-02. Created via /bmad-create-story 2026-10-02, sourced from deferred-139 code-review findings (2026-10-02) + manual testing of coach profile-builder (2026-10-01). Story closes three open items from deferred-work.md: (1) AC1 -- Adopt "coach timezone is authoritative" (reverses prior per-window timezone divergence design, owner decision Mbah 2026-10-02), stamp zone to all windows in saveStep4, propagate zone changes to existing windows in saveStep1, simplify per-window slot materialization; (2) AC2 -- Add city/timezone validation (prevent silent contradictions, recommended Option 2: validate plausibility); (3) AC3 -- Fix missing error-key translations (marketplace.stepOutOfOrder, marketplace.profileNotFound missing from all three frontend i18n bundles + broader MarketplaceError namespace audit). AC4 Testing & Verification (unit, IT, manual), AC5 Definition of Done. Bundled work: 3 ACs touching availability/profile se