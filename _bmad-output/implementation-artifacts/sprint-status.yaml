  skillars-deferred-154-report-access-scoping-coach-erasure-recap-cleanup-roster-review-query-fix-and-nav-fallback: done  # CODE REVIEW COMPLETE 2026-10-18 (/bmad-code-review). Status review -> done. Three parallel layers; 25 findings raised, 12 survived independent re-verification against real HEAD and 13 were dismissed as false positives (including four the Blind Hunter rated HIGH -- the numeric-coincidence test was wrongly called non-discriminating, the four MainLayoutSpec assertions DO pin /dashboard absence at :371/:383/:393, dropping b.parentId does NOT re-base eligibility given chk_pp_owner, and the 'two SecurityUtil mocking strategies' concern was a plain misread of a pre-existing Mockito.mock call). 1 decision resolved with the owner (coach-side erasure tombstone: ledger as a known residual, consistent with AC2's own three already-deferred same-root-cause siblings). 9 patches applied, 3 deferred. Two blocking defects, each found by a layer with real source access and corroborated by a second: (1) listReports resolved the principal BEFORE the role check that gates it, and SecurityUtil.getCurrentCoachUserId THROWS rather than returning null -- this broke ReportGenerationServiceIT:93, which calls listReports with no SecurityContext and was NOT in the story's claimed test run; mutation-verified (pre-fix ordering recompiled => IllegalStateException: User not found!). (2) The coach-branch lock_timeout used set_config(..., is_local=true), which is TRANSACTION-scoped despite the AC and the added comment both calling it 'per-statement', leaking a 5s bound onto ~15 later statements in eraseTransactional including the commit-time flush; fixed by confining it to a requiresNewTemplate boundary as the player path already does. Also: anonymizeByCoachId had no catch, so a lock-timeout trip rolled back the ENTIRE erasure into an unalerted FAILED (now the player path's classified skip-and-alert, two new reason codes); BookingRepositoryIT's four negative fixtures had silently