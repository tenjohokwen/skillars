ilabilityService's addWindow/updateWindow/deleteWindow have none -- so saveStep1 does not diverge from the established shape). Dev Agent Record claims re-verified independently: lock-before-mutation TRUE, all-9-i18n-keys TRUE, concurrency-IT-non-vacuous TRUE; but 'no-op for pre-existing bookings' FALSE, 'audited every window-zone reader' FALSE (file-scoped), and 'zero-offset set confirmed against getAvailableZoneIds()' FALSE. Verification: 1962 backend unit tests green (up from 1954), MigrationConventionLintTest 30/30 green on V155, CoachProfileBuilderIT 45/45 (+2 net) and 102 ITs green across every path D1 touched (AvailabilityResource, BookingRequestResource, BookingBatchResource, RescheduleResource, PlayerBookingRequest, 3 booking concurrency ITs, CoachProfileServiceConcurrency, CoachProfileSelfEdit) -- V155 confirmed applying cleanly against real Postgres; 192 frontend Vitest tests green (up from 187) with the unhandled rejection my own change introduced found and fixed; eslint + prettier clean. No local mvn verify per standing convention. STILL OPEN BEFORE MERGE (human-only, not review findings): AC4.3's manual browser walkthrough was never performed in any session (relocation through the real wizard + fr/de Accept-Language negotiation), and the fr-FR/de-DE marketplace.* strings remain AI-produced pending a native-speaker pass (deferred to deferred-work.md). Prior note: Post-review follow-up 2026-10-02 (user asked whether story-review.md was accounted for; re-checking it directly surfaced 2 gaps beyond what the story's own AC text required): added CoachProfileServiceConcurrencyIT.concurrentAddWindowDuringRelocation_newWindowIsNotMissedByTheReStamp, a dedicated two-thread race proving AC1.2's new saveStep1 lock actually serializes against AvailabilityService.addWindow (Finding D, HIGH) -- mutation-checked by temporarily reverting the lock and confirming the new test fails with no lock-retry contention detected, then restoring it; narrowed CityTimezoneValidator's