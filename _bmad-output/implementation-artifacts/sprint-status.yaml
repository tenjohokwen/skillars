  # New carved-out initiative from requirements/ses-email-consolidation.md (2026-09-11): consolidate
  # the two independent outbound-email stacks (SMTP notification module + AWS SES module + a
  # DevSesEmailService bridge between them) onto one OutboundEmailSender port, SES as the eventual
  # sole transport. The source doc's own 7 phases map 1:1 to these 7 stories — each phase compiles,
  # passes CI, and is independently mergeable per the doc. Numbering convention confirmed with user:
  # mirrors video-epic-N / deploy-epic-N / skillars-epic-N.
  ses-epic-1: in-progress
  ses-1-1-introduce-outbound-email-port: done # Phase 1 — port + SES adapter rebuild + registration listeners point at the port. SMTP/MailManager/MailService untouched. CODE REVIEW 2026-09-11 (/bmad-code-review, 3 layers): 5 decision-needed (all resolved by owner) + 24 patches — ALL applied; 5 deferred to deferred-work.md; 5 dismissed as false positives with recorded evidence. Reproduced, not just reasoned: (a) RFC 822 group syntax bypassed EmailAddressParser's multi-recipient guard (parse returns length 1, isGroup()=true, so the length check was dead and the class's documented promise false); (b) the two blank/unset outbox tests asserted against a @TempDir the sender never received, staying green under the exact mutation they existed to catch — now RED on it. Also fixed: 429/403 classified permanent (now uses the SDK's isThrottlingException/isClockSkewException), transport=ses booting green with unresolvable credentials, unvalidated app.ses.region, correlationId sent raw into an SES MessageTag, absent-property wiring zero senders, and InvalidPathException escaping the 'never throws' log transport. Owner decisions: keep SDK default retry until Phase 4; fail fast on credentials; carve EmailAddressParser out of §3.4 (Phase 6 must keep jakarta.mail direct); mask recipients at INFO; add APP_SES_FROM_ADDRESS to secrets-reference.md. 136 test executions green. No mvn verify (CI is the gate).
  ses-1-2-smtp-behind-port-and-containment: done # Phase 2 — SMTP moved behind the port (sealed infrastructure/email/smtp package: SmtpEmailSender/SmtpProperties/ProviderConfig/MailSenderProvider/SmtpHealthIndicator/SmtpHealthProperties/SmtpErrorClassifier/SmtpConfig), MailService/MailManager reimplemented on OutboundEmailSender (EmailContentRenderer extracted, characterization-tested), containment tests landed (EmailTransportArchitectureTest, NoStraySmtpConfigTest — hand-rolled source scan, no ArchUnit dep), dev/uat flipped to transport=smtp (fixes D4), dead spring.mail.*/SPRING_MAIL_* removed (D9). Deviation from AC5's literal text: EmailTransportArchitectureTest's AWS-SDK containment rules scoped to software.amazon.awssdk.services.sesv2 specifically, not the full awssdk prefix — a blanket check false-positives on infrastructure.blobstore/platform.filestorage's pre-existing, unrelated S3 SDK usage (reproduced). CODE REVIEW 2026-09-11 (/bmad-code-review, 3 layers): 4 decision-needed (all resolved by owner) + 14 patches — all 18 applied; 5 deferred to deferred-work.md; 6 dismissed as false positives. Notable fixes: mail.debug=true credential leak to stdout removed; JavaMail connect/read/write timeouts added (previously infinite, on a synchronous AFTER_COMMIT listener path); malformed email payload now classifies as permanent (was silently retryable); docker-compose.local.yml no longer requires real SMTP credentials for a bare local run; new SmtpTransportBootIT boots the actual shipped transport=smtp path against a hand-rolled fake SMTP server; EmailRenderingCharacterizationTest rewritten to real captured golden literals (was self-referential); NoStraySmtpConfigTest rewritten to parse YAML structurally; EmailTransportArchitectureTest now catches inline-FQN evasion, not just import lines. All targeted tests green (22+ suites incl. MailManagerIT, EmailRetrySchedulerIT, NotificationEmailOutboxAtomicityIT, BookingReminderEmailWiringIT, VideoModerationAdminAlertEnvelopeIT, ModerationOutboxIT, new SmtpTransportBootIT, new MailServiceTest); no mvn verify (CI is the gate). Story file: ses-1-2-smtp-behind-port-and-containment.md.
