  skillars-uat-1-admin-bootstrap-and-onboarding-unblock: done  # REVIEW FINDINGS ADDRESSED 2026-08-10: all 11 resolved, full mvn -o verify BUILD SUCCESS (20:23) — 823 unit (+5) + 863 IT, 0F/0E. TWO were worse than reported and needed measurement, not reasoning: (F2) probing a real DB showed a 4-char TLD throws TransactionSystemException, NOT DataIntegrityViolationException — the catch missed it and the app FAILED TO START; Customer.email caps TLDs at 3 chars so .info/.cloud/.tech/.online each bricked the first boot. Fixed with a pre-flight check against the entity constraints + catch widened to RuntimeException (mutation-checked). (F5) enumerating the JVM zone set found 42 legacy aliases surviving the slash filter, not just the 2 cited — all of Brazil/*, Mexico/*, Chile/*, SystemV/* (SystemV carries pre-1987 US DST rules, as wrong as the Etc/GMT+-N block already excluded); rewritten as an ALLOW-LIST of the 10 IANA continent prefixes so future tzdb families are excluded by default. 486 options. ONE rejected on evidence: F8 (Step4 ref not re-syncing) is unreachable — the host page uses a v-if/v-else-if chain of distinct components, so Step4 unmounts and re-reads the store on return; a watcher would have INTRODUCED a bug by overwriting a per-window zone the coach chose. Documented on the ref instead. F4 similarly kept its value: "XX" is what all three registration services already pass and sits in ISO-3166 user-assigned range XA-XZ, so changing it would create the inconsistency; promoted to a named constant and now asserted. Others: @ToString.Exclude on password (configprops/binding-failure messages are a real egress path), honest Javadoc enumerating all 3 refuse-to-start paths, WARN for DST-SHORTENED windows (not just inverted — window deliberately NOT skipped, the remainder is bookable), distinct timezone load-failure state + retry (an empty dropdown read as "no search matches" and left the coach at a disabled Next), setSelectedTimezone action, comment deduplicated 4