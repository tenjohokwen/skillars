  skillars-deferred-110-email-adapter-hardening-outbox-durability-and-doc-accuracy-fixes: done # DEV COMPLETE 2026-09-14 (/bmad-dev-story). All 11 ACs implemented. Owner decisions taken before coding, per the story's own "surface early" Dev Note: AC4a approved (notRetryOn widened to EmailTransportPermanentException); AC4b approved (also added to ignoreException — the symmetric question ses-1.3 left unasked); AC8 decided KEEP retain-and-alert (no code change — NotificationEmailOutboxHandler unchanged, matches OutboxRowProcessor's "never silently drop" precedent); AC9c approved (wrote the additive safety-net migration in addition to the mandatory doc fix). AC5 needed no decision (diagnostic-only WARN enrichment, not a behavioural fork) — TransactionSynchronizationManager context added to the persisted==null log, no fix attempted before a real occurrence is captured. AC1: added a second from-address regex that actually catches a bare literal (verified by injecting one and confirming it fails, then reverting). AC2: SmtpErrorClassifier now inspects MailSendException.getFailedMessages(), classifying SendFailedException by valid-unsent-address presence — closes the 550-rejection misclassification the original fix would have left open. AC3: MailSenderProvider gated on transport=smtp at the class level + constructor-level validation (ordering-independent) + Math.floorMod; new SmtpPropertiesValidator sibling added as redundant defense. AC6: extracted the catch-block guard into deleteBatchAcceptResultIfSeed, exported for direct unit-testing (defensive invariant, not a live-bug fix — loadCoachBookingRequests already swallows every rejection). AC7: tz:[UTC, America/New_York] matrix added to frontend-unit-tests.yml (matrix.label sidesteps the artifact-name collision and the '/' in the TZ id) — verified locally under both zones, 111/111 green, no masked DST spec found. AC9: empirically confirmed via a live Testcontainers Postgres dump that Hibernate's hbm2ddl.auto=update is active