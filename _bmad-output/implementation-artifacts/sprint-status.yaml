ice methods touched (four: login/refresh/logout/clearAuthCookies, not two); removed the stale "no review has run" line (two have now); and corrected a misquotation round 1's own fix had introduced (quotation marks around "all three skp writers" attributed to deferred-142, which says "both AuthService sites", not that). One finding (SecurityUtil vs AuthService as terminateSession's home) was the review's own explicit judgment call, not a defect -- decided explicitly in the story (kept on SecurityUtil, reasoning recorded) rather than silently picking one. Status unchanged at ready-for-dev. Prior note: skillars-deferred-143-account-lock-enforcement-and-forced-logout-session-termination: PRE-IMPLEMENTATION REVIEW 2026-10-05 (story-review.md against HEAD 3a62698c, four-layer verification). Independently re-verified every finding against HEAD before applying, not trusted blindly, per explicit instruction to watch for false positives. Three findings CONFIRMED and fixed: (1) GdprErasureService citation off by one (story said :278-279, setActivated(false)/setLocked(true) are actually at :277-278) -- corrected throughout; (2) AC3's exception list omitted InvalidJWTDataException, which the filter's own catch-block comment names and which genuinely is caught (InvalidJWTDataException extends AuthorizationException, confirmed by reading the exception class itself) -- added to AC3's list; (3) three AC4/Task6 line-range citations drifted (logout_marksTokenUsedAndClearsCookies :382-448 -> :382-412; refresh_* tests :260-381 -> :261-380; insertUser :449-464 -> :449-465) -- all corrected after re-reading AuthResourceIT directly. One review finding was a FALSE POSITIVE and left unchanged: the review claimed the story cites a non-existent deferred-142 filename ("...video-page-redirect-fix...") -- grepped the actual story file and confirmed that string appears nowhere in it; the review fabricated this citation. A second review claim (skp-cookie duplication is documented in deferred-142's Context section, "not its Review Findings section") was also overstated -- deferred-142's Review Findings DEFER section does contain the relevant item (URLEncoder.encode affecting "all three skp writers") -- reworded the citation to name both rather than treating the review's absolute claim as correct. Status unchanged at ready-for-dev; the story's design and both TRUE-verdict ACs (AC1, AC2) needed no changes. Prior note: skillars-deferred-143-account-lock-enforcement-and-forced-logout-session-termination: created via /bmad-create-story 2026-10-05, status -> ready-for-dev. Sourced from manual security analysis (not deferred-work.md, not a code review run) of the auth cookie/session pipeline, requested directly by Mbah. Three findings: (1) AuthService.login()/refresh() never check user.isLocked() -- only login() checks isActivated(), refresh() checks neither -- so UserAdminService.lockUserAccount() (not yet wired to a controller) would be a silent no-op the moment it ships, and any future non-deactivating lock caller is unprotected today; (2) JWTAuthorizationFilter's forced server-side logout (securityUtil.logout(), covering LockedException/DisabledException/JWTTheftException/expired-JWT/etc.) only clears 6 of 8 auth cookies and never revokes the underlying RefreshToken row, unlike AuthService's own voluntary logout(); (3) AuthService.refresh() never re-validates account status at all, which combined with (2) means sessionManager.js's proactive session-extension call can silently resurrect a session the filter just forcibly denied. Design: centralize the account-liveness check as a new private AuthService.ensureAccountIsLive(User) called from both login() and refresh() (reuses existing ApiAdvice LockedException/DisabledException -> 401 security.accLocked/accNotEnabled mappings and existing 3-locale i18n copy, zero new error-handling code); centralize session teardown as a new SecurityUtil.terminateSession(req,res), replacing the deleted SecurityUtil.logout(HttpServletResponse) at its one caller (JWTAuthorizationFilter) and AuthService's own hand-rolled cookie-clearing in logout()/clearAuthCookies(). Explicitly out of scope: the dead /authenticate+OTP pipeline (authApi.login() has zero frontend callers, confirmed by grep -- wiring it up or deleting it is a separate product decision), and the skp-cookie duplication/role-derivation-drift items from skillars-deferred-142's Review Findings (real but a UI-consistency concern, not an auth bypass, since server-side authorization runs off @PreAuthorize + JWT ROLES, not skp). Backend-only, no schema/frontend/endpoint changes. No AuthServiceTest/AuthServiceIT/SecurityUtilTest exist today (confirmed by find) -- new coverage lands in AuthResourceIT (extending insertUser's hardcoded locked=false) plus a new SecurityUtilTest; JWTAuthorizationFilterTest's 7 existing verify(securityUtil).logout(response) assertions will not compile once logout() is deleted, so updating them to terminateSession(...) is mechanical, not optional. Story file: skillars-deferred-143-account-lock-enforcement-and-forced-logout-session-termination.md.
