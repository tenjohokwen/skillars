  # drift across 88 hand-copied @Import(TestConfig.class) headers (only 9 distinct properties exist,
  # 5 near-universal). 37 needed contexts against Spring's default cache maxSize of 32 also means the
  # LRU evicts and rebuilds mid-run — which is why Docker shows ~30, not 37.
  # Plan: AC1 (JVM-static containers via ConnectionDetails beans, NOT @ServiceConnection @Beans) fixes
  # the container explosion alone and is independently committable; AC2-AC4 (one AbstractIntegrationTest
  # base, properties into application-test.yaml, mocks declared once) take 37 contexts to <=10; AC5 adds
  # a deterministic truncate+FLUSHDB reset listener so each class seeds exactly what it needs; AC7 adds
  # a guardrail test that must be proven to fail against the pre-refactor tree; AC8 writes docs/testing.
  # Hard-coded values found and scoped in: `ledger.database.spy` reads NOTHING (real name is
  # log.database.spy) yet 13 classes carry it as pure cache-key poison; tests run postgres:14.18 while
  # production runs postgres:17-alpine; allowed.clients has two incompatible hard-coded values in one
  # suite (main default myClientId,... vs 59 ITs overriding to testClientId only, while
  # SecurityIT.CLIENT_ID is "myClientId") — fixed as a SUPERSET, not a replacement.
  # Two traps caught during story creation and written into AC5 as hard exclusions: truncating
  # main.shedlock would silently disable every @SchedulerLock job for the rest of the JVM
  # (JdbcTemplateLockProvider caches lock names then only UPDATEs — the exact failure deferred-15's
  # review recorded), and the qrtz_* tables are written concurrently by a live clustered Quartz
  # check-in thread. Also flagged: do NOT raise spring.test.context.cache.maxSize as a shortcut — before
  # AC1 that trades context rebuilds for more simultaneously-live containers.
