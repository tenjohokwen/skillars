  skillars-deferred-144-skp-cookie-consolidation-open-redirect-guard-dedup-and-auth-test-cleanup: done # CODE REVIEW PATCHES APPLIED 2026-10-06: status in-progress -> done. All 13 Patch items closed and re-verified by execution -- see the last_updated note above for the full list and test counts. Prior note: /bmad-code-review 2026-10-06: status -> in-progress, 13 Patch action items left for the owner to apply. Four layers (Blind Hunter diff-only, Edge Case Hunter, Acceptance Auditor, plus orchestrator re-verification of every finding against on-disk source -- 9 of the layers' findings were refuted and dismissed, and one of the orchestrator's own earlier refutations was itself overturned by the Edge Case Hunter: getAuthentication() installs the REAL JWT principal on the filter's unrestricted branch, not an anonymous token, despite its own comment saying otherwise). ONE BLOCKER, found by the Acceptance Auditor and then REPRODUCED BY EXECUTION rather than left as a trace: AC8's removal of the fast-path isRefreshTokenRevoked query breaks GdprErasureIT.erase_deactivatesUser_oldSessionRejected (Tests run: 1, Failures: 1, 'Expecting code to raise a throwable.' at GdprErasureIT.java:373) -- a GDPR-erased user's live session is now honoured instead of 401'd, because hasDbRefreshTokenExpired compares a DB_REFRESH_TOKEN claim minted seconds earlier and returns false, so no DB read happens at all; detection slips from immediate to <=5 min. AC7/AC8's regression sweep was scoped to platform.security.** and GdprErasureIT lives in platform.admin.api, so it was structurally outside it -- the blast radius was derived from markAllUsedByUserId's production callers, never its test callers. Owner resolved all three decision items: (1b) keep AC8 and amend the IT to the <=5 min guarantee, accepting the weaker bound explicitly -- via Option A (flip the existing replay assertion to 2xx + add an in-process daoAuthProvider.authorize assertion, ~0 ms, explicitly NOT the AuthResourceIT:375-387 stale-claim JWT mint, which would add an HTTP round-trip); (2) keep the duplicate skp Set-Cookie as documented, no code change; (3c) build the skp JSON payload with Jackson (ObjectNode, to preserve field order and the existing exact-value assertion). Three pre-existing items deferred to deferred-work.md under a new 'code review of skillars-deferred-144 (2026-10-06)' heading: non-canonical route spellings bypassing router/index.js:89's profile-builder gate, auth-only-but-role-unguarded routes accepted as redirect targets, and theft-driven markAllUsedByUserId never terminating a live JWT session. Also recorded as Patch items: a javadoc claim that the DB re-auth path catches 'refresh-token-revoked' users (false -- DaoAuthProvider.authorize never reads refresh_tokens; all three layers found this independently), an AC6.4 comment contradicting AC6.6's own repository javadoc, four test-strength gaps, and the story's own ledger/sprint bookkeeping, which had zero deferred-144 closeout entries. Verified sound: the refactor preserved the load-bearing JwtManagerImpl ANONYMOUS vs AuthService ADMIN fallback divergence, rtkn stayed out of deleteLoginToken, SecurityUtil's skp line was delegated not deleted, and all 29 frontend tests pass including 5 new safeRedirectSpec.js cases plus a 20-payload open-redirect probe against the real route table that found no bypass. Prior note: created via /bmad-create-story 2026-10-05. Bundled from three deferred-work.md sections per the user's explicit selection (code review of skillars-deferred-142, manual review during skillars-deferred-143, code review of skillars-deferred-143), not auto-discovered from a ledger scan. Four themes: (1) new SkillarsProfileCookie record (platform.security.contract) consolidating the skp cookie's wire format, open-coded at AuthService.login()/refresh() and JwtManagerImpl.setSkillarsProfileCookie, also fixing the latent URLEncoder-vs-decodeURIComponent form-encoding mismatch; (2) JwtManagerImpl.deleteLoginToken() ga