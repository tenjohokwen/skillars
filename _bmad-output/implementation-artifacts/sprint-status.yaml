nOrderingIT test that currently pins BookingExpiryScheduler as the one scheduler keeping the old shape); fix mirrors BookingReminderScheduler's established per-booking TransactionTemplate pattern exactly. AC2 fixes a real cross-account race in UserAdminService.removeNotActivatedUsers/deleteUserInTransaction — no re-check of `activated` before deleting, so a user who verifies their email in the window between the scheduler's batch select and their own turn in the per-user delete loop has their now-legitimate account destroyed (confirmed against all four registration-flow activation call sites). AC3 adds @SchedulerLock to the three schedulers that lack it (QuickCompleteTimeoutService, MessageRetentionScheduler, RadarCompositeDlqProcessor) — low-risk-today given single-instance deployment (matching deferred-117 AC4's established reasoning) but a cheap real fix, and RadarCompositeDlqProcessor specifically has a latent correctness gap (findClaimedBatch not scoped to its own claim, no @Version on the entity) that the lock fully closes. No owner decision needed. Story file: skillars-deferred-118-booking-expiry-transaction-race-user-cleanup-toctou-and-scheduler-lock-parity.md.
