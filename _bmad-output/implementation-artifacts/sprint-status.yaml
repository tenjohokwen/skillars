d (819 unit + 38 targeted IT green), 10 deferred (D1-D10 in deferred-work.md), 7 dismissed. All 6 ACs confirmed implemented; every enumeration in the story independently re-counted and exact. Decisions: (D1) accept the split between the zone slots are computed in (windows[0]) and the zone the response advertises (coach profile) — instants are absolute so no wrong moment is transmitted, and the new timeZoneName label makes the display unambiguous; column reconciliation deferred as D8. (D2) restore an IANA guard on coach.getCanonicalTimezone() at the point this story made it authoritative (UTC fallback + WARN, mirroring AvailabilityService), which also closes a VARCHAR(64)->VARCHAR(50) overflow that would have 500'd every booking for a coach with an over-long zone; profile-builder write-path validation deferred as D10. Patches fixed two render-killing frontend defects the story introduced: formatSlot's catch block rethrew the same RangeError on an invalid date (would blank the whole slot list, where the pre-story code returned a harmless 'Invalid Date'), and slot times rendered in the coach's zone with no timezone label. NOT VERIFIED: full IT suite not re-run (5 targeted IT classes only); AC1's browser-DOM check and AC5's notification rendering still need a human spot-check, as the dev disclosed. FLAGGED: deferred D1 (no session-duration cap — one click books the entire availability segment) is HIGH impact and becomes reachable in production for the first time with this story.

