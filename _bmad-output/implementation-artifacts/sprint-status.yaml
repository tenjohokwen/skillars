xist in the file; corrected the story Context section's V139__baseline_seed_data.sql citation, which supported "one authority catalogued" not "one role per user" (real evidence: CoachRegistrationService.java:101, ParentRegistrationService.java:101, PlayerRegistrationService.java:116, AdminBootstrapRunner.java:204); added a revoke-the-token-at-the-provider instruction to the AC1 ops note (the existing text only established provision.sh couldn't misbehave from a stale value, never addressed whether the live Hetzner API token itself should be revoked). Full frontend Vitest suite re-run green at 209/209 across 30 files (208 prior + 1 new absolute-redirect case), ESLint/Prettier clean on all touched files. Status -> done.
