  skillars-deferred-16-messaging-moderation-recovery-identity-safety: done  # 2026-08-06: adversarial code review complete (3 layers). 4 decisions resolved into patches + 14 patches applied, 8 deferred, 5 findings dismissed as false positives after verification. Headline: the story locked three of the FOUR writers of messaging.messages — AdminMessageService.approveMessage/blockMessage were still on an unlocked findById, so concurrent approve-vs-block was last-writer-wins with contradicting admin_action_log rows; and both resolveRecipient copies passed a player-PROFILE id to an SSE registry keyed by USER id, so an adult player was never notified (the story's own identity fix stopped one line short in the two files it rewrote). THREE TESTS COULD NOT FAIL against unfixed code: AgeTierTransitionTest had re-encoded the exact user-id/profile-id conflation AC4 removes (stubCallerPlayerProfile(PLAYER_ID, PLAYER_ID)) so all four PLAYER cases passed under mutation; AC6b asserted createdAt <= lastMessageAt, already guaranteed by two sequential Instant.now() calls; and the MessagingReportService copy of the identity fix had no case where the two id readings diverge (Task 6 case (iv) effectively unimplemented, message-report endpoint never exercised). All three rewritten and mutation-verified — reverting the SSE recipient fails 2, reverting verifyIsParty's PLAYER arm fails 3. Decisions taken: sweeper batch capped at 500 with deterministic ORDER BY (departing from PaymentPendingSweeper's unbounded shape, which raises no per-row queue item); moderation verdict DECOUPLED from the admin-alert insert via REQUIRES_NEW + caught publish, deliberately reversing AC3's atomic coupling — note a try/catch inside the listener body cannot work, since GenerationType.UUID defers the INSERT to flush past the method return; alert cleanup cascaded into GDPR erasure and retention (new MessagesPurgedEvent — messaging publishes, admin listens, module direction rule intact); MessageHeldForReviewEvent.reason persisted on admin_alerts and surfaced in the queue summary. Also: surrogate-safe content previews (the codePointCount change doubled max UTF-16 length into a substring that split pairs and would fail the whole queue page in Jackson), id tiebreaker extended to the four ordered message queries the story left behind, sweeper counter moved outside its transaction. TEST-COUNT CORRECTION: the recorded "840 unit + 883 IT" was wrong in exactly the way Task 11 warned about — the report directory was summed, not the classes surefire ran (three stale IT reports in surefire, MessagingIdentityIT double-counted, one failsafe report for a deleted class). True pre-review ≈816+≈881; post-review full verify 824 unit + 889 IT. One failure, PROVEN pre-existing by re-running it in a clean worktree at HEAD: PlaybackServiceIT's p99 perf assertion, which reads latencies[99] — the maximum, not the p99 — of 100 un-warmed calls (deferred D8). DEFERRED (8 items): spec-prescribed IllegalArgumentException yielding 500 not 403, lock-before-authz ordering in softDeleteMessage, list-only orphan filtering, rolling-deploy enum gap, the code-point limit sitting exactly at gemini max-input-chars, the unforced soft-delete race IT, no end-to-end sweep→queue→approve test, and the flaky perf assertion.

  skillars-deferred-17-booking-request-slot-payload-timezone-integrity: done  # 2026-08-06: story creation, revised after senior-dev review (story-review.md). Anchored on two live defects found while verifying skillars-3-3 Group D's canonicalTimezone item, NOT previously tracked in deferred-work.md: AvailableSlotResponse serializes startDatetime/endDatetime but BookingRequestPage.vue/booking.store.js read .startTime/.endTime throughout (18 occurrences in the page, 4 in the store; every slot renders "Invalid Date", single-booking submit sends requestedStartTime:undefined -> 400), and submitBatch's totalAmount parameter was clobbered with a timezone string by a prior change, breaking batch submission via a BigDecimal deserialization failure. Folded in alongside: skillars-3-3 Group D (canonicalTimezone sent as parent's browser TZ not coach's; formatSlot() has no timezone) and skillars-4-1 D5 (DrillLibraryPage.vue onMounted no error handling). User confirmed scope expansion mid-investigation given production-breaking severity. Review caught and fixed pre-dev: AC5's try/catch option was dead code against fetchDrills' non-rethrowing catch (watch-on-error is now the only option); AC3 and AC4 originally pointed at two different, independently-writable canonicalTimezone columns (coach_profiles vs coach_availability_windows) which would have shipped a new cross-page timezone divergence — AC4 now reads a new CoachAvailabilityResponse field sourced from the same coach-profile column AC3 uses, with a UTC/invalid-zone fallback mirroring AvailabilityService's existing guard. Also fixed: enumeration accuracy (11 not 8 CreateBookingRequest call sites, formatSlot has 4 not 2 call sites, two more canonicalTimezone JSON occurrences in SuspendedCoachBookingBlockIT, ExpiredPackBookingValidationTest's CoachProfile fixtures need setCanonicalTimezone or AC3 makes them silently null-timezone with no test noticing). | CODE REVIEW 2026-08-06: 2 decisions resolved, 9 patches applied and verified (819 unit + 38 targeted IT green), 10 deferred (D1-D10 in deferred-work.md), 7 dismissed. All 6 ACs confirmed implemented; every enumeration in the story independently re-counted and exact. Decisions: (D1) accept the split between the zone slots are computed in (windows[0]) and the zone the response advertises (coach profile) — instants are absolute so no wrong moment is transmitted, and the new timeZoneName label makes the display unambiguous; column reconciliation deferred as D8. (D2) restore an IANA guard on coach.getCanonicalTimezone() at the point this story made it authoritative (UTC fallback + WARN, mirroring AvailabilityService), which also closes a VARCHAR(64)->VARCHAR(50) overflow that would have 500'd every booking for a coach with an over-long zone; profile-builder write-path validation deferred as D10. Patches fixed two render-killing frontend defects the story introduced: formatSlot's catch block rethrew the same RangeError on an invalid date (would blank the whole slot list, where the pre-story code returned a harmless 'Invalid Date'), and slot times rendered in the coach's zone with no timezone label. NOT VERIFIED: full IT suite not re-run (5 targeted IT classes only); AC1's browser-DOM check and AC5's notification rendering still need a human spot-check, as the dev disclosed. FLAGGED: deferred D1 (no session-duration cap — one click books the entire availability segment) is HIGH impact and becomes reachable in production for the first time with this story.

