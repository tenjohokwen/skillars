tus -> done. See its development_status entry for the full summary. Prior note: skillars-deferred-110 dev complete (/bmad-dev-story), status -> review — see its development_status entry for the summary. Earlier prior note: ses-1-7-documentation done, merged (PR #186) and post-merge deferred-work.md pruned (PR #187, one item closed — the notification/index.html MailSenderProvider row ses-1.7 AC1 deleted). skillars-deferred-110 created (mined from deferred-work.md; ses-1-5/ses-1-6 confirmed still blocked on open D-1, explicitly excluded) and set to ready-for-dev. Earlier prior note: ses-1-4 done, merged (PR #183) and post-merge deferred-work.md pruned (PR #184, nothing closed). ses-1-7-documentation created (skipping ses-1-5/ses-1-6, both still gated on the open D-1 domain decision) and set to ready-for-dev. Earlier prior note: ses-1-3 CODE REVIEW complete (/bmad-code-review, 3 layers), status -> done. 3 decision-needed + 8 patch findings (14 patch units after decisions), 4 deferred, 4 dismissed as FPs. CORRECTION to the previous note on this line: the claim that Spring Boot offers 'no property to relax' HealthEndpointGroupMembershipValidator was FALSE — management.endpoint.health.validate-group-membership exists (@ConditionalOnBooleanProperty, matchIfMissing=true, documented in the jar's own spring-configuration-metadata.json). The boot failure itself was real and is now pinned by TransportWiringTest.healthGroupInclude_mustNameOnlyIndicatorsTheActiveTransportRegisters, which asserts both directions against the real HealthEndpointAutoConfiguration. Owner decision D2: the in-doHealthCheck transport check was REVERTED and both indicators are transport-gated beans again exactly as AC1/AC2 specify (SesHealthIndicator @ConditionalOnProperty; SmtpHealthIndicator @Conditional(AllNestedConditions) ANDing provider-presence with transport=smtp), with the notification group's include declared PER PROFILE (prod: ses; dev/uat: smtp; absent from the base file, whose transport=log has no indicator). Owner decision D1: SesHealthIndicator also joins Boot's DEFAULT health group, which docker-compose health-checks and Traefik exposes publicly — a sandboxed account or a missing ses:GetAccount grant would have marked the prod container unhealthy and 503'd the public route while sending still worked; the app healthcheck and the Traefik health-rewrite now target /manage/health/smoke, and the IAM + Phase-5 production-access ordering constraint are documented in docs/deployment/secrets-reference.md. Owner decision D3: a rate-limit rejection no longer consumes one of the six EmailRetryScheduler attempts (a sustained burst previously converged on ATTEMPTS_EXHAUSTED — silent mail loss — in ~5 minutes at the 1/s sandbox rate the validator itself prescribes). Also fixed: a partial GetAccount response threw IllegalArgumentException out of computeHealth (Health.Builder.withDetail asserts non-null) and permanently defeated the TTL cache; rate-limit rejections counted as circuit-breaker failures (3 in a 5-call window opened emailService for ALL mail); the metrics finally block could replace an in-flight exception and flip permanent to retryable; 4 test gaps. 109 targeted tests green incl. EmailTransportArchitectureTest; no mvn verify (CI is the gate). Story file: ses-1-3-health-monitoring-rate-limiting.md.
