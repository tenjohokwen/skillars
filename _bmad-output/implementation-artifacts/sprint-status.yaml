  skillars-deferred-143-account-lock-enforcement-and-forced-logout-session-termination: done # created via /bmad-create-story 2026-10-05. Sourced from manual security analysis (not deferred-work.md, not a code review run) -- AuthService.login()/refresh() never check user.isLocked() (only login() checks isActivated(), refresh() checks neither), and JWTAuthorizationFilter's forced-logout path (securityUtil.logout()) never clears the rtkn/skp cookies nor revokes the underlying RefreshToken row, unlike AuthService's own voluntary logout() -- so a forced denial (theft detection, or a locked account once enforced) can be silently undone by the browser's own proactive session-refresh call (sessionManager.js). Centralized fix: a new AuthService.ensureAccountIsLive(User) helper called from both login() and refresh(); a new SecurityUtil.terminateSession(req,res) that becomes the single session-teardown path for the filter's forced logout, AuthService.logout(), and AuthService.refresh()'s failure branches, replacing SecurityUtil.logout(HttpServletResponse) (deleted) and AuthService's own hand-rolled cookie-clearing. No schema change, no frontend change, no new endpoint. Story file: skillars-deferred-143-account-lock-enforcement-and-forced-logout-session-termination.md. IMPLEMENTED 2026-10-05 via /bmad-dev-story, status -> review. All 4 ACs / 9 tasks done; 97 targeted tests green (66 unit + 31 IT), 0 failures, no local mvn verify per standing convention. Red-green verified empirically rather than assumed: the AC1/AC2 tests were written first and run against unmodified code, both failing with 'Expecting code to raise a throwable' -- confirming a locked-but-activated account really could both log in AND refresh successfully. ONE GENUINE DESIGN DEFECT IN THE STORY FOUND AND FIXED DURING IMPLEMENTATION: the story (and both its pre-implementation review rounds) placed ensureAccountIsLive AFTER refresh()'s token-rotation saveAndFlush. Built exactly as specified, all three refresh_* liveness ITs failed with 409 CONFLICT after a ~5.5s stall, not 401 -- server-side cause captured as 'ERROR: canceling statement due to lock timeout' (SQLState 55P03) -> PessimisticLockingFailureException. Mechanism: saveAndFlush UPDATEs the token row inside refresh()'s own outermost transaction and holds that row lock to the end, while the rejection teardown's revocation runs REQUIRES_NEW against the SAME row -- the inner txn waits for a lock only the outer can release and vice versa, a self-deadlock. REQUIRES_NEW was still the right call for durability (round 2's review was correct about the rollback) but is incompatible with revoking a row the caller already locked. Fixed at the source: the user is now loaded and checked BEFORE the token is rotated, so the rejection path holds no refresh_tokens write at all and the REQUIRES_NEW revocation commits uncontended -- still satisfying AC2 verbatim, and better behaviour independently (a locked account's refresh no longer consumes/rotates a token before being refused). The one teardown that necessarily remains post-write (the ObjectOptimisticLockingFailureException branch) now clears cookies only via a new SecurityUtil.clearAuthCookies(res) -- revoking there would hit the identical deadlock and is redundant anyway, since the optimistic-lock winner already committed used=true on that row. Three smaller deliberate deviations: (1) the story's AuthService.clearAuthCookies(req,res) private wrapper was NOT retained -- once it became a one-line delegation to a full teardown its name was actively misleading and collided with the new cookies-only SecurityUtil.clearAuthCookies, so the five call sites call securityUtil.terminateSession(req,res) directly; (2) the filter's routine branch explicitly calls SecurityContextHolder.clearContext(), which the story's sketch would have silently dropped (the deleted securityUtil.logout(res) did it for EVERY caught cause) -- contradicting AC3's own 'no behavior change for these three'; now guarded by an assertion; (3) added SecurityUtil.clearAuthCookies. AC2's durability is asserted by reading `used` back OUT OF THE DATABASE after the request completes, plus a dedicated IT that forces the caller's transaction to roll back via setRollbackOnly() and proves the revocation survives -- the one property the whole REQUIRES_NEW design exists to guarantee. SEPARATE TEST-HARNESS FINDING (not caused by this story): bare jdbcTemplate writes inside an IT method body never commit, because spring.datasource.hikari.auto-commit=false (application.yaml:183); a diagnostic probe showed UPDATE reporting rowsUpdated=1 while the next statement read the old value, and INSERT-then-SELECT finding 0 rows. Added a documented commitWrite(...) helper and routed every new write through it (AuthResourceIT.setUp already did this via transactionTemplate). DEFER/ledger item found while there: the pre-existing refresh_expiredToken_returns401 seeds its row with a bare jdbcTemplate.update that never commits, so it passes on 'token not found', not 'token expired' -- the expiry branch it is named for is not actually exercised (its fakeRaw cookie does not hash to the seeded token_hash either way). Left unchanged deliberately: AC4 requires the existing refresh_* assertions to pass UNMODIFIED. New SecurityUtilTest (6 tests, first test class for that type); JWTAuthorizationFilterTest's 7 logout(response) assertions split 3 routine / 4 genuine plus 2 new cases including the wrapped-ACCOUNT_NOT_LOGIN_ABLE form DaoAuthProvider actually produces; 7 new AuthResourceIT cases. No schema migration, no frontend change, no new REST endpoint. CODE REVIEW RESOLVED 2026-10-05, status -> done. /bmad-code-review (3 layers) produced 16 raw findings -> 2 patch, 8 defer, 6 dismissed; all four ACs confirmed implemented including both disclosed implementation-time deviations. Both patches independently re-verified before being applied, per standing instruction to watch for false positives -- and the review's own DISMISSALS were spot-checked too (a wrong dismissal hides a real bug): dismissal #2's insertUser call-site inventory (exactly 6, at :108,109,110,113,114,115, all 7-arg) and #3's ChronoUnit import (:32, pre-existing uses at :259,:371) both confirmed accurate. PATCH 1 WAS A REAL BUG, and the most valuable finding of the whole story: refresh()'s multi-tab grace-window branch REASSIGNS the local `token` to a live SUCCESSOR row (AuthService.java:158-165) and falls through to the liveness check, but both rejection branches revoked only the row derived from the raw rtkn cookie on that request -- the stale, already-used original -- so the successor, the account's one live credential, survived a locked-account denial as used=false. Proved empirically rather than by reading: new IT refresh_accountLockedAndStaleCookieReplayedInGraceWindow_revokesTheSuccessorToken reproduces it (login -> refresh -> lock -> replay stale original inside the 30s window); against unfixed code it 401s correctly with security.accLocked but fails on exactly the successor assertion and nothing else. Fixed by capturing `final String resolvedTokenHash = token.getTokenHash()` after the reuse/expiry blocks and revoking it in both the findById and ensureAccountIsLive rejection branches. Two things verified beyond what the review itself stated: (a) the EXPIRY branch provably needs no equivalent fix, since the successor query filters on ExpiresAtAfter(now) so a reassigned token can never be the expired one, and an unreassigned token hashes to exactly the cookie value; (b) the fix is DEADLOCK-SAFE despite this story's history with REQUIRES_NEW -- every path reaching that point has issued no refresh_tokens write from the outer transaction (findByTokenHash and findFirstByUserIdAndUsedFalseAndExpiresAtAfter are SELECTs; both markAllUsedByUserId sites throw immediately), confirmed empirically by the fixed test returning a prompt 401 rather than the 409-after-~5s-stall signature the original self-deadlock produced. PATCH 2 (only 1 of 3 routine filter tests asserted the SecurityContext is cleared) was factually accurate and both assertions were added, but its FRAMING was corrected rather than accepted: on those two paths the context is never populated at all, because attemptAuthorization calls getAuthentication(req) (JWTAuthorizationFilter:191) BEFORE setAuthentication (:193) and both tests throw out of that call, so the new assertions are near-vacuous invariant guards, not the equivalent regression guards the finding implied -- clearContext() is only load-bearing on the MISSING_RIGHTS path, which is why the original assertion was placed there. Comments in the tests say so explicitly. 128 targeted tests green (96 unit + 32 IT), 0 failures, no local mvn verify per standing convention. The 8 deferred items (dead AccountStatusException disjunct in isGenuineDenial, double revocation on the reuse branch, incomplete comment on the optimistic-lock-loser branch, logout's conditional->unconditional revocation, isGenuineDenial's Exception param typing, unguarded transient-DB-failure handling, no per-client throttle on the ACCOUNT_NOT_LOGIN_ABLE write, and USER_NOT_FOUND/UNKNOWN not treated as genuine denials) are all recorded in the story's Review Findings section with reasoning. Also carried forward for the ledger: the pre-existing refresh_expiredToken_returns401 seeds its row with a bare non-committing jdbcTemplate.update, so it passes on 'token not found' rather than 'token expired'.
