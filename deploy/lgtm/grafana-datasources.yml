apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: Prometheus
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      # Must match scrape_interval in prometheus.yml. $__rate_interval is derived from it, and at
      # Grafana's 15s default its windows hold one sample of a 45s scrape: rate() returns nothing.
      timeInterval: 45s

  - name: Loki
    type: loki
    uid: Loki
    url: http://loki:3100
    jsonData:
      derivedFields:
        # Assumes W3C 128-bit trace ID format (32 hex chars, case-insensitive — OTel SDKs may emit
        # uppercase). If this app's trace ID format ever changes, this regex needs updating too.
        - datasourceUid: 'Tempo'
          matcherRegex: '"traceId":"([a-fA-F0-9]{32})"'
          name: TraceID
          url: '$${__value.raw}'

  - name: Tempo
    type: tempo
    uid: Tempo
    url: http://tempo:3200
    jsonData:
      lokiSearch:
        datasourceUid: 'Loki'
      serviceMap:
        datasourceUid: 'Prometheus'
      nodeGraph:
        enabled: true
      search:
        hide: false
      traceQuery:
        limit: 20
      tracesToLogs:
        datasourceUid: 'Loki'
        # Stream labels are app/environment/level (config/logback-spring.xml). There is no `service` label.
        tags: [{ key: 'service.name', value: 'app' }]
        spanStartTimeShift: '1m'
        spanEndTimeShift: '1m'
        filterByTraceId: true
        filterBySpanId: false
      tracesToMetrics:
        datasourceUid: 'Prometheus'
        tags: [{ key: 'service.name', value: 'application' }]
        queries:
          - name: 'Request Rate'
            query: 'rate(http_server_requests_seconds_count{application="$${__tags[\"service.name\"]}"}[5m])'
