# TLS front for the UAT (Hostwinds) object storage (S-25). Install on the box as
# /etc/nginx/sites-available/skillars-uat-storage (symlink into sites-enabled), replacing
# @STORAGE_DOMAIN@ with the STORAGE_DOMAIN value from .env.uat. Full procedure, including the
# certificate step that has to happen BEFORE this file is enabled: docs/deployment/uat-hostwinds-deployment.md
# Step 6.
#
# Why it looks the way it does:
#  - Host is passed through UNCHANGED ($http_host). S3 SigV4 presigned URLs sign the Host header, so a
#    proxy that rewrote it (nginx's default is the upstream address, 127.0.0.1:9500) makes every
#    presigned GET/PUT fail with SignatureDoesNotMatch.
#  - The whole hostname is proxied at path "/" with no prefix, for the same reason (the path is signed too).
#  - Uploads are streamed (no request buffering, no body size cap): the app caps sizes itself, and
#    buffering a video to the 1 vCPU / 1GB box's disk first would be wasted work.
#  - CORS is NOT handled here: storage-init sets the bucket CORS policy and SeaweedFS answers
#    preflights itself. Adding headers here too would duplicate them.

server {
    listen 80;
    listen [::]:80;
    server_name @STORAGE_DOMAIN@;

    # Let's Encrypt HTTP-01 challenge / renewal (certbot --webroot -w /var/www/certbot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name @STORAGE_DOMAIN@;

    ssl_certificate     /etc/letsencrypt/live/@STORAGE_DOMAIN@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@STORAGE_DOMAIN@/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:storage_tls:2m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;

    location / {
        proxy_pass http://127.0.0.1:9500;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
