x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: ${APP_IMAGE}
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-skillars}?TimeZone=UTC
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      # S-24: redis requires a password. `:-` like the other secrets so docker-compose.local.yml, which
      # layers on this file, still interpolates; the gates are the redis container (refuses to start
      # blank) and DeployedSecretsValidator (prod/uat app refuses to boot blank or on the dev default).
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - LOKI_URL=http://loki:3100
      - LOKI_ENABLED=true
      - MANAGEMENT_OTLP_TRACING_ENDPOINT=http://tempo:4318/v1/traces
      # ── Everything below reaches the JVM ONLY because it is listed here ────────────────
      # There is no `env_file:` on this service. Putting a variable in /opt/skillars/.env does
      # nothing on its own — it only feeds ${VAR} placeholders written literally in this file.
      # Until 2026-09-02 this list stopped at MANAGEMENT_OTLP_TRACING_ENDPOINT, so a production
      # deploy silently ignored every mail, Stripe, video and admin-bootstrap value an operator
      # set, and could not start at all (see APP_PAYMENT_STRIPE_API_KEY below).
      # docker-compose.uat.yml is layered over this file (-f docker-compose.yml -f
      # docker-compose.uat.yml), so it INHERITS everything here and only overrides the keys it
      # restates. Add a new variable here and UAT picks it up for free.

      # Mail. GMX_PASSWORD / GMAIL_PASSWORD feed app.email.smtp.provider-configs[*].password
      # (application.yaml), referenced WITHOUT a default, so on the prod profile an unset value is
      # not a degraded mailer — it is an unresolvable placeholder that aborts startup. The `:-`
      # defaults below keep that failure out of the container boot path; a blank password then
      # simply fails SMTP auth at send time, which is diagnosable.
      # EMPTY IS NOT UNSET. Spring applies a ${prop:default} default only when the property is
      # ABSENT; an empty environment variable is present-and-blank and overrides it. So every
      # `:-` default below has to mirror the application's own default, and — the part that is
      # easy to miss — that includes PROFILE defaults, not just application.yaml. Listing a
      # variable here silently disables the corresponding ${VAR:dev-default} in
      # application-dev.yaml / application-uat.yaml, which is why docker-compose.local.yml now
      # restates the dev values it needs. Adding a variable to this block is therefore not a
      # no-op for the other environments: check every profile before you do.
      # ses-1.2 D9: SPRING_MAIL_HOST/PORT/USERNAME/PASSWORD removed — they backed Boot's own
      # autoconfigured JavaMailSenderImpl (spring.mail.*), which nothing in this codebase ever
      # injected; MailSenderProvider builds its own JavaMailSenderImpl instances from
      # app.email.smtp.provider-configs, independently of Boot's autoconfiguration.
      - GMX_PASSWORD=${GMX_PASSWORD:-}
      - GMAIL_PASSWORD=${GMAIL_PASSWORD:-}

      # Payments. A blank APP_PAYMENT_STRIPE_API_KEY makes PaymentConfig.configureStripe() abort
      # startup by design — deliberately loud, since a payment platform booting without a gateway
      # is worse than not booting. The same method refuses an sk_live_/rk_live_ key unless the
      # prod profile is active, so this is the one environment where a live key is accepted.
      - APP_PAYMENT_STRIPE_API_KEY=${APP_PAYMENT_STRIPE_API_KEY:-}
      - APP_PAYMENT_STRIPE_WEBHOOK_SECRET=${APP_PAYMENT_STRIPE_WEBHOOK_SECRET:-}
      - APP_PAYMENT_STRIPE_CONNECT_WEBHOOK_SECRET=${APP_PAYMENT_STRIPE_CONNECT_WEBHOOK_SECRET:-}
      - APP_PAYMENT_STRIPE_OAUTH_CLIENT_ID=${APP_PAYMENT_STRIPE_OAUTH_CLIENT_ID:-}
      - APP_PAYMENT_STRIPE_PUBLISHABLE_KEY=${APP_PAYMENT_STRIPE_PUBLISHABLE_KEY:-}
      # Must be set to an ABSOLUTE https URL on your domain — Stripe rejects a relative
      # redirect_uri, and PaymentConfig only warns about it. Compose cannot nest ${DOMAIN}
      # inside a :- default, so this mirrors application.yaml's relative fallback instead.
      - APP_PAYMENT_STRIPE_OAUTH_CALLBACK_URL=${APP_PAYMENT_STRIPE_OAUTH_CALLBACK_URL:-/api/payment/coaches/me/stripe/callback}
      # Where the OAuth callback sends the coach afterwards (frontend route). Mirrors application.yaml.
      - APP_PAYMENT_STRIPE_CALLBACK_SUCCESS_URL=${APP_PAYMENT_STRIPE_CALLBACK_SUCCESS_URL:-/coach/payment-settings}

      # Video. BUNNY_* are the .env names; the app reads APP_VIDEO_BUNNY_* — same mapping
      # docker-compose.uat.yml uses. LIBRARY_ID must be numeric or VideoProviderConfig fails the
      # whole context, so it keeps a placeholder default rather than an empty string.
      - APP_VIDEO_BUNNY_API_KEY=${BUNNY_API_KEY:-}
      - APP_VIDEO_BUNNY_LIBRARY_ID=${BUNNY_LIBRARY_ID:-123456}
      - APP_VIDEO_BUNNY_CDN_HOSTNAME=${BUNNY_CDN_HOSTNAME:-}
      - APP_VIDEO_BUNNY_WEBHOOK_SIGNING_SECRET=${APP_VIDEO_BUNNY_WEBHOOK_SIGNING_SECRET:-}
      - APP_VIDEO_PLAYBACK_SIGNING_SECRET=${APP_VIDEO_PLAYBACK_SIGNING_SECRET:-}

      # Storage: the single-node SeaweedFS `storage` service below (S3 API). The endpoint is the
      # PUBLIC STORAGE_DOMAIN, not `storage:9500`, because S3Presigner bakes it into every
      # presigned URL and the browser uploads/downloads against it directly. Credentials are the
      # storage service's own identity (STORAGE_ROOT_*), passed as static keys so SES's AWS
      # default credential chain is never involved. Path-style addressing because there is one
      # hostname, not a {bucket}.STORAGE_DOMAIN wildcard.
      # Moving to a managed S3-compatible provider later: point these five lines back at
      # APP_STORAGE_ENDPOINT_URL / APP_STORAGE_S3_* from .env (path-style per provider), copy the
      # bucket over, then drop `storage` + `storage-init` — runbook.md "Moving object storage to a
      # managed provider".
      - APP_STORAGE_BUCKET=${APP_STORAGE_BUCKET:-skillars-prod}
      - APP_STORAGE_ENDPOINT_URL=https://${STORAGE_DOMAIN}
      - APP_STORAGE_REGION=${APP_STORAGE_REGION:-us-east-1}
      - APP_STORAGE_S3_ACCESS_KEY=${STORAGE_ROOT_USER}
      - APP_STORAGE_S3_SECRET_KEY=${STORAGE_ROOT_PASSWORD}
      - APP_STORAGE_S3_PATH_STYLE_ACCESS=true
      # Optional second bucket that StorageBackupService copies uploads to (app.storage.backup.*). All
      # blank = off. Defaults mirror application.yaml.
      - APP_STORAGE_BACKUP_ENDPOINT_URL=${APP_STORAGE_BACKUP_ENDPOINT_URL:-}
      - APP_STORAGE_BACKUP_BUCKET=${APP_STORAGE_BACKUP_BUCKET:-}
      - APP_STORAGE_BACKUP_REGION=${APP_STORAGE_BACKUP_REGION:-us-east-1}
      - APP_STORAGE_BACKUP_ACCESS_KEY=${APP_STORAGE_BACKUP_ACCESS_KEY:-}
      - APP_STORAGE_BACKUP_SECRET_KEY=${APP_STORAGE_BACKUP_SECRET_KEY:-}

      # SES (ses-1.1). No `:-` default on APP_SES_FROM_ADDRESS, deliberately: a genuinely
      # missing value must reach the app as blank and trip SesPropertiesValidator's startup
      # check, not silently vanish behind a fallback (prod runs app.email.transport=ses, so
      # this value is required). Leave the two access keys blank to keep the AWS default
      # credential provider chain, same convention as the storage block above.
      # The transport selector property itself is deliberately NEVER listed in this
      # environment block, in this file or any other compose file — see
      # EmailTransportPropertyValidator's javadoc and NoHardcodedSenderTest: a blank value
      # would override every profile's transport choice simultaneously and abort boot
      # everywhere at once.
      - APP_SES_FROM_ADDRESS=${APP_SES_FROM_ADDRESS}
      - APP_SES_REGION=${APP_SES_REGION:-eu-west-1}
      - APP_SES_ACCESS_KEY=${APP_SES_ACCESS_KEY:-}
      - APP_SES_SECRET_KEY=${APP_SES_SECRET_KEY:-}
      - APP_SES_CONFIGURATION_SET=${APP_SES_CONFIGURATION_SET:-}
      - APP_SES_REPLY_TO_ADDRESS=${APP_SES_REPLY_TO_ADDRESS:-}
      # §4.5 requires this be settable from the environment: the default of 10 makes
      # SesPropertiesValidator WARN on every prod boot, and the remediation that WARN prescribes
      # (drop to 1 on a sandboxed account) is otherwise unreachable without editing committed YAML.
      - APP_SES_MAX_SEND_RATE_PER_SECOND=${APP_SES_MAX_SEND_RATE_PER_SECOND:-10}

      # Platform / AI
      - PLATFORM_PIN_ENCRYPTION_SECRET=${PLATFORM_PIN_ENCRYPTION_SECRET:-}
      - PLATFORM_REGISTRATION_VERIFICATION_SECRET=${PLATFORM_REGISTRATION_VERIFICATION_SECRET:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # developer (default; prod logs a compliance warning, no DPA / EU residency) or vertex (EU region, Google Cloud DPA).
      - GEMINI_MODE=${GEMINI_MODE:-developer}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - GEMINI_VERTEX_PROJECT=${GEMINI_VERTEX_PROJECT:-}
      - GEMINI_VERTEX_LOCATION=${GEMINI_VERTEX_LOCATION:-europe-west4}
      # Path INSIDE the container of the service-account key JSON (mount it read-only; see provisioning-checklist.md).
      - GEMINI_VERTEX_CREDENTIALS_PATH=${GEMINI_VERTEX_CREDENTIALS_PATH:-}
      # AI moderation and safety providers (off unless enabled in config). Defaults mirror application.yaml.
      - ARACHNID_API_BASE_URL=${ARACHNID_API_BASE_URL:-https://api.c3p.ca}
      # S-18: image abuse-media scanning. prod/uat refuse to boot with ARACHNID_ENABLED off or ARACHNID_API_KEY blank
      # unless ALLOW_UNSCANNED_MEDIA=true (a pre-launch override that raises the MediaScanningUnsafe alert).
      - ARACHNID_ENABLED=${ARACHNID_ENABLED:-false}
      - ARACHNID_API_KEY=${ARACHNID_API_KEY:-}
      - ALLOW_UNSCANNED_MEDIA=${ALLOW_UNSCANNED_MEDIA:-false}
      - VIDEOINTEL_PROJECT_ID=${VIDEOINTEL_PROJECT_ID:-}
      - VIDEOINTEL_CREDENTIALS_PATH=${VIDEOINTEL_CREDENTIALS_PATH:-}
      # X-Client-Id values accepted from machine (non-browser) clients, comma-separated. Blank = none.
      # Never reuse the dev placeholders (myClientId, ...): a machine client skips the fingerprint check.
      - ALLOWED_CLIENTS=${ALLOWED_CLIENTS:-}
      - ENVIRONMENT=${ENVIRONMENT:-prod}
      - APP_VERSION=${APP_VERSION:-unknown}
      # Access logging via SLF4J -> Loki. false silences both the 9990 and 8367 loggers;
      # to silence only the noisy management one, re-level skillars.access.management instead.
      - APP_ACCESS_LOG_ENABLED=${APP_ACCESS_LOG_ENABLED:-true}
      - APP_FRONTEND_URL=${APP_FRONTEND_URL:-https://skillars.com}

      # First-admin bootstrap. Inert unless EMAIL and PASSWORD are both non-blank; remove the
      # password from .env and redeploy once the account exists. See secrets-reference.md.
      - APP_BOOTSTRAP_ADMIN_EMAIL=${APP_BOOTSTRAP_ADMIN_EMAIL:-}
      - APP_BOOTSTRAP_ADMIN_PASSWORD=${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
      - APP_BOOTSTRAP_ADMIN_PHONE=${APP_BOOTSTRAP_ADMIN_PHONE:-}
      - APP_BOOTSTRAP_ADMIN_FIRST_NAME=${APP_BOOTSTRAP_ADMIN_FIRST_NAME:-Platform}
      - APP_BOOTSTRAP_ADMIN_LAST_NAME=${APP_BOOTSTRAP_ADMIN_LAST_NAME:-Administrator}
      # JWT access-token signing key: Base64, >= 64 bytes decoded (`openssl rand -base64 64`). Required;
      # DeployedSecretsValidator (prod/uat) and JwtConfiguration abort boot if blank, malformed, short or
      # a dev default. Kept as `:-` like the other secrets so docker-compose.local.yml, which layers on
      # this file, still interpolates; the app is the fail-fast gate. See provisioning-checklist.md.
      - JWT_SIGNING_KEY=${JWT_SIGNING_KEY:-}
    healthcheck:
      # Story ses-1.3 code review 2026-09-12: polls the `smoke` group (db,diskSpace,ping), NOT the
      # default `/manage/health`. The default group is unconditionally every registered contributor
      # — Spring Boot offers no way to exclude one from it — so once SesHealthIndicator landed, a
      # sandboxed SES account (productionAccessEnabled=false) or a missing ses:GetAccount IAM grant
      # would mark this container unhealthy while sending still worked fine. `smoke` is the liveness
      # signal; mail-transport health belongs to the `notification` group and its own alerting.
      # .github/workflows/deploy.yml already polls /manage/health/smoke for exactly this reason.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8367/manage/health/smoke || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    labels:
      - "traefik.enable=true"
      # Main app router → port 9990
      - "traefik.http.routers.app-main.rule=Host(`${DOMAIN}`) && !Path(`/actuator/health`)"
      - "traefik.http.routers.app-main.entrypoints=websecure"
      - "traefik.http.routers.app-main.tls.certresolver=letsencrypt"
      - "traefik.http.routers.app-main.service=app-main-svc"
      - "traefik.http.services.app-main-svc.loadbalancer.server.port=9990"
      # Health rewrite router → port 8367
      - "traefik.http.routers.app-health.rule=Host(`${DOMAIN}`) && Path(`/actuator/health`)"
      - "traefik.http.routers.app-health.entrypoints=websecure"
      - "traefik.http.routers.app-health.tls.certresolver=letsencrypt"
      - "traefik.http.routers.app-health.middlewares=health-rewrite"
      - "traefik.http.routers.app-health.service=app-health-svc"
      - "traefik.http.services.app-health-svc.loadbalancer.server.port=8367"
      # Middleware: /actuator/health → /manage/health/smoke. The router rule above only matches the
      # exact path /actuator/health, so this rewrite has exactly one input. It targets the `smoke`
      # group for the same reason as the container healthcheck above — an external uptime monitor is
      # asking "is the app serving", which mail-transport health must not be able to answer with 503.
      - "traefik.http.middlewares.health-rewrite.replacepathregex.regex=/actuator/health"
      - "traefik.http.middlewares.health-rewrite.replacepathregex.replacement=/manage/health/smoke"
    networks:
      - skillars-internal
      - skillars-observability
      - skillars-data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started
    # skillars-deferred-92 AC3.2, raised again by that story's code review (D2), and again by
    # skillars-deferred-127's code review (2026-09-21). Raised from 30s: SIGTERM now has real work to
    # wait for, and the sum of the shutdown budget does not fit in 30. Worst case is ~53s -- 8s HTTP
    # drain (spring.lifecycle.timeout-per-shutdown-phase) + 36s of sequential executor awaits across
    # the SEVEN pools (infrastructure.threadpool.ExecutorShutdown documents the per-pool split and the
    # arithmetic) + 5s for the auto-configured @Scheduled taskScheduler's own
    # spring.task.scheduling.shutdown.await-termination-period (added when skillars-deferred-127 AC3
    # gave that scheduler 8 threads instead of Spring's single-thread default -- it is NOT one of the
    # seven ExecutorShutdown pools and so is not caught by ExecutorShutdownConfigurationTest, but it
    # takes the identical sequential destroy() slice) + ~4s of remaining context teardown. The seventh
    # ExecutorShutdown pool is reportExecutor, at 8s: report/radar generation was on the shared 2s pool
    # while doing an S3 upload with no retry behind it. Docker SIGKILLs at this deadline regardless, so
    # if you add a pool, a scheduler await, or lengthen an existing one, redo that sum and move this
    # with it. Only the app service needs it; the other eight services here shut down in well under 30s.
    stop_grace_period: 60s
    restart: unless-stopped
    logging: *default-logging

  postgres:
    image: postgres:17-alpine
    volumes:
      - /opt/skillars/data/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-skillars}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-postgres}", "-d", "${POSTGRES_DB:-skillars}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536m
    networks:
      - skillars-internal
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    # S-24: password-protected and reachable ONLY from `app` (network skillars-data). The password is
    # written to a config file in the container's /tmp by the shell builtin printf, so it never appears
    # in any process argument list (`ps`, /proc/<pid>/cmdline, `docker top`). A blank REDIS_PASSWORD
    # makes the container exit instead of starting an open redis. Overriding `command` bypasses the
    # image entrypoint's gosu step, hence `user:` (uid/gid of the redis image, owner of the data dir,
    # see provision.sh); /tmp is world-writable so that user can create the file.
    # Changing the password needs only `docker compose up -d redis app`: the AOF holds data, not the
    # password. No quotes or whitespace in the value (openssl rand -base64 32 output is fine).
    user: "999:1000"
    command:
      - sh
      - -c
      - |
        [ -n "$$REDIS_PASSWORD" ] || { echo "REDIS_PASSWORD is not set; refusing to start redis without a password" >&2; exit 1; }
        printf 'requirepass %s\n' "$$REDIS_PASSWORD" > /tmp/redis-auth.conf
        exec redis-server /tmp/redis-auth.conf --appendonly yes
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    volumes:
      # On the Hetzner Volume, like every other stateful service. A Docker named volume lives on
      # the root disk, so redis was the only one whose data a server rebuild destroyed.
      - /opt/skillars/data/redis:/data
    healthcheck:
      # REDISCLI_AUTH authenticates redis-cli without a -a flag (no password in argv, no warning).
      # Compare against PONG: an unauthenticated ping prints NOAUTH but may still exit 0.
      test: ["CMD-SHELL", "[ \"$$(REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping)\" = PONG ]"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m
    networks:
      - skillars-data
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *default-logging

  # Object storage (uploads: coach photos/gallery, documents, reports). Single-node SeaweedFS
  # serving the S3 API, same image as UAT/local — MinIO's images stopped pulling anonymously on
  # 2026-09-24 (see docker-compose.uat.yml's `storage` comment). Routed through Traefik on its own
  # STORAGE_DOMAIN with its own Let's Encrypt certificate, because browsers PUT/GET presigned URLs
  # against it directly.
  #   -volume.max=0              size the volume count from free disk (the default, 8, caps the
  #                              store at 8 x volumeSizeLimitMB = 8 GB, then writes fail)
  #   -volume.minFreeSpace=10    go read-only at 10% free instead of filling the Hetzner Volume
  #                              that Postgres shares
  # Data lives on the Hetzner Volume (/opt/skillars/data/storage), so volume-backup.sh — which
  # archives everything under /opt/skillars/data except postgres/ — already backs it up.
  # The overlays (uat, uat-hostwinds, local) restate entrypoint/volumes/healthcheck for their own
  # setups; Compose merges by key, so their values win.
  storage:
    image: chrislusf/seaweedfs:3.97
    # SeaweedFS has no env-var credential path worth trusting (seaweedfs/seaweedfs#7311), so the
    # identity file is written from STORAGE_ROOT_* at start. Refuses to start with blank
    # credentials: an S3 endpoint on a public domain must never come up with an empty identity.
    entrypoint: >
      /bin/sh -c "
      if [ -z \"$$STORAGE_ROOT_USER\" ] || [ -z \"$$STORAGE_ROOT_PASSWORD\" ]; then
      echo 'storage: STORAGE_ROOT_USER and STORAGE_ROOT_PASSWORD must be set in /opt/skillars/.env' >&2; exit 1; fi &&
      mkdir -p /etc/seaweedfs &&
      printf '{\"identities\":[{\"name\":\"app\",\"credentials\":[{\"accessKey\":\"%s\",\"secretKey\":\"%s\"}],\"actions\":[\"Admin\",\"Read\",\"Write\",\"List\",\"Tagging\"]}]}' \"$$STORAGE_ROOT_USER\" \"$$STORAGE_ROOT_PASSWORD\" > /etc/seaweedfs/s3.json &&
      exec weed server -s3 -dir=/data -ip.bind=0.0.0.0 -s3.port=9500 -s3.config=/etc/seaweedfs/s3.json
      -master.volumeSizeLimitMB=1024 -volume.max=0 -volume.minFreeSpace=10
      "
    environment:
      - STORAGE_ROOT_USER=${STORAGE_ROOT_USER}
      - STORAGE_ROOT_PASSWORD=${STORAGE_ROOT_PASSWORD}
    volumes:
      - /opt/skillars/data/storage:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.storage.rule=Host(`${STORAGE_DOMAIN}`)"
      - "traefik.http.routers.storage.entrypoints=websecure"
      - "traefik.http.routers.storage.tls.certresolver=letsencrypt"
      - "traefik.http.routers.storage.service=storage-svc"
      - "traefik.http.services.storage-svc.loadbalancer.server.port=9500"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9500"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 768m
    networks:
      - skillars-internal
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *default-logging

  # One-shot: creates the bucket (no-op if it exists) and sets its CORS policy on every
  # `up`. Without CORS the browser's presigned-upload preflight 403s (S3-compatible APIs refuse
  # cross-origin preflights until a bucket policy allows them). The Origin is the app domain,
  # not STORAGE_DOMAIN. Exits when done; `restart` is deliberately left at "no".
  storage-init:
    image: amazon/aws-cli:2.31.13
    depends_on:
      storage:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=${STORAGE_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${STORAGE_ROOT_PASSWORD}
      - AWS_DEFAULT_REGION=us-east-1
      - APP_STORAGE_BUCKET=${APP_STORAGE_BUCKET:-skillars-prod}
      - DOMAIN=${DOMAIN}
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url http://storage:9500 s3 mb s3://$$APP_STORAGE_BUCKET || true &&
      printf '{\"CORSRules\":[{\"AllowedOrigins\":[\"https://%s\"],\"AllowedMethods\":[\"GET\",\"PUT\",\"POST\",\"HEAD\"],\"AllowedHeaders\":[\"*\"],\"ExposeHeaders\":[\"ETag\"],\"MaxAgeSeconds\":3000}]}' \"$$DOMAIN\" > /tmp/s3-cors.json &&
      aws --endpoint-url http://storage:9500 s3api put-bucket-cors --bucket $$APP_STORAGE_BUCKET --cors-configuration file:///tmp/s3-cors.json
      "
    networks:
      - skillars-internal
    logging: *default-logging

  traefik:
    image: traefik:v3.3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # On the Hetzner Volume (provision.sh mounts it at /opt/skillars/data and ONLY there), so a
      # server rebuild does not lose every TLS certificate and hit Let's Encrypt rate limits.
      - /opt/skillars/data/traefik/acme.json:/etc/traefik/acme.json
      - ./deploy/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    ports:
      - "80:80"
      - "443:443"
    command:
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m
    networks:
      - skillars-internal
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *default-logging

  # Alerting architecture: Grafana-managed alerting is the single alert-delivery path. No
  # Alertmanager is deployed and none is planned. Prometheus alerts.yml rules stay (they give
  # Grafana alert state / panels via the Prometheus datasource) but deliver nothing on their own.
  # The full decision + the checklist for a future change that adds Alertmanager is in
  # docs/deployment/monitoring.md#alerting-architecture-the-alertmanager-decision.
  # skillars-deferred-107 AC7 / [DECIDED 2026-09-10]
  prometheus:
    image: prom/prometheus:v3.4.1
    volumes:
      - ./deploy/lgtm/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/lgtm/alerts.yml:/etc/prometheus/alerts.yml:ro
      - /opt/skillars/data/prometheus:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 768m
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      app:
        condition: service_started
    logging: *default-logging
    networks:
      - skillars-observability

  loki:
    image: grafana/loki:3.4.2
    volumes:
      - ./deploy/lgtm/loki.yml:/etc/loki/loki.yml:ro
      - /opt/skillars/data/loki:/loki
    command: -config.file=/etc/loki/loki.yml
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 768m
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    networks:
      - skillars-observability

  tempo:
    image: grafana/tempo:2.9.0
    volumes:
      - ./deploy/lgtm/tempo.yml:/etc/tempo.yaml:ro
      - /opt/skillars/data/tempo:/var/tempo
    command: -config.file=/etc/tempo.yaml
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3200/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512m
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    networks:
      - skillars-observability

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD must be set in .env}
      - GF_SERVER_ROOT_URL=https://${MONITORING_DOMAIN:?MONITORING_DOMAIN must be set in .env}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      # SMTP for Grafana alert notifications
      - GF_SMTP_ENABLED=${GF_SMTP_ENABLED:-}
      - GF_SMTP_HOST=${GF_SMTP_HOST:-}
      - GF_SMTP_USER=${GF_SMTP_USER:-}
      - GF_SMTP_PASSWORD=${GF_SMTP_PASSWORD:-}
      - GF_SMTP_FROM_ADDRESS=${GF_SMTP_FROM_ADDRESS:-}
      - GF_SMTP_FROM_NAME=${GF_SMTP_FROM_NAME:-}
      - GF_SMTP_STARTTLS_POLICY=${GF_SMTP_STARTTLS_POLICY:-}
      # Alert routing targets (used by grafana-alerts.yml contact points via ${...} expansion)
      - GF_ALERT_NOTIFY_EMAIL=${GF_ALERT_NOTIFY_EMAIL:-}
      - GF_SLACK_WEBHOOK_URL=${GF_SLACK_WEBHOOK_URL:-}
    volumes:
      - ./deploy/lgtm/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./deploy/lgtm/grafana-alerts.yml:/etc/grafana/provisioning/alerting/alerts.yml:ro
      - ./deploy/lgtm/grafana-dashboard-config.yml:/etc/grafana/provisioning/dashboards/dashboard.yml:ro
      - ./deploy/lgtm/dashboards:/etc/grafana/dashboards:ro
      - /opt/skillars/data/grafana:/var/lib/grafana
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`${MONITORING_DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.routers.grafana.service=grafana-svc"
      - "traefik.http.services.grafana-svc.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512m
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    networks:
      - skillars-internal
      - skillars-observability

  node_exporter:
    image: prom/node-exporter:v1.9.0
    volumes:
      - /:/host:ro,rslave
    command:
      - --path.rootfs=/host
    pid: host
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9100/metrics || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64m
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    # node_exporter network isolation — WON'T FIX (skillars-deferred-107 AC5 / [DECIDED 2026-09-10];
    # rationale corrected by that story's code review).
    #  1. node_exporter has no published host ports and sits on `skillars-observability`, which is
    #     `internal: true` (no gateway) — it is unreachable off-host.
    #  2. On-host, EVERY container on `skillars-observability` can reach `node_exporter:9100`:
    #     `prometheus` (must — it scrapes it), `loki`, `tempo`, plus `app` and `grafana`
    #     (which also join it for egress). loki/tempo are third-party images; `app`/`grafana`
    #     are first-party. (redis left this network in S-24, see `skillars-data` below.)
    #  3. But `skillars-observability` is `internal: true`, so a compromised loki/tempo/
    #     prometheus has NO route off-host and cannot exfiltrate anything it scrapes from
    #     node_exporter. The only members with egress are `app` and `grafana` — and a compromised
    #     `app` already holds the Postgres password, Stripe/Bunny.net keys and the OTLP endpoint, so
    #     host CPU/memory/disk gauges are not a meaningful escalation on top of that.
    #  4. A dedicated 2-member `prometheus`+`node_exporter` network was evaluated and REJECTED: it
    #     adds a fourth bridge network and a scrape-topology special case for negligible security gain.
    #  5. REVISIT if a container with BOTH node_exporter reachability AND its own egress is ever added
    #     to `skillars-observability` (today only the first-party `app`/`grafana` have both).
    networks:
      - skillars-observability

networks:
  skillars-internal:
    driver: bridge
    # Do NOT set internal: true — app / grafana / traefik need outbound internet for
    # OTLP/email/Bunny.net/Stripe and ACME.
  # skillars-deferred-88 AC8: egress firewall for the observability stack. internal: true means no
  # gateway is attached, so containers on THIS network alone have no route off-host — a compromised
  # prometheus/loki/tempo/node_exporter cannot exfiltrate or call home. app and grafana join
  # BOTH networks (they legitimately need egress AND must reach these services); every other peer
  # edge is preserved because the two parties still share a network. No host iptables involved.
  skillars-observability:
    driver: bridge
    internal: true
  # S-24: redis lives alone with the app. Nothing on skillars-observability (grafana, loki, tempo,
  # prometheus, node_exporter) shares a network with it, so a compromised monitoring component cannot
  # even resolve `redis`; the password is the second layer. internal: true because redis needs no
  # egress. Anything that ever needs redis (e.g. a redis_exporter) must join this network explicitly.
  skillars-data:
    driver: bridge
    internal: true

# No top-level `volumes:` key: every stateful service (storage included) binds under
# /opt/skillars/data, which provision.sh mounts from the Hetzner Volume. docker-compose.uat.yml
# declares its own `volumes:` block (skillars-uat-storage); its `storage` service's /data mount
# replaces the bind above when merged (Compose merges volumes by container path).
