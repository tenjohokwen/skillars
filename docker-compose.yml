x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: ${APP_IMAGE}
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-skillars}?TimeZone=UTC
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - LOKI_URL=http://loki:3100
      - LOKI_ENABLED=true
      - MANAGEMENT_OTLP_TRACING_ENDPOINT=http://tempo:4318/v1/traces
      # ── Everything below reaches the JVM ONLY because it is listed here ────────────────
      # There is no `env_file:` on this service. Putting a variable in /opt/skillars/.env does
      # nothing on its own — it only feeds ${VAR} placeholders written literally in this file.
      # Until 2026-09-02 this list stopped at MANAGEMENT_OTLP_TRACING_ENDPOINT, so a production
      # deploy silently ignored every mail, Stripe, video and admin-bootstrap value an operator
      # set, and could not start at all (see APP_PAYMENT_STRIPE_API_KEY below).
      # docker-compose.uat.yml is layered over this file (-f docker-compose.yml -f
      # docker-compose.uat.yml), so it INHERITS everything here and only overrides the keys it
      # restates. Add a new variable here and UAT picks it up for free.

      # Mail. SPRING_MAIL_PASSWORD / GMX_PASSWORD / GMAIL_PASSWORD are referenced by
      # application.yaml WITHOUT a default, so on the prod profile an unset value is not a
      # degraded mailer — it is an unresolvable placeholder that aborts startup. The `:-`
      # defaults below keep that failure out of the container boot path; a blank password then
      # simply fails SMTP auth at send time, which is diagnosable.
      # EMPTY IS NOT UNSET. Spring applies a ${prop:default} default only when the property is
      # ABSENT; an empty environment variable is present-and-blank and overrides it. So every
      # `:-` default below has to mirror the application's own default, and — the part that is
      # easy to miss — that includes PROFILE defaults, not just application.yaml. Listing a
      # variable here silently disables the corresponding ${VAR:dev-default} in
      # application-dev.yaml / application-uat.yaml, which is why docker-compose.local.yml now
      # restates the dev values it needs. Adding a variable to this block is therefore not a
      # no-op for the other environments: check every profile before you do.
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST:-mail.gmx.net}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT:-587}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME:-blue-bone@gmx.de}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD:-}
      - GMX_PASSWORD=${GMX_PASSWORD:-}
      - GMAIL_PASSWORD=${GMAIL_PASSWORD:-}

      # Payments. A blank APP_PAYMENT_STRIPE_API_KEY makes PaymentConfig.configureStripe() abort
      # startup by design — deliberately loud, since a payment platform booting without a gateway
      # is worse than not booting. The same method refuses an sk_live_/rk_live_ key unless the
      # prod profile is active, so this is the one environment where a live key is accepted.
      - APP_PAYMENT_STRIPE_API_KEY=${APP_PAYMENT_STRIPE_API_KEY:-}
      - APP_PAYMENT_STRIPE_WEBHOOK_SECRET=${APP_PAYMENT_STRIPE_WEBHOOK_SECRET:-}
      - APP_PAYMENT_STRIPE_OAUTH_CLIENT_ID=${APP_PAYMENT_STRIPE_OAUTH_CLIENT_ID:-}
      - APP_PAYMENT_STRIPE_PUBLISHABLE_KEY=${APP_PAYMENT_STRIPE_PUBLISHABLE_KEY:-}
      # Must be set to an ABSOLUTE https URL on your domain — Stripe rejects a relative
      # redirect_uri, and PaymentConfig only warns about it. Compose cannot nest ${DOMAIN}
      # inside a :- default, so this mirrors application.yaml's relative fallback instead.
      - APP_PAYMENT_STRIPE_OAUTH_CALLBACK_URL=${APP_PAYMENT_STRIPE_OAUTH_CALLBACK_URL:-/api/payment/coaches/me/stripe/callback}

      # Video. BUNNY_* are the .env names; the app reads APP_VIDEO_BUNNY_* — same mapping
      # docker-compose.uat.yml uses. LIBRARY_ID must be numeric or VideoProviderConfig fails the
      # whole context, so it keeps a placeholder default rather than an empty string.
      - APP_VIDEO_BUNNY_API_KEY=${BUNNY_API_KEY:-}
      - APP_VIDEO_BUNNY_LIBRARY_ID=${BUNNY_LIBRARY_ID:-123456}
      - APP_VIDEO_BUNNY_CDN_HOSTNAME=${BUNNY_CDN_HOSTNAME:-}
      - APP_VIDEO_BUNNY_WEBHOOK_SIGNING_SECRET=${APP_VIDEO_BUNNY_WEBHOOK_SIGNING_SECRET:-}
      - APP_VIDEO_PLAYBACK_SIGNING_SECRET=${APP_VIDEO_PLAYBACK_SIGNING_SECRET:-}

      # Storage. Leave the two S3 keys blank to keep the AWS default credential provider chain
      # (instance profile / ~/.aws), which is what this deploy used before these lines existed.
      - APP_STORAGE_BUCKET=${APP_STORAGE_BUCKET:-skillars-dev}
      - APP_STORAGE_ENDPOINT_URL=${APP_STORAGE_ENDPOINT_URL:-http://localhost:9000}
      - APP_STORAGE_REGION=${APP_STORAGE_REGION:-us-east-1}
      - APP_STORAGE_S3_ACCESS_KEY=${APP_STORAGE_S3_ACCESS_KEY:-}
      - APP_STORAGE_S3_SECRET_KEY=${APP_STORAGE_S3_SECRET_KEY:-}

      # Platform / AI
      - PLATFORM_PIN_ENCRYPTION_SECRET=${PLATFORM_PIN_ENCRYPTION_SECRET:-}
      - PLATFORM_REGISTRATION_VERIFICATION_SECRET=${PLATFORM_REGISTRATION_VERIFICATION_SECRET:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ENVIRONMENT=${ENVIRONMENT:-prod}
      - APP_VERSION=${APP_VERSION:-unknown}
      # Access logging via SLF4J -> Loki. false silences both the 9990 and 8367 loggers;
      # to silence only the noisy management one, re-level skillars.access.management instead.
      - APP_ACCESS_LOG_ENABLED=${APP_ACCESS_LOG_ENABLED:-true}
      - APP_FRONTEND_URL=${APP_FRONTEND_URL:-https://skillars.com}

      # First-admin bootstrap. Inert unless EMAIL and PASSWORD are both non-blank; remove the
      # password from .env and redeploy once the account exists. See secrets-reference.md.
      - APP_BOOTSTRAP_ADMIN_EMAIL=${APP_BOOTSTRAP_ADMIN_EMAIL:-}
      - APP_BOOTSTRAP_ADMIN_PASSWORD=${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
      - APP_BOOTSTRAP_ADMIN_PHONE=${APP_BOOTSTRAP_ADMIN_PHONE:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8367/manage/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    labels:
      - "traefik.enable=true"
      # Main app router → port 9990
      - "traefik.http.routers.app-main.rule=Host(`${DOMAIN}`) && !Path(`/actuator/health`)"
      - "traefik.http.routers.app-main.entrypoints=websecure"
      - "traefik.http.routers.app-main.tls.certresolver=letsencrypt"
      - "traefik.http.routers.app-main.service=app-main-svc"
      - "traefik.http.services.app-main-svc.loadbalancer.server.port=9990"
      # Health rewrite router → port 8367
      - "traefik.http.routers.app-health.rule=Host(`${DOMAIN}`) && Path(`/actuator/health`)"
      - "traefik.http.routers.app-health.entrypoints=websecure"
      - "traefik.http.routers.app-health.tls.certresolver=letsencrypt"
      - "traefik.http.routers.app-health.middlewares=health-rewrite"
      - "traefik.http.routers.app-health.service=app-health-svc"
      - "traefik.http.services.app-health-svc.loadbalancer.server.port=8367"
      # Middleware: /actuator/health → /manage/health ($$1 escapes $ from Compose interpolation)
      - "traefik.http.middlewares.health-rewrite.replacepathregex.regex=/actuator/(.*)"
      - "traefik.http.middlewares.health-rewrite.replacepathregex.replacement=/manage/$$1"
    networks:
      - skillars-internal
      - skillars-observability
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started
    # skillars-deferred-92 AC3.2, raised again by that story's code review (D2). Raised from 30s:
    # SIGTERM now has real work to wait for, and the sum of the shutdown budget does not fit in 30.
    # Worst case is ~48s -- 8s HTTP drain (spring.lifecycle.timeout-per-shutdown-phase) + 36s of
    # sequential executor awaits across the SEVEN pools (infrastructure.threadpool.ExecutorShutdown
    # documents the per-pool split and the arithmetic) + ~4s of remaining context teardown. The
    # seventh pool is reportExecutor, at 8s: report/radar generation was on the shared 2s pool while
    # doing an S3 upload with no retry behind it. Docker SIGKILLs at this deadline regardless, so if
    # you add a pool or lengthen an await, redo that sum and move this with it. Only the app service
    # needs it; the other eight services here shut down in well under 30s.
    stop_grace_period: 55s
    restart: unless-stopped
    logging: *default-logging

  postgres:
    image: postgres:17-alpine
    volumes:
      - /opt/skillars/data/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-skillars}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-postgres}", "-d", "${POSTGRES_DB:-skillars}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536m
    networks:
      - skillars-internal
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      # On the Hetzner Volume, like every other stateful service. A Docker named volume lives on
      # the root disk, so redis was the only one whose data a server rebuild destroyed.
      - /opt/skillars/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m
    networks:
      - skillars-observability
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *default-logging

  traefik:
    image: traefik:v3.3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # On the Hetzner Volume (provision.sh mounts it at /opt/skillars/data and ONLY there), so a
      # server rebuild does not lose every TLS certificate and hit Let's Encrypt rate limits.
      - /opt/skillars/data/traefik/acme.json:/etc/traefik/acme.json
      - ./deploy/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    ports:
      - "80:80"
      - "443:443"
    command:
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m
    networks:
      - skillars-internal
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.4.1
    volumes:
      - ./deploy/lgtm/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/lgtm/alerts.yml:/etc/prometheus/alerts.yml:ro
      - /opt/skillars/data/prometheus:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 768m
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    networks:
      - skillars-observability

  loki:
    image: grafana/loki:3.4.2
    volumes:
      - ./deploy/lgtm/loki.yml:/etc/loki/loki.yml:ro
      - /opt/skillars/data/loki:/loki
    command: -config.file=/etc/loki/loki.yml
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 768m
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    networks:
      - skillars-observability

  tempo:
    image: grafana/tempo:2.9.0
    volumes:
      - ./deploy/lgtm/tempo.yml:/etc/tempo.yaml:ro
      - /opt/skillars/data/tempo:/var/tempo
    command: -config.file=/etc/tempo.yaml
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3200/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512m
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    networks:
      - skillars-observability

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD must be set in .env}
      - GF_SERVER_ROOT_URL=https://${MONITORING_DOMAIN:?MONITORING_DOMAIN must be set in .env}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      # SMTP for Grafana alert notifications
      - GF_SMTP_ENABLED=${GF_SMTP_ENABLED:-}
      - GF_SMTP_HOST=${GF_SMTP_HOST:-}
      - GF_SMTP_USER=${GF_SMTP_USER:-}
      - GF_SMTP_PASSWORD=${GF_SMTP_PASSWORD:-}
      - GF_SMTP_FROM_ADDRESS=${GF_SMTP_FROM_ADDRESS:-}
      - GF_SMTP_FROM_NAME=${GF_SMTP_FROM_NAME:-}
      - GF_SMTP_STARTTLS_POLICY=${GF_SMTP_STARTTLS_POLICY:-}
      # Alert routing targets (used by grafana-alerts.yml contact points via ${...} expansion)
      - GF_ALERT_NOTIFY_EMAIL=${GF_ALERT_NOTIFY_EMAIL:-}
      - GF_SLACK_WEBHOOK_URL=${GF_SLACK_WEBHOOK_URL:-}
    volumes:
      - ./deploy/lgtm/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./deploy/lgtm/grafana-alerts.yml:/etc/grafana/provisioning/alerting/alerts.yml:ro
      - ./deploy/lgtm/grafana-dashboard-config.yml:/etc/grafana/provisioning/dashboards/dashboard.yml:ro
      - ./deploy/lgtm/skillars-dashboard.json:/etc/grafana/provisioning/dashboards/skillars-dashboard.json:ro
      - /opt/skillars/data/grafana:/var/lib/grafana
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`${MONITORING_DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.routers.grafana.service=grafana-svc"
      - "traefik.http.services.grafana-svc.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512m
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    networks:
      - skillars-internal
      - skillars-observability

  node_exporter:
    image: prom/node-exporter:v1.9.0
    volumes:
      - /:/host:ro,rslave
    command:
      - --path.rootfs=/host
    pid: host
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9100/metrics || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64m
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    networks:
      - skillars-observability

networks:
  skillars-internal:
    driver: bridge
    # Do NOT set internal: true — app / grafana / traefik need outbound internet for
    # OTLP/email/Bunny.net/Stripe and ACME.
  # skillars-deferred-88 AC8: egress firewall for the observability stack. internal: true means no
  # gateway is attached, so containers on THIS network alone have no route off-host — a compromised
  # prometheus/loki/tempo/redis/node_exporter cannot exfiltrate or call home. app and grafana join
  # BOTH networks (they legitimately need egress AND must reach these services); every other peer
  # edge is preserved because the two parties still share a network. No host iptables involved.
  skillars-observability:
    driver: bridge
    internal: true

# No top-level `volumes:` key: every stateful service now binds under /opt/skillars/data, which
# provision.sh mounts from the Hetzner Volume. docker-compose.uat.yml declares its own
# `volumes:` block (skillars-uat-minio) and still merges correctly against this file.
