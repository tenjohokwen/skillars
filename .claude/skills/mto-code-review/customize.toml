# DO NOT EDIT -- overwritten on every update.
#
# Workflow customization surface for mto-code-review (Mature/Tested Optimized variant).
# Mirrors the agent customization shape under the [workflow] namespace.
# Enhanced persistent facts to reduce false positives in hardened codebases.

[workflow]

# --- Configurable below. Overrides merge per BMad structural rules: ---
#   scalars: override wins • arrays (persistent_facts, activation_steps_*): append
#   arrays-of-tables with `code`/`id`: replace matching items, append new ones.

# Steps to run before the standard activation (config load, greet).
# Overrides append. Use for pre-flight loads, compliance checks, etc.

activation_steps_prepend = []

# Steps to run after greet but before the workflow begins.
# Overrides append. Use for context-heavy setup that should happen
# once the user has been acknowledged.

activation_steps_append = []

# Persistent facts the workflow keeps in mind for the whole run
# (standards, compliance constraints, stylistic guardrails).
# Distinct from the runtime memory sidecar — these are static context
# loaded on activation. Overrides append.
#
# Each entry is either:
#   - a literal sentence, e.g. "All stories must include testable acceptance criteria."
#   - a file reference prefixed with `file:`, e.g. "file:{project-root}/docs/standards.md"
#     (glob patterns are supported; the file's contents are loaded and treated as facts).

persistent_facts = [
  "file:{project-root}/**/project-context.md",
  "This is a mature, hardened codebase with many prior shipped stories. Review for REAL issues only, not coding-style conformance or hypothetical risks. False positives waste time.",
  "Before flagging anything as missing or wrong: read the COMPLETE method/class Javadoc (not just the signature). This codebase documents design tradeoffs, accepted risks, and deliberate pattern choices in Javadoc. A gap that looks obvious may have an explicit documented reason.",
  "Before flagging a catch block, retry pattern, logging gap, or null check as wrong or missing: find and read the CLOSEST RELATED implementation of the same pattern elsewhere in the module (e.g. compare a catch block against the nearest sibling handler). Verify the flagged code actually diverges from the established module shape before reporting divergence.",
  "Before flagging nullability or defensive-check gaps as missing: verify the external API/library contract DIRECTLY (Spring Data JPA, Stripe SDK, etc.). Spring Data JPA collection-returning queries never return null; Stripe SDK resource objects always carry their own id. Check a flagged value's actual origin and real contract, not assumptions.",
  "When tracing an exception or null-degradation path: follow it ALL THE WAY TO ITS TERMINAL HANDLING (the actual catch, guard, or no-op skip that resolves it), not just to the first check encountered. A value that looks unguarded at one line may already degrade gracefully a few lines later.",
  "Before suggesting added logging, instrumentation, or a fix: check whether it's already centralized in a shared utility or base class. Don't recommend per-call-site duplication of what a shared component already provides.",
  "Check test coverage for every new or changed method. But never claim coverage is 'missing' without grepping the test tree and checking the story's Test Plan section. A claim of absence requires a recorded negative search, not an impression.",
  "Verify external API/library behavior empirically against a real database or SDK if you're uncertain. Don't rely on framework documentation alone — actual behavior under real conditions can differ from the generic contract.",
  "Every file:line citation in a finding must come from reading the actual code, not extrapolation or memory. Stale or fabricated locations undermine the entire finding.",
  "Before recommending a specific fix pattern, annotation, or validator: confirm it actually applies to this context and exists in the project's real dependencies. Don't invent patterns that don't exist (e.g. @PackagePrivate is not a Java annotation).",
  "When multiple reviewers flag the same issue, deduplicate. A finding one layer dismisses as a false positive or already-handled must not also appear in another layer's final report.",
  "If the spec explicitly says 'implementer decides during implementation' for a design choice: that is NOT a violation if the implementation made a deliberate, documented choice. Only report spec deviations where the spec is explicit and unambiguous.",
  "This codebase is post-audit with established patterns. Report only genuine bugs and real spec violations, not style preferences, over-engineering suggestions, or pre-existing architectural choices you disagree with.",
]

# Scalar: executed when the workflow reaches its final step,
# after review findings are presented and sprint status is synced. Override wins.
# Leave empty for no custom post-completion behavior.

on_complete = ""
