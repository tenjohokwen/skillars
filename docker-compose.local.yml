services:
  app:
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - APP_VIDEO_BUNNY_LIBRARY_ID=123456
      - MANAGEMENT_HEALTH_MAIL_ENABLED=false
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}
      - GMAIL_PASSWORD=${GMAIL_PASSWORD}
      - GMX_PASSWORD=${GMX_PASSWORD}
      # App container talks to MinIO over the compose network by service name.
      # The presigned upload URLs it generates also use this host — see the
      # /etc/hosts note by the `minio` service below for why that's required.
      - APP_STORAGE_ENDPOINT_URL=http://minio:9000
    ports:
      - "9990:9990"   # main app
      - "8367:8367"   # actuator/health (management port)
    depends_on:
      minio:
        condition: service_healthy
  postgres:
    volumes:
      - skillars-local-postgres:/var/lib/postgresql/data
  loki:
    volumes:
      - skillars-local-loki:/loki
  tempo:
    volumes:
      - skillars-local-tempo:/var/tempo
  prometheus:
    volumes:
      - skillars-local-prometheus:/prometheus
  grafana:
    ports:
      - "3000:3000"   # Grafana UI
    volumes:
      - skillars-local-grafana:/var/lib/grafana

  # Local S3-compatible storage so file uploads (e.g. coach profile photos) don't
  # need real AWS credentials in dev.
  #
  # The `app` container reaches this over the compose network as `minio:9000`.
  # Presigned upload URLs the app hands back to the browser use that same host —
  # but your browser runs on the host machine, not inside the compose network, so
  # it can't resolve `minio` on its own. Add this one-time entry to /etc/hosts:
  #   127.0.0.1 minio
  # That plus the published port below (9000:9000) makes `http://minio:9000/...`
  # resolve to this container from both the app and your browser.
  minio:
    image: minio/minio:RELEASE.2024-01-13T07-53-03Z
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - skillars-local-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - skillars-internal
    restart: unless-stopped

  # One-shot: creates the dev bucket on every startup (no-op if it already exists)
  minio-init:
    image: minio/mc:RELEASE.2024-01-13T08-44-48Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123 &&
      mc mb --ignore-existing local/skillars-dev
      "
    networks:
      - skillars-internal

volumes:
  skillars-local-postgres:
  skillars-local-loki:
  skillars-local-tempo:
  skillars-local-prometheus:
  skillars-local-grafana:
  skillars-local-minio: