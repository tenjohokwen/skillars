# Team override for mto-code-review. Committed to the repo — applies to
# everyone running the mature-codebase-calibrated review variant on this
# project.
#
# Added 2026-10-02 after skillars-deferred-139: running mto-code-review on
# Haiku 4.5 surfaced zero of the 15 patches and 4 decision-needed items that
# the same diff produced under bmad-code-review on Opus 5. Cause: this
# skill's false-positive-reduction framing ("mature codebase, assume
# deliberate, ignore hypothetical risk") was written for a model strong
# enough to actually do the verification it demands (read the full Javadoc,
# check sibling patterns, grep the test tree) before dismissing something.
# A weaker model skips the verification step and keeps the permission to
# dismiss, turning "don't report unverified noise" into "assume everything
# is fine." The specific findings it lost were exactly the kind the
# "mature codebase" framing primes a reviewer to wave off — open design
# ambiguity (a timezone field silently discarded, suspended-coach gating
# never checked, a edit affordance with no underlying row) that looks like
# "the mature codebase must have considered this" right up until someone
# reads the code. These facts exist to force the verification step to
# actually happen, and to stop ambiguity from being misread as noise.

[workflow]

persistent_facts = [
  # --- Ambiguity is not noise ---
  "Ambiguous design intent is not a false positive. If the correct fix depends on information only a human has — the exact situation this skill's own triage buckets as 'decision_needed' — that is precisely the finding to surface, not discard. 'This mature codebase probably intended it this way' is a hypothesis, not a verification; it does not license dropping the finding.",
  "Dismissing a finding is reserved for things you have actively disproven, not things you merely find plausible. A dismissal or 'no issue here' conclusion must be backed by a specific citation — a quoted Javadoc sentence, a sibling file:line showing the same pattern, a grep result showing tests already exist, a confirmed library contract. If you cannot produce that citation, do not dismiss: report the finding (as patch or decision_needed) and let triage decide.",

  # --- Mandatory sweep for self-flagged ambiguity ---
  "Before concluding a review is clean, re-scan the spec/story file and the diff for the author's own ambiguity markers: phrases like 'implementer decides', 'TBD', 'open question', 'deferred', 'revisit', a reference to another deferred-story's open item (e.g. 'deferred-17 D8'), or a Dev Notes paragraph that hedges a design choice. Every marker found must produce either a finding or a documented reason it's already resolved by this diff — never pass over it silently.",
  "'Implementer decides during implementation' only excuses a deviation when the implementation documents *what* it decided and *why*. If the decision point is still open — no documented resolution in the diff or story — that is a decision_needed finding, not grounds for dismissal.",

  # --- Conservative means surfaced, not suppressed ---
  "When the triage rule says to 'prefer the more conservative classification' under uncertainty, conservative means the classification that puts the finding in front of a human — decision_needed over dismiss, patch over defer. Silently dropping a finding is never the conservative choice; it is the one choice triage cannot later correct.",

  # --- Low finding count is a signal to re-check yourself, not a result ---
  "A near-zero finding count on a diff that touches multiple files, adds new endpoints, or adds new UI components is a signal to re-check your own work, not evidence of a clean review. Before finalizing a clean result, re-read each changed file once more looking specifically for the categories this skill's framing tells you to downplay: ambiguous design intent, missing error handling, swallowed exceptions, and untested branches.",
]
