# Team override for mto-code-review. Committed to the repo — applies to everyone running the
# mature-codebase-calibrated review variant on this project.
#
# --- History ---
#
# Added 2026-10-02 after skillars-deferred-139, where running this skill on Haiku 4.5 surfaced 0
# of the 19 findings the same diff produced under bmad-code-review on Opus 5. That version of
# this file appended five exhortation facts: ambiguity is not noise, dismissals need citations,
# "conservative" means surfaced, a mandatory hedge-marker sweep, and a low-finding-count
# self-check.
#
# Rewritten 2026-10-03 after skillars-deferred-141, which proves those exhortations did not work.
# On the same model, the same skill produced 2 findings and BOTH were false positives — one
# prescribing a call to `getCurrentUserId()`, a method that exists nowhere in the codebase. The
# low-finding-count self-check in particular was a no-op: 2 findings on a 623-line diff adding a
# page, a route, an endpoint permission, three locales and two specs did not trip it, because
# "near-zero" was undefined and self-assessed.
#
# The conclusion, recorded so it is not re-learned a third time: telling a reviewer to verify
# does not make verification happen. The real fix was mechanical and now lives in the skill's own
# step files — a verification target list derived from the diff, a blast-radius sweep for shared
# symbols, an execution gate (run the suite, apply the mutation, measure the CSS), a fourth
# "Claims Auditor" layer that tests the spec's own claims, and a NUMERIC coverage floor
# (`max(1, lines/150)` plus one per endpoint/route/shared-symbol/CSS-AC) that cannot be reasoned
# away. The over-suppressive persistent facts were rebalanced in the skill's customize.toml,
# which the append-only override mechanism here could not have fixed.
#
# Most of the five original facts are now in that rebalanced base set. What remains below is only
# what is specific to THIS project and not already covered upstream. Do not re-add general
# "try harder" exhortations here — they have been measured twice and do not change behaviour.

[workflow]

persistent_facts = [
  # Project-specific execution commands, so no layer has to discover them under time pressure.
  "On this project the runnable checks are: frontend unit tests `cd src/frontend && npx vitest run` (report the real `Test Files` / `Tests` counts, and read stderr for Vue/router warnings); targeted backend tests `mvn -o test -Dtest=<ClassName> -DskipFrontend=true` with results in `target/surefire-reports/<FQCN>.txt`; lint `cd src/frontend && npx eslint <paths>` and `npx prettier --check <paths>`. NEVER run a local `mvn verify` — GitHub CI is the sole full-verification gate on this project, and a local full run is both slow and not the gate.",

  # Project-specific precedent map for the T3 target rows, so 'mirror the precedent' is checkable.
  "When this project's specs say to mirror an existing page or class, the named precedent is authoritative and must be opened and compared behaviourally, not structurally. Known pairs: new dashboard pages mirror `ParentDashboardPlaceholderPage.vue` (note it seeds its own `creditLoading`/`approvalsLoading` refs to `true`, which store-backed loading flags do NOT do — they initialise `false`); new resource authorization ITs mirror the `@WebMvcTest` + inline `@TestConfiguration`/`TestSecurityConfig` shape used by every `*IT` in `platform/payment/api/`, which is an established divergence from project-context.md's `@SpringBootTest` + Testcontainers rule and is NOT a violation to report.",

  # Project-specific trap, found the hard way in deferred-141.
  "`SecurityUtil.getCurrentCoachUserId()` is role-agnostic despite its name — it only parses the current principal's `businessId`, and is behaviourally identical to `requireCurrentUserId()`. There is no `getCurrentUserId()` on this class. Do not report it as returning a coach-specific id, and do not prescribe a method that does not exist; the correct recommendation on a multi-role path is `requireCurrentUserId()`, which is what `BookingResource.currentParentId()` already uses.",
]
